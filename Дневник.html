<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Дневник</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link id="fav" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%235b7f6e'/%3E%3Crect%20x='15'%20y='13'%20width='7'%20height='38'%20rx='3.5'%20fill='%2341604f'/%3E%3Crect%20x='20'%20y='13'%20width='29'%20height='38'%20rx='3'%20fill='%23f7f6f3'/%3E%3Cpath%20d='M38%2013h7v20l-3.5-3.5L38%2033z'%20fill='%23b4713f'/%3E%3Crect%20x='25'%20y='39'%20width='19'%20height='2.6'%20rx='1.3'%20fill='%23c9d3cd'/%3E%3Crect%20x='25'%20y='44.5'%20width='12'%20height='2.6'%20rx='1.3'%20fill='%23c9d3cd'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f7f6f3; --surface:#fff; --surface-2:#fbfaf8;
  --line:#e6e3dc; --line-soft:#efece6;
  --ink:#2c2a26; --ink-2:#6b665e; --ink-3:#9a938a;
  --accent:#5b7f6e; --accent-soft:#e8f0ec; --accent-2:#b4713f;
  --warn:#c4553f; --sleep:#6c7fa8;
  --r:14px; --shadow:0 1px 2px rgba(44,42,38,.05),0 4px 16px rgba(44,42,38,.04);
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#17181a; --surface:#1f2124; --surface-2:#25282c;
  --line:#33373c; --line-soft:#2a2d31;
  --ink:#e8e6e2; --ink-2:#a5a29c; --ink-3:#77746f;
  --accent:#7ba894; --accent-soft:#243330; --accent-2:#d18f5c;
  --warn:#e0725a; --sleep:#8fa3cc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.app{max-width:920px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.top-in{max-width:920px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:9px}
.top h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--ink-3);font-weight:400}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  width:34px;height:34px;display:grid;place-items:center;padding:0;font-size:15px;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sync-dot.ok{background:var(--accent)}.sync-dot.err{background:var(--warn)}
.sync-dot.busy{background:var(--accent-2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:500}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.view{display:none;padding:16px 0 24px;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card>h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card>h2 .right{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink-3);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* Лёг, Встал и Вышло — та же схема, что у ряда оценки: подпись сверху,
   элемент под ней ровно 36px. «Вышло» раньше несло подпись внутри рамки
   и потому выбивалось из ряда — теперь это такая же колонка, отличается
   только цветом, потому что значение вычисляется, а не вводится.
   Переноса нет намеренно: втроём это одна мысль, разорванная читается
   хуже. Поля времени жмутся, «Вышло» занимает по содержимому. */
.sleep-row{display:flex;gap:6px;align-items:flex-end;flex-wrap:nowrap}
.sleep-row input[type=time]{height:36px;padding:0 6px;min-width:0;width:100%;text-align:center}
/* «Вышло» — по содержимому: сжиматься ему некуда, там «7 ч 42 м» */
.bt-col.auto{flex:0 0 auto}
.ro.out{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.ro.out>b{color:var(--accent);white-space:nowrap;font-size:14px}
.row{display:flex;align-items:center;gap:9px}
.spacer{flex:1}.muted{color:var(--ink-3)}.small{font-size:12.5px}
label.fld{display:block}
label.fld>span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],textarea,select{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;outline:none;transition:border-color .15s,background .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:9px 14px;font-weight:500;font-size:14px;transition:.15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
/* квадратные кнопки навигации по дням: не растягиваются и не переносят текст */
.btn.nav{width:34px;height:34px;padding:0;flex:none;display:grid;place-items:center;
  line-height:1;font-size:15px}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.btn:disabled{opacity:.4;cursor:default}
/* ---- голосовой ввод ---- */
.mic-row{display:flex;align-items:center;gap:9px;margin-top:7px}
.btn.mic{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;font-size:13px;flex:none}
.btn.mic svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.btn.mic.rec{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.mic.rec svg{stroke:#fff}
/* пульсация показывает, что микрофон открыт: без неё запись легко забыть выключить */
.btn.mic.rec::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;
  flex:none;animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
@media(prefers-reduced-motion:reduce){.btn.mic.rec::before{animation:none}}
.mic-note{font-size:12px;color:var(--ink-3);line-height:1.45;min-width:0}
.mic-note.err{color:var(--warn)}
/* серым — то, что распознаётся прямо сейчас и ещё может измениться */
.mic-live{color:var(--ink-3);font-style:italic}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:13px;color:var(--ink-2);transition:.15s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.pill{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:9px 11px;transition:.15s;font-size:14px}
.pill .box{width:20px;height:20px;border-radius:6px;border:1.7px solid var(--line);flex:none;
  display:grid;place-items:center;background:var(--surface);transition:.15s}
.pill .box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pill.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.on .box{background:var(--accent);border-color:var(--accent)}
.pill.on .box svg{opacity:1}
.pill .nm{flex:1;min-width:0}
.pill .tm{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* Ряд оценки ночи: ручная оценка, оценка браслета и минимальный пульс.
   Все три колонки устроены одинаково — подпись сверху, элемент под ней
   ровно 36px высотой, — поэтому подписи стоят на одной строке, а сами
   элементы на одном уровне. Раньше подпись оценки висела над рядом,
   а у ячеек была внутри: отсюда и разнобой, и лишняя высота.
   Ряд не переносится намеренно: оценка ночи читается как одно целое.
   Вместо переноса ячейки сжимаются (flex:1 1 0 при min-width:0), а
   кнопки оценки держат свою ширину — по ним нажимают пальцем. */
.body-top{display:flex;gap:6px;align-items:flex-end;flex-wrap:nowrap}
.bt-col{flex:1 1 0;min-width:0}
.bt-col.fix{flex:none}
.bt-lb{display:block;font-size:11px;color:var(--ink-3);margin-bottom:5px;line-height:1.35;
  white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.ro{height:36px;display:grid;place-items:center;padding:0 6px;overflow:hidden;
  border:1px solid var(--line-soft);background:var(--surface-2);border-radius:9px}
.ro>b{font-size:15px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
/* Прочерк в день без выгрузки. Модификатор называется `dash`, а не `empty`:
   класс `.empty` в этих же стилях занят заглушкой «здесь пока пусто» с
   отступом 26px, специфичность у него такая же, а объявлен он ниже — и
   ячейка в пустые дни вырастала вдвое против кнопок оценки. */
.ro.dash>b{color:var(--ink-3);font-weight:400}
/* Уточнение в подписи — первое, чем жертвуем на узком экране: лучше
   короткое слово целиком, чем длинное, обрезанное многоточием. */
.bt-lb .xs{font-style:normal}
@media(max-width:379px){.bt-lb .xs{display:none}}
.rate{display:flex;gap:5px;flex-wrap:nowrap}
.rate button{width:30px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  font-size:13px;color:var(--ink-3);padding:0;flex:none;transition:.12s}
@media(max-width:399px){.rate{gap:4px}.rate button{width:27px}}
.rate button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
input[type=range]{width:100%;-webkit-appearance:none;background:none;height:26px}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.2);margin-top:-8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.tile{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px}
.tile .v{font-size:21px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .k{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.up{color:var(--accent)}.down{color:var(--warn)}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);margin-bottom:9px}
.item h3{font-size:15px;margin-bottom:3px}
.item .meta{font-size:12px;color:var(--ink-3)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm i{aspect-ratio:1;border-radius:5px;background:var(--line-soft);display:block;position:relative}
/* рабочий день — точка в углу клетки */
.hm i.wk::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;
  border-radius:50%;background:color-mix(in srgb,var(--ink) 45%,transparent)}
.hm i.d1{background:color-mix(in srgb,var(--accent) 26%,var(--surface-2))}
.hm i.d2{background:color-mix(in srgb,var(--accent) 52%,var(--surface-2))}
.hm i.d3{background:color-mix(in srgb,var(--accent) 78%,var(--surface-2))}
.hm i.d4{background:var(--accent)}
.hm i.today{outline:2px solid var(--accent-2);outline-offset:1px}
.hm.hm-act i{cursor:pointer;transition:transform .12s}
.hm.hm-act i:hover{transform:scale(1.28);outline:1.5px solid var(--ink-3);outline-offset:1px}
.hm.hm-act i:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.hm i.pick{outline:2px solid var(--ink);outline-offset:1px}
canvas{width:100%;display:block}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(20,19,17,.42);backdrop-filter:blur(2px)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:540px;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.16);animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media(min-width:560px){.modal{align-items:center}.sheet{border-radius:16px;animation:fade .18s}}
.sheet h2{font-size:17px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;
  z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,-6px)}
.empty{text-align:center;padding:26px 16px;color:var(--ink-3);font-size:13.5px}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:14px 0}
details summary{cursor:pointer;font-size:13px;color:var(--accent);padding:5px 0}
code{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:5px;padding:1px 5px;font-size:12.5px}
.tag{color:var(--accent);font-weight:500}
/* бейдж рабочего дня в строке с датой: тап переключает, удержание — сброс */
.wbadge{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
  padding:6px 9px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;
  gap:5px;transition:.15s;white-space:nowrap;flex:none;position:relative}
.wbadge:hover{border-color:var(--ink-3)}
.wbadge .lb{font-size:12px}
.wbadge.work{background:color-mix(in srgb,var(--accent-2) 13%,var(--surface));
  border-color:color-mix(in srgb,var(--accent-2) 42%,transparent);color:var(--accent-2);font-weight:600}
/* точка-метка: день правили руками */
.wbadge.man::after{content:"";position:absolute;top:3px;right:3px;width:4px;height:4px;
  border-radius:50%;background:currentColor;opacity:.55}
@media(max-width:420px){.wbadge .lb{display:none}.wbadge{padding:6px 8px}}
.score-big{font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.agroup+.agroup{margin-top:13px}
.ghd{font-size:11.5px;color:var(--ink-3);margin-bottom:6px;letter-spacing:.02em}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
/* Плитка должна оставаться удобной для тапа, но значок и короткое название
   не требуют прежних 10px сверху и снизу: 7px делает ряд на 6px ниже,
   не превращая его в мелкую цель для пальца. */
.act{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:7px 8px;
  text-align:center;transition:.15s;position:relative}
.act .ic{font-size:18px;line-height:1.2}
.act .lb{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.act .n{position:absolute;top:5px;right:6px;font-size:11px;font-weight:700;color:var(--accent);opacity:0}
.act.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.act.on .lb{color:var(--ink)}
.act.on .n{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div style="flex:1;min-width:0"><h1 id="ttl">День</h1><div class="sub" id="sub"></div></div>
  <span class="sync-dot" id="syncDot" title="Синхронизация"></span>
  <button class="icon-btn" id="themeBtn" title="Тема">◐</button>
</div></header>
<main class="app">
  <section class="view on" id="v-day"></section>
  <section class="view" id="v-diary"></section>
  <section class="view" id="v-goals"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-notes"></section>
</main>
<nav class="tabs"><div class="tabs-in" id="tabbar"></div></nav>

 концлагере. Виктор Франкл","Курсы:","Наставник в IT: как давать обратную связь, мотивировать и решать конфликты","Soft skills: ключевые навыки руководителя","Положительные установки:","Я умный","Стремлюсь к ЗОЖ","Я интересный собеседник","Я достойный мужчина в глазах женщин","Я всё делаю качественно и довожу до конца","Сильные стороны и ресурсы:","Аналитическое и критическое мышление","Высокий уровень эмпатии и EQ","Занимаюсь физкультурой","Стремлюсь к ЗОЖ","Есть свободное время","Нет вредных привычек","Развитое чувство юмора","Разбираюсь в компьютерах, умею паять, ремонтировать электронику","Разбираюсь в психологии и отношениях","Читаю книги по саморазвитию"],"insights":["🧭 Кто я сейчас\nЯ — практик с инженерной жилкой и предпринимательской искрой. Умею делать руками, разбираться в системах и, что редкость, доводить дела до конца. Мои амбиции подкреплены опытом: я строил бизнес-планы, запускал мини-проекты, показывал лучшие результаты на работах и собирал сильные кейсы.\n\nПри этом у меня высокий эмоциональный интеллект и социальный дар — я легко нахожу общий язык с людьми, особенно с женщинами, и считаюсь хорошим собеседником. Мои ценности — свобода, здоровье, путешествия, самореализация. Я люблю разнообразие и движение: дни, наполненные делами и разъездами, заряжают меня энергией, а вызовы и приключения — мой топливо.\n\nВо мне живёт мощный внутренний двигатель: привычка учиться, тренироваться и брать ответственность делает меня самоэффективным.","⚠️ Но есть и слепые зоны\nЯ сильно завишу от внешней среды: холод, серость и дефицит живого общения заметно снижают мой тонус и мотивацию. Мои желания часто шире, чем я могу охватить — хочется «всего сразу», из-за чего трудно держать одну фокус-линию. Перфекционизм и сравнение с другими порождают прокрастинацию и излишнюю жёсткость к себе.\n\nК тому же есть нерешённые хронические вопросы со здоровьем и детские травмы — они работают как фоновый «дренаж» энергии. Любовь к новизне и дофамину иногда конкурирует с глубиной и накоплением капитала или экспертизы. А установка «я лучше остальных» хоть и даёт уверенность, но мешает учиться у других и строить долгосрочные союзы.","🔥 Что меня по-настоящему включает\nМеня заводят тёплый климат, свет, регулярные поездки и плотный ритм дня. Я кайфую от осязаемых результатов: денег за сделанную работу, видимого прогресса в теле или навыке. Публичные обещания, соревновательный контекст и среда сильных людей — мои катализаторы. Телесность тоже важна: спорт, закаливание, приключения и живое общение дают мне топливо.","🎯 Стратегия на 90 дней — в резонансе с моими ценностями\nЯ решил взять курс на фокус и выбрал квартальный горизонт. Вот мои пять ключевых направлений.\n\n1. Здоровье и энергия — фундамент всего\nПройду полную диагностику: общий анализ крови, биохимия, ТТГ/Т4, витамин D, ферритин, В12, липидный профиль, глюкоза/инсулин, CRP и ЭКГ. На основе этого составлю план по хроническим вопросам.\n\nНалажу режим сна: 7.5–8 часов, утренний свет или прогулка 20 минут, яркая лампа днём в пасмурную погоду, кофеин — только до 14:00.\n\nТренировки: 3 силовых full-body в неделю + 2 кардио по 20–30 минут (бег или велосипед), шаги 8–10 тысяч в день. Буду отслеживать прогресс еженедельно.\n\nПитание: 1.4–1.6 г белка на килограмм веса, овощи каждый день, сладкое и алкоголь по правилу 80/20, алкоголь — максимум 2 раза в месяц.\n\nПсихика: 8–12 сессий с терапевтом (КПТ/EMDR) для проработки травм, плюс ежедневный журнал триггеров по схеме: факт → мысль → эмоция → новое толкование.\n\n2. Доход и долги — системный подход\nЗа неделю настрою финансовую систему: учёт, автопереводы, «коробочки» под цели, план закрытия долгов снежным комом и формирование подушки в 3–6 месяцев.\nЦель на 90 дней — прибавить 100–150 тысяч рублей к текущему доходу как ступень к 300 тысячам.\n\nВыберу один из вариантов быстрых денег под мои сильные стороны:\n\nа) Сервис «компьютер-мастер / электроника / умный дом» для квартир и малого бизнеса (настройка, ремонт, сети, камеры);\n\nб) B2B-аутсорс — обслуживание 10–15 локальных офисов или кафе за фиксированную абонентскую плату;\n\nв) Маркетплейс-ниша с высокой маржой + установка и сервис как дополнительная услуга;\n\nг) Telegram-бот или мини-SaaS под конкретную боль аудитории.\n\nЗапуск за 3 недели: проведу 15 интервью с клиентами, сформулирую оффер, создам лендинг или профиль с портфолио, подготовлю 3 пакета услуг, получу 50 лидов, проведу 5 встреч и заключу 3–5 платных контрактов. Каналы: Авито, Профи, локальные чаты, рекомендации, визитки в ТЦ и коворкингах, короткие Reels с кейсами «до/после».\n\n3. Английский и ораторство — ключевые навыки\nАнглийский: 30 минут ежедневно + репетитор 2 раза в неделю. Цель — подняться с B1 до B2 за 90 дней по шкале EF SET. Также 1 раз в неделю посещаю разговорный клуб.\nОраторство: раз в неделю хожу в Toastmasters или спикер-клуб, готовлю три речи: личную историю, экспертную мини-лекцию и питч своего оффера.\n\n4. Социальный круг и семья — строю среду\nПравило «1 связь в день» — новое касание или диалог ежедневно (офлайн или онлайн). Две социальные активности в неделю: спортклуб, бизнес-клуб, языковой клуб или мастер-майнд.\nНа личном фронте: 2 свидания в неделю с фильтром по ценностям (здоровье, рост, семья), предпочтительно активного формата. Одновременно отсекаю людей, тянущих вниз — чёткая граница, вежливый разрыв и замена на тех, у кого цели созвучны моим.\n\n5. Путешествия и среда — создаю комфорт\nПланирую квартальный трип: заранее назначаю даты, закладываю бюджет и задачи (например, 2 недели зимой в тёплом месте, там же — одно выступление на английском и удалённая работа с тремя клиентами).\nДома создаю поддерживающую среду: яркий свет зимой, тёплые локации для работы (коворкинг или кафе) 3 дня в неделю, а «дни разъездов» вношу в календарь как запланированный заряд.","⏳ Ежедневные и еженедельные ритуалы\nУтро: вода, свет/прогулка, 10 минут английского, одно действие «через силу».\nДень: 1 новый контакт, работа по фокусу, 30–60 минут на оффер/продажи.\nВечер: тренировка/кардио или прогулка, короткая рефлексия — записываю 3 победы дня.\n\nКаждое воскресенье — обзор на 60 минут: финансы, здоровье, прогресс по целям, план на неделю. Плюс публичный отчёт в чате или канале (это усиливает дисциплину).","📊 Метрики контроля (раз в неделю)\nЗдоровье: часы сна, количество тренировок, шаги, масса/замеры, уровень энергии (1–10).\n\nДоход: лиды, встречи, чеки, выручка, состояние долгов и подушки.\n\nНавыки: часы английского, количество подготовленных речей, публичных выступлений.\n\nСоциум: новые контакты, встречи, свидания.\n\nСреда/путешествия: брони, билеты, часы на солнце.","🛠 Как я нейтрализую свои слепые зоны\nОт распыления — правило «1 большая цель на квартал, 3 приоритетных результата в неделю, 1 ключевое дело в день».\n\nОт перфекционизма — сначала версия 0.7, жёсткий дедлайн и публикация, затем итерации.\n\nОт зависимости от погоды — лампа 10 000 люкс, утренний свет, бассейн и сауна, план «зимовки».\n\nОт дешёвого дофамина — заранее заполняю календарь «дорогими» источниками (спорт, продажи, сцена, свидания).\n\nОт одиночества — мастер-майнд из 4–6 человек с еженедельной отчётностью.","🌟 Кем я становлюсь на этой траектории\nСвободным, здоровым, социально активным профессионалом, который растит капитал навыков и денег. У меня тёплая среда и сильное окружение. Я создаю ценность, зарабатываю системно, строю отношения и семью, путешествую и остаюсь собой.","🔍 Честный взгляд: где я сейчас и что упускаю\nМои ежедневные дела частично совпадают с образом себя: спорт, ЗОЖ, закаливание и дисциплина видны. Но не хватает системности в деньгах, окружении и навыках (английский, публичные выступления). Бывают «ломающие» дни — алкоголь или недосып, после которых рутина разваливается.\n\nКлючевой недостающий блок — ежедневные действия, создающие деньги и сеть: продажи, лиды, встречи. Без этого цель 300 тысяч в месяц и мини-бизнес буксуют.\n\nЧто важно и я упускаю:\n\nДенежный конвейер — ежедневный блок продаж/нетворкинга (иначе 300К — лотерея).\n\nДиагностика здоровья и решение хронических проблем — утечки энергии.\n\nСистемное окружение — мастер-майнд или клуб, где норма — продажи, выступления, английский.\n\nПубличные обязательства и отчётность — моя психика на это хорошо откликается.\n\nСвет/среда зимой — лампа, утренний свет, план тёплых поездок.\n\nЧёткие границы с людьми, тянущими вниз, и замена их на ускоряющих.","🚨 На что обратить особое внимание\nАлкоголь даже в малых дозах повышает ночной пульс, портит сон и сносит рутины на следующий день.\n\nСон менее 6.5 часов = падение воли и продуктивности.\n\nУтренний якорь работает: закалка + мини-кардио + 10 минут английского — день чаще «зашивается».\n\nДешёвый дофамин (включая мастурбацию) снижает мотивацию и сексуальные цели — держу рамки и окна воздержания.\n\nПерфекционизм — лечится выпуском «версии 0.7» и итерациями.","➕ Что конкретно добавляю в систему\nЕжедневно:\n\nДеньги: 45–60 минут на «коробку продаж» — 10 касаний (5 исходящих сообщений/звонков, 3 follow-up, 2 новые возможности). Веду счётчик.\n\nАнглийский: 30 минут (15 говорение + 15 чтение/повтор) + 2 раза в неделю с преподавателем или в клубе.\n\nДвижение: 10–20 минут кардио или 8–10 тысяч шагов, 3 силовые в неделю.\n\nУтренний свет/лампа 10–20 минут, особенно в серые дни.\n\nЖурнал на 5 минут: факт → мысль → эмоция → новый фрейм; 3 победы дня.\n\nЕженедельно:\n\n2 социальные активности (языковой/бизнес-клуб, спорт, встречи).\n\n1 публичное действие: пост с отчётом, мини-кейс или мини-выступление.\n\nВоскресный обзор: финансы, лиды, здоровье, навыки, план недели.","💼 Про бизнес и доход — мой выбор\nЯ выбираю один «денежный трек» на 12 недель:\n\nа) сервис «компьютер/электроника/умный дом» (B2C или B2B с абонплатой), либо\n\nб) нишевой Telegram-бот или мини-SaaS под конкретную боль.\n\nПлан запуска за 3 недели: 15 интервью → 1 оффер → лендинг/портфолио → 3 пакета услуг → 50 лидов → 5 встреч → 3 платных клиента. Каналы: Авито, Профи, локальные чаты, рекомендации, Reels «до/после».","🩺 Про здоровье — конкретные шаги\nСдаю анализы: ОАК, биохимия, ТТГ/Т4, ферритин, В12, витамин D, липидный профиль, глюкоза/инсулин, CRP, ЭКГ. Дальше — план с врачом.\nРамки алкоголя: максимум 2 эпизода в месяц, не накануне важных дней.\nСон: 7.5–8 часов, кофеин до 14:00.","👥 Окружение и личная жизнь\nФормирую мастер-майнд из 4–6 человек с еженедельной отчётностью.\n1 новый контакт в день, 2 свидания в неделю — фильтр по ценностям (здоровье, рост, семья). Отсекаю людей, тянущих вниз, вежливо разрываю и заменяю на «ускорителей».","🎯 Кем я хочу стать и мои шансы\nСейчас я — сильный, деятельный, высокоэмпатичный инженер-предприниматель, любящий движение и вызовы, с доказанными победами. Но я энергозависим от среды (свет/климат), временами распыляюсь и позволяю алкоголю/недосыпу ломать рутину.\n\nХочу стать — здоровым, финансово свободным, семейным и социально активным профессионалом, который зарабатывает системно, выступает публично, путешествует и живёт в тёплой среде часть года.\n\nМои шансы высоки — если поставлю систему. С моими ресурсами и опытом мини-бизнес и 300К+ в месяц реалистичны за 6–12 месяцев при ежедневном продажном конвейере и фокусе на одной нише 12 недель. Большинство целей (здоровье, английский B2, публичка, социальный круг, регулярные путешествия) достижимы за 12–24 месяца при описанной системе. Долгосрочные (недвижимость в Тае, дом с баней, семья) — горизонт 2–5 лет, если держать дисциплину и наращивать денежный поток.","🚀 Первые 14 дней — быстрый старт\nСдать анализы и записаться к врачу.\n\nНастроить финансовую систему: учёт, «коробочки», автопереводы, план закрытия долгов.\n\nВыбрать 1 нишу дохода, провести 10 клиентских интервью.\n\nСделать лендинг/анкету + 3 пакета услуг, запустить ежедневный блок продаж.\n\nКупить/включить лампу 10 000 люкс; утренний свет каждый день.\n\nЗавести «коробку английского» — 30 минут в день, записаться в разговорный клуб.\n\nВступить в мастер-майнд или клуб, назначить 2 социальные активности в неделю."],"zh_list":["пер const SHIFT_ANCHOR='2026-09-03', SHIFT_LEN=4, SHIFT_WORK=2;

};

/* ---- разбор старого поля sex ----
   В таблице это была свободная пометка: «+», «++», «1» — было; «-» — не было;
   «р», «Р», «руч», «Лр» — рукой; плюс отдельные буквы «м», «с», «Л», «др»,
   смысл которых утрачен — считаем их за секс, как и любую непустую пометку.
   Комбинации вида «+ р» и «руч Л» означают сразу и то и другое. */
function parseSex(v){
  const s=String(v??'').trim();
  if(!s||s==='-') return {sexn:0,hand:0};
  const low=s.toLowerCase();
  /* «р» как отдельное слово или «руч» в любом месте; «др» не в счёт */
  const hand=/(^|[^а-яё])(р|руч\w*)($|[^а-яё])/.test(low) || /(^|[^а-яё])л?р$/.test(low);
  /* остаток строки без «ручных» кусков: если что-то осталось — был и секс */
  const rest=low.replace(/руч\w*/g,'').replace(/(^|[^а-яё])р($|[^а-яё])/g,'$1$2').trim();
  const plus=(s.match(/\+/g)||[]).length;
  const sexn = plus ? Math.min(plus,3) : (rest?1:0);
  return {sexn, hand:hand?1:0};
}

function migrateActs(){
  if(DB.actsV>=ACTS_V) return;
  if(DB.actsV>=2){ /* с v2 переносим только упражнения */
    for(const x of Object.values(DB.days||{})) migrateEx(x);
    DB.actsV=ACTS_V; return;
  }
  /* Версия 1 уже стёрла поле sex, а пометки «Руч» жили именно в нём.
     Достаём исходные значения из вшитого seed — там данные нетронуты. */
  let orig={};
  if(DB.actsV===1){
    try{
      const el=$('#seed');
      if(el&&el.textContent.trim()) orig=(JSON.parse(el.textContent).days)||{};
    }catch(e){ console.warn('seed для sex недоступен',e) }
  }
  for(const[d,x]of Object.entries(DB.days||{})){
    const e=+x.eng||0;
    if(e>=1) x.eng_duo=1;
    if(e>=2) x.eng_ai=1;
    if(e>=3) x.eng_nat=1;
    delete x.eng;
    const s=+x.social||0;
    if(s) x.friends=Math.min(s,3);
    delete x.social;
    const raw = x.sex!=null ? x.sex : (orig[d]||{}).sex;
    if(raw!=null){
      const {sexn,hand}=parseSex(raw);
      if(sexn) x.sexn=sexn; else delete x.sexn;
      if(hand) x.hand=hand;
    }
    delete x.sex;
    migrateEx(x);
  }
  DB.actsV=ACTS_V;
}

/* удаляются из истории как мусорные записи */
const SUPP_DROP=['сон'];
/* нормализация: регистр, ё, латинские буквы-двойники, пробелы и дефисы */
const LAT={a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у',b:'в',h:'н',k:'к',m:'м',t:'т'};
const suppKey=s=>String(s??'').toLowerCase().trim()
  .replace(/ё/g,'е')
  .replace(/[aceopxybhkmt]/g,c=>LAT[c])
  .replace(/[\s\-_.]+/g,'');
const SUPP_CANON=(()=>{const m={};
  for(const[k,v]of Object.entries(SUPP_MERGE)){m[suppKey(k)]=k;v.forEach(a=>m[suppKey(a)]=k)}
  return m})();
const SUPP_FULLK=Object.keys(SUPP_MERGE).map(n=>[suppKey(n),n]);

const canonSupp=n=>{
  const t=String(n??'').trim();
  if(!t) return '';
  const k=suppKey(t);
  if(!k||SUPP_DROP.some(d=>suppKey(d)===k)) return '';
  if(SUPP_CANON[k]) return SUPP_CANON[k];
  /* обрубок: подтягиваем к полному названию, которое с него начинается.
     Только при однозначном совпадении — иначе «вит» съел бы все витамины разом. */
  if(k.length>=3){
    const hits=SUPP_FULLK.filter(([fk])=>fk.startsWith(k));
    if(hits.length===1) return hits[0][1];
  }
  /* витамины пишутся слитно и вразнобой: витд, вит-д, вд, виае */
  const vit=k.match(/^(?:вит\w*?|в)([дdсcвbае]{1,3})$/);
  if(vit){
    const L=vit[1].replace(/[dcb]/g,c=>({d:'д',c:'с',b:'в'}[c]));
    if(L==='д') return 'витамин d';
    if(L==='с') return 'витамин c';
    if(L==='в') return 'витамин b';
    if(/^а?е$|^ае$|^е$/.test(L)) return 'витамин a+e';
  }
  /* незнакомое название тоже с маленькой буквы — справочник ведём единообразно */
  return t.toLowerCase();
};

function seedFromFile(){
  try{
    const el=$('#seed');
    if(!el||!el.textContent.trim()){ migrateSupps(); return } // опубликованная версия: данные придут из облака
    const s=JSON.parse(el.textContent);

       формат: плоский массив целей, справочник добавок объектами, разделы.
       Первый, рукописный формат (suppDict и цели, разложенные по месяцам)
       разбираем по-прежнему: такой файл мог остаться у кого-то на руках. */
    if(Array.isArray(s.goals)){
      DB=Object.assign(BLANK(),s);
    }else{
      DB.days=s.days||{}; DB.notes=s.notes||{}; DB.supps=(s.suppDict||[]).map(n=>({id:uid(),name:n,slot:'day'}));
      DB.goals=flattenGoals(s.goals||{});

    /* Время правки берём из выгрузки, если оно там есть: иначе свежая копия
       выглядит новее облачной и синхронизация не подтянет более поздние дни. */
    if(!DB.updated) DB.updated=Date.now();

/* сводит варианты названий к единым и сортирует справочник по частоте приёма */
function migrateSupps(force){
  if(DB.suppV===SUPP_V && !force) return;
  const freq={};
  for(const d of Object.values(DB.days||{})){
    if(!Array.isArray(d.supp)) continue;
    const seen=[];
    for(const raw of d.supp){
      const n=canonSupp(raw);
      if(!n||seen.includes(n)) continue;
      seen.push(n); freq[n]=(freq[n]||0)+1;
    }
    d.supp=seen;
  }
  const names=new Set([...Object.keys(freq), ...Object.keys(SUPP_MERGE),
    ...(DB.supps||[]).map(s=>canonSupp(s.name))].filter(Boolean));
  DB.supps=[...names].sort((a,b)=>(freq[b]||0)-(freq[a]||0)||a.localeCompare(b,'ru'))
    .map(n=>({id:uid(),name:n,slot:'day',n:freq[n]||0}));
  /* всё, что не удалось привести к полному названию */
  DB.suppUnknown=[...names].filter(n=>!SUPP_MERGE[n])
    .map(n=>({name:n,n:freq[n]||0})).sort((a,b)=>b.n-a.n);
  DB.suppV=SUPP_V;
}

function flattenGoals(g){
  const out=[];
  const push=(list,scope)=>(list||[]).forEach(t=>out.push({id:uid(),text:t,scope,done:false,created:today()}));
  Object.entries(g.month||{}).forEach(([k,v])=>{
    if(/побед/i.test(k)) return;
    push(v, /глобал/i.test(k)?'life' : /регуляр/i.test(k)?'regular' : 'month');
  });
  Object.entries(g.year||{}).forEach(([k,v])=>{ if(/сильн/i.test(k))return; push(v,'year'); });
  Object.entries(g.phuket||{}).forEach(([k,v])=>push(v,'phuket'));
  return out;
}
/* ---- разбор «Глобальных» на разделы ----
   Список был одной простыней с заголовками-строками вида «Бизнес:».
   Заголовок задаёт раздел для всего, что идёт следом, и сам из списка убирается. */
const GOALS_V=2;
const GOAL_SECT=[[/^бизнес:?$/i,'biz'],[/^самооценка:?$/i,'self'],
  [/^изменения\s*\/\s*развитие:?$/i,'grow'],[/^общение:?$/i,'talk']];
/* эти четыре раздела — не цели, а мысли: их место в Заметках */
const TO_NOTES=['biz','self','grow','talk'];
function migrateGoals(){
  if(DB.goalsV>=GOALS_V) return;
  if(!(DB.goalsV>=1)){
    const out=[]; let sc=null;
    for(const g of DB.goals||[]){
      if(g.scope!=='life'){ out.push(g); sc=null; continue }
      const t=String(g.text||'').trim();
      const hit=GOAL_SECT.find(([re])=>re.test(t));
      if(hit){ sc=hit[1]; continue }        // заголовок в список не переносим
      if(sc) g.scope=sc;
      out.push(g);
    }
    DB.goals=out;
  }
  /* v2: разделы-мысли уезжают в Заметки, «100 хочу» — наоборот, в Цели */
  DB.notes=DB.notes||{};
  const keep=[];
  for(const g of DB.goals||[]){
    if(TO_NOTES.includes(g.scope)){
      const l=DB.notes[g.scope]=DB.notes[g.scope]||[];
      if(!l.includes(g.text)) l.push(g.text);
    } else keep.push(g);
  }
  DB.goals=keep;
  for(const t of DB.notes.wish||[]){
    if(!DB.goals.some(g=>g.scope==='wish'&&g.text===t))
      DB.goals.push({id:uid(),text:t,scope:'wish',done:false,created:today()});
  }
  delete DB.notes.wish;
  DB.goalsV=GOALS_V;
}

   в выгрузках и в облаке, поэтому вычищаем их при каждой загрузке.
   Возвращает true, если что-то удалили — вызывающий сохранит результат. */
const SEC_DROP=['zh_thoughts'];
function migrateClean(){

/* Оценка дня — сумма всех кнопок: Спорт плюс каждая активность,
   причём кнопка, нажатая трижды, даёт три балла. Не считается только
   помеченная w0 («Руч»): это наблюдение, а не достижение.
   w0 проверяем прямо здесь, а не только через CFG.weights: настройки
   лежат отдельным ключом в localStorage и могут прийти из старой
   версии, где нынешних кнопок ещё не было. */
function score(d){
  const x=DB.days[d]; if(!x) return 0;
  let s=0;
  for(const a of ACTS){
    if(a.w0) continue;
    const v = a.k==='sport' ? (x.sport?1:0) : (+x[a.k]||0);
    s+=v*(CFG.weights[a.k]??1);
  }
  return Math.round(s*10)/10;
}

/* ---- синхронизация: Google Drive через OAuth ----
   Файл dnevnik.json лежит в скрытой папке приложения на вашем Диске
   (appDataFolder) — не мешается среди файлов и виден только этой странице. */
const GFILE='dnevnik.json', GSCOPE='https://www.googleapis.com/auth/drive.appdata';
let st=null,syncing=false,tok=null,tokExp=0,gis=null;
const fmtTS=t=>t?new Date(+t).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';

function dot(s,t){const e=$('#syncDot');e.className='sync-dot'+(s?' '+s:'');e.title=t||'Синхронизация'}
function queuePush(){clearTimeout(st);st=setTimeout(()=>push().catch(()=>{}),2500)}
const signedIn=()=>!!tok&&Date.now()<tokExp;

function loadGIS(){
  if(window.google?.accounts?.oauth2) return Promise.resolve();
  if(gis) return gis;
  gis=new Promise((ok,no)=>{
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client'; s.async=true;
    s.onload=ok; s.onerror=()=>no(new Error('не загрузился скрипт Google — проверьте интернет'));
    document.head.appendChild(s);
  });
  return gis;
}
/* silent=true — молча продлеваем токен, без всплывающего окна */
async function auth(silent){
  if(signedIn()) return tok;
  if(!CFG.clientId) throw new Error('не указан Client ID');
  await loadGIS();
  return new Promise((ok,no)=>{
    const c=google.accounts.oauth2.initTokenClient({
      client_id:CFG.clientId, scope:GSCOPE,
      callback:r=>{
        if(r.error) return no(new Error(r.error==='access_denied'?'вход отменён':r.error));
        tok=r.access_token; tokExp=Date.now()+(+r.expires_in||3600)*1000-60000;
        CFG.everSignedIn=true; saveCfg(); ok(tok);
      },
      error_callback:e=>no(new Error(e.type==='popup_closed'?'окно входа закрыто':(e.message||'ошибка входа')))
    });
    c.requestAccessToken({prompt:silent?'none':''});
  });
}
function signOut(){
  if(tok&&window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(tok,()=>{});
  tok=null;tokExp=0;CFG.everSignedIn=false;saveCfg();dot('','Не подключено');
}
const gapi=async(url,opt={})=>{
  const t=await auth(true).catch(()=>auth(false));
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});
  if(r.status===401){tok=null;return gapi(url,opt)}
  if(!r.ok) throw new Error('Google ответил '+r.status+': '+(await r.text()).slice(0,120));
  return r;
};
async function findFile(){
  if(CFG.fileId) return CFG.fileId;
  const r=await gapi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder'+
    '&q='+encodeURIComponent(`name='${GFILE}'`)+'&fields=files(id,modifiedTime)&pageSize=1');
  const j=await r.json();
  if(j.files?.length){CFG.fileId=j.files[0].id;saveCfg();return CFG.fileId}
  return null;
}
/* Время правки облачного файла — дешёвый запрос без самих данных.
   Нужен, чтобы отправка не затирала чужие записи вслепую. */
async function cloudTime(id){
  try{
    const r=await gapi('https://www.googleapis.com/drive/v3/files/'+id+'?fields=modifiedTime');
    return (await r.json()).modifiedTime||'';
  }catch(e){ return '' }
}
/* force=true — «отправить поверх»: пользователь уже видел предупреждение */
async function push(force){
  if(syncing||!CFG.clientId) return;
  syncing=true;dot('busy','Отправка…');
  try{
    const id=await findFile();
    /* Между нашей последней загрузкой и этой отправкой в облако мог написать
       телефон. Молча затирать его нельзя: это потеря записей без следа. */
    if(id&&!force&&CFG.cloudSeen){
      const t=await cloudTime(id);
      if(t&&t>CFG.cloudSeen){
        dot('err','В облаке более свежая копия');
        throw new Error('CONFLICT|'+t);
      }
    }
    const meta={name:GFILE,mimeType:'application/json',...(id?{}:{parents:['appDataFolder']})};
    const bnd='b'+uid();
    const body=`--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+
      JSON.stringify(meta)+`\r\n--${bnd}\r\nContent-Type: application/json\r\n\r\n`+
      JSON.stringify(DB)+`\r\n--${bnd}--`;
    const r=await gapi('https://www.googleapis.com/upload/drive/v3/files'+
      (id?'/'+id:'')+'?uploadType=multipart&fields=id,modifiedTime',
      {method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bnd},body});
    const j=await r.json(); if(j.id)CFG.fileId=j.id;
    if(j.modifiedTime)CFG.cloudSeen=j.modifiedTime;
    CFG.lastSync=Date.now();saveCfg();
    dot('ok','Сохранено '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){if(!/^CONFLICT\|/.test(e.message))dot('err','Ошибка: '+e.message);throw e}
  finally{syncing=false}
}
/* Возвращает, что именно произошло: 'got' | 'same' | 'local' | 'empty'.
   Раньше два последних случая выглядели одинаково — «прошло без ошибок», —
   и отсюда бралось ощущение, что синхронизация работает, а данных нет. */
async function pull(silent,force){
  if(!CFG.clientId){if(!silent)toast('Сначала укажите Client ID');return}
  if(silent&&!CFG.everSignedIn) return;
  syncing=true;dot('busy','Загрузка…');
  try{
    const id=await findFile();
    if(!id){dot('ok','В облаке пока пусто'); if(!silent)toast('В облаке пока пусто');return 'empty'}
    const j=await (await gapi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).json();
    CFG.cloudSeen=await cloudTime(id);
    const cu=j?.updated||0, lu=DB.updated||0;
    let res='same';
    if(cu>lu||force){
      DB=Object.assign(BLANK(),j);
      if(DB.suppV!==SUPP_V) migrateSupps();
      migrateActs(); migrateGoals(); migrateClean(); initFilters();
      localStorage.setItem(LS,JSON.stringify(DB)); render();
      res='got'; if(!silent)toast('Загружено из облака');
    } else if(cu<lu){
      res='local'; if(!silent)toast('Здесь копия свежее облачной');
    } else if(!silent) toast('Уже одно и то же');
    CFG.lastSync=Date.now();saveCfg();
    dot('ok','Синхронизировано');
    return res;
  }catch(e){dot('err',e.message); if(!silent)toast('Не удалось: '+e.message)}
  finally{syncing=false}
}

/* Компактный бейдж рядом с датой: значок и короткая подпись.
   Тап переключает, долгое нажатие возвращает день к графику. */
/* Значение с браслета в ряду оценки сна. Поля ввода тут нет намеренно:
   это первичные данные прибора, руками они не правятся — при следующем
   импорте правка всё равно была бы затёрта. Пустая ячейка остаётся
   на месте, чтобы ряд не прыгал в дни без выгрузки. */
function roBox(label,v,hint){
  return `<div class="bt-col" title="${esc(hint)}"><span class="bt-lb">${label}</span>
    <div class="ro${v==null?' dash':''}"><b>${v==null?'—':v}</b></div></div>`;
}
/* строка с остальным, что принёс браслет: показываем только если данные есть.
   Оценка сна и минимальный пульс сюда не входят — они выше, в ряду оценки. */
function bandLine(x){
  const p=[];
  if(x.restHr!=null)  p.push(`пульс покоя <b>${x.restHr}</b>`);
  if(x.deepMin!=null) p.push(`глубокий <b>${fmtH(x.deepMin/60)}</b>`);
  if(x.remMin!=null)  p.push(`быстрый <b>${fmtH(x.remMin/60)}</b>`);
  if(!p.length) return '';
  return `<div class="small muted" style="margin-top:9px">⌚ ${p.join(' · ')}</div>`;
}
function workBadge(d){
  const w=isWork(d), man=workManual(d);

function bindDay(){

     убираем — день снова следует за сменами. Удержание сбрасывает к графику. */
  const wb=$('#wkBtn'); let wHeld=false, wT=null;
  wb.onclick=()=>{
    if(wHeld){wHeld=false;return}
    const v=!isWork(cur);
    if(v===shiftWork(cur)) delete x.work; else x.work=v?1:0;
    save(); rDay();
  };
  wb.addEventListener('pointerdown',()=>{
    clearTimeout(wT); wHeld=false;
    wT=setTimeout(()=>{
      if(!workManual(cur)) return;
      wHeld=true; if(navigator.vibrate)navigator.vibrate(15);
      delete x.work; save(); rDay(); toast('Вернул по графику');
    },450);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>wb.addEventListener(ev,()=>clearTimeout(wT)));
  $('#sq').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
    const v=+b.dataset.v; x.slept=x.slept===v?0:v; save(); rDay()};
  $('#wt').onchange=e=>{x.weight=+e.target.value||undefined;save()};
  $('#stp').onchange=e=>{x.steps=+e.target.value||undefined;save()};
  /* Точечно обновляем итог, без rDay(): на десктопе стрелки в поле времени
     шлют change на каждый шаг, и полная перерисовка выбивала бы фокус. */
  const sleepIn=()=>{
    x.bed=$('#bd').value||undefined; x.rise=$('#rs').value||undefined;
    const h=hoursBetween(x.bed,x.rise);
    if(h!=null) x.sleepH=h; else delete x.sleepH;   // пара распалась — итог не оставляем
    const txt=x.sleepH!=null?fmtH(x.sleepH):'—';
    $('#shOut').textContent=txt;
    $('#sleepTot').textContent=x.sleepH!=null?txt:'';
    save();
  };
  $('#bd').onchange=sleepIn; $('#rs').onchange=sleepIn;
  $('#bd').onblur=()=>rDay(); $('#rs').onblur=()=>rDay();
  const shc=$('#shClr'); if(shc)shc.onclick=()=>{
    delete x.bed; delete x.rise; delete x.sleepH; save(); rDay()};
  $$('.sp').forEach(b=>b.onclick=()=>{
    x.supp=x.supp||[]; const nm=b.dataset.n;
    const i=x.supp.indexOf(nm); i<0?x.supp.push(nm):x.supp.splice(i,1);
    save(); rDay();
  });
  const unk=$('#spUnk'); if(unk)unk.onclick=unknownSheet;
  const more=$('#spMore'); if(more)more.onclick=suppSheet;
  const add=$('#spAdd'); if(add)add.onclick=suppSheet;
  const rep=$('#rep'); if(rep)rep.onclick=()=>{x.supp=[...(DB.days[prevDayWith('supp')].supp||[])];save();rDay()};
  const clr=$('#spClr'); if(clr)clr.onclick=()=>{x.supp=[];save();rDay()};
  $('#spt').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
    x.sport=+b.dataset.v; if(!x.sport){delete x.ex; delete x.exBand} save(); rDay()};
  $$('.exi').forEach(i=>i.onchange=()=>{
    x.ex=x.ex||{}; const v=i.value.trim();
    v?x.ex[i.dataset.n]=v:delete x.ex[i.dataset.n]; save();
  });
  const bump=(k,dir)=>{
    x[k]=clamp((+x[k]||0)+dir,0,3); if(!x[k])delete x[k];
    save(); rDay();
  };
  const A=$('#acts'); let held=false, ht=null;
  A.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;
    if(held){held=false;return}
    bump(b.dataset.k, +1);
  };
  A.oncontextmenu=e=>{const b=e.target.closest('[data-k]');if(!b)return;
    e.preventDefault(); bump(b.dataset.k,-1);
  };
  const holdStart=e=>{const b=e.target.closest('[data-k]');if(!b)return;
    clearTimeout(ht); held=false;
    ht=setTimeout(()=>{held=true;
      if(navigator.vibrate)navigator.vibrate(15);
      bump(b.dataset.k,-1);
    },450)};
  const holdEnd=()=>clearTimeout(ht);
  A.addEventListener('pointerdown',holdStart);
  ['pointerup','pointerleave','pointercancel','scroll'].forEach(ev=>A.addEventListener(ev,holdEnd));
  const nt=$('#nt');
  nt.oninput=()=>{clearTimeout(nt._t);nt._t=setTimeout(()=>{
    const v=nt.value.trim(); v?x.note=v:delete x.note; save();},600)};
}

const NSEC_DEF=[['ideas','Идеи и инсайты'],
  ['wins','Победы'],['books','Книги'],['insights','Инсайты'],
  ['biz','Бизнес'],['self','Самооценка'],['grow','Изменения'],['talk','Общение'],
  ['zh_list','Ж'],['free','Свои']];
/* kind: 'goals' | 'notes'. Возвращает живой массив пар [ключ, название]. */
function secs(kind){
  const def = kind==='goals'?SCOPES_DEF:NSEC_DEF;
  DB.sec=DB.sec||{}; DB.secDel=DB.secDel||{};
  const gone=DB.secDel[kind]=DB.secDel[kind]||[];
  let L=DB.sec[kind];
  if(!Array.isArray(L)) L=DB.sec[kind]=def.map(p=>[...p]);
  /* Разделы, появившиеся в новой версии приложения, добавляем на то место,
     которое они занимают в списке по умолчанию: «Идеи и инсайты» задуманы
     первыми, а простая дописька в конец ставила бы их последними.
     Ориентир — ближайший сосед сверху, который у пользователя уже есть;
     если такого нет, раздел встаёт в начало. Порядок, переставленный
     вручную, при этом не ломается: трогаем только новые ключи.
     Удалённые вручную не воскрешаем — их ключи помним в DB.secDel. */
  def.forEach((pair,di)=>{
    const[k,n]=pair;
    if(gone.includes(k)||L.some(s=>s[0]===k)) return;
    let at=0;
    for(let i=di-1;i>=0;i--){
      const p=L.findIndex(s=>s[0]===def[i][0]);
      if(p>=0){ at=p+1; break }
    }
    L.splice(at,0,[k,n]);
  });
  return L;
}
const SCOPES=()=>secs('goals');
const NSEC=()=>secs('notes');
const secName=(kind,k)=>(secs(kind).find(s=>s[0]===k)||[,k])[1];
/* сколько записей в разделе — нужно и для подписей, и чтобы не дать
   удалить непустой раздел вместе с содержимым */
const secCount=(kind,k)=>kind==='goals'
  ? DB.goals.filter(g=>g.scope===k).length
  : ((DB.notes||{})[k]||[]).length;

/* Окно «Разделы»: переименование, добавление, удаление пустых. */
function sectionsSheet(kind,after){
  const title=kind==='goals'?'Разделы целей':'Разделы заметок';
  const vis=()=>secs(kind).filter(([k])=>k!==HIDDEN_SEC||zhOpen);
  const draw=()=>{
    openSheet(`<h2>${title}</h2>
      <div id="slist">${vis().map(([k,n])=>`
        <div class="row" style="margin-bottom:8px">
          <input type="text" class="snm" data-k="${k}" value="${esc(n)}" style="flex:1;min-width:0">
          <span class="small muted" style="width:34px;text-align:right">${secCount(kind,k)}</span>
          <button class="btn ghost sdel" data-k="${k}" title="Удалить раздел">✕</button>
        </div>`).join('')}</div>
      <div class="row" style="margin-top:12px">
        <input type="text" id="snew" placeholder="Название нового раздела" style="flex:1;min-width:0">
        <button class="btn sm" id="sadd">Добавить</button></div>
      <div class="small muted" style="margin-top:10px">Удалить можно только пустой раздел —
        сначала перенесите записи.</div>
      <div class="row" style="margin-top:14px"><span class="spacer"></span>
        <button class="btn" data-close>Закрыть</button>
        <button class="btn primary" id="sok">Сохранить</button></div>`);
    $('#sadd').onclick=()=>{
      const t=$('#snew').value.trim(); if(!t) return toast('Введите название');
      apply();
      secs(kind).push(['u'+uid(),t]);
      save(); draw();
    };
    $$('.sdel').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(secCount(kind,k)) return toast('Раздел не пуст');
      if(secs(kind).length<=1) return toast('Нужен хотя бы один раздел');
      if(!confirm('Удалить раздел «'+secName(kind,k)+'»?')) return;
      apply();
      DB.sec[kind]=secs(kind).filter(s=>s[0]!==k);
      DB.secDel[kind].push(k);
      if(kind==='notes') delete (DB.notes||{})[k];
      save(); draw();
    });
    $('#sok').onclick=()=>{ apply(); save(); closeSheet(); after&&after() };
  };
  /* переносим введённые названия в данные, не закрывая окно */
  const apply=()=>{
    const L=secs(kind);
    $$('.snm').forEach(i=>{
      const t=i.value.trim(); if(!t) return;
      const s=L.find(s=>s[0]===i.dataset.k); if(s) s[1]=t;
    });
  };
  draw();
}
function rGoals(){

  $('#v-goals').innerHTML=`
  <div class="card">
    <div class="chips">
      ${scs.map(([k,n])=>`<button class="chip gf ${gfilter===k?'on':''}" data-s="${k}">${n} ${DB.goals.filter(x=>x.scope===k).length}</button>`).join('')}
      <button class="chip gf" id="gsec" title="Управление разделами">⚙</button>
    </div>
    <div style="margin-top:12px" class="row">
      <div class="bar" style="flex:1"><i style="width:${g.length?done/g.length*100:0}%"></i></div>

    </div>

  ${g.length?g.map(x=>`
    <div class="row" style="margin-bottom:7px;gap:4px">
    <button class="pill gtg ${x.done?'on':''}" data-id="${x.id}" style="flex:1;margin:0">

  ${g.length?'<div class="small muted" style="margin:2px 2px 0">Тап — отметить, ✎ — правка и перенос в другой раздел</div>':''}`;

      <div class="row"><button class="btn" data-close style="flex:1">Отмена</button>
        <button class="btn primary" id="gok" style="flex:1">Добавить</button></div>`);
    setTimeout(()=>$('#gt').focus(),80);
    $('#gok').onclick=()=>{const t=$('#gt').value.trim();if(!t)return toast('Пусто');
      DB.goals.unshift({id:uid(),text:t,scope:$('#gs').value,done:false,created:today()});
      save();closeSheet();rGoals()};

}
/* ---- перенос записи: между разделами и между целями и заметками ----
   Цель и заметка — это один и тот же текст в разных списках, поэтому
   в окне правки два связанных выпадающих списка: тип и раздел.
   Наборы разделов у целей и заметок разные, так что смена типа
   перерисовывает второй список. */
const secOpts=(kind,sel)=>secs(kind)
  /* скрытый раздел показываем, только если он открыт или запись уже в нём */
  .filter(([k])=>k!==HIDDEN_SEC||zhOpen||k===sel)
  .map(([k,n])=>`<option value="${k}"${k===sel?' selected':''}>${n}</option>`).join('');
const typeFields=(kind,sec)=>`
  <label class="fld" style="margin-bottom:12px"><span>Тип</span>
    <select id="ekind">
      <option value="goals"${kind==='goals'?' selected':''}>Цель</option>
      <option value="notes"${kind==='notes'?' selected':''}>Заметка</option>
    </select></label>
  <label class="fld" style="margin-bottom:16px"><span>Раздел</span>
    <select id="esec">${secOpts(kind,sec)}</select></label>`;
function bindTypeFields(kind,sec){
  $('#ekind').onchange=()=>{
    const k=$('#ekind').value;
    /* вернулись к исходному типу — возвращаем и исходный раздел */
    $('#esec').innerHTML=secOpts(k, k===kind?sec:'');
  };
}
const kindName=k=>k==='goals'?'цели':'заметки';
/* Куда бы запись ни уехала, сообщаем полный адрес: тип и раздел. */
function movedToast(kind,sec){ toast('Перенесено в '+kindName(kind)+', «'+secName(kind,sec)+'»') }

/* Правка цели: текст, тип и раздел в одном окне, там же удаление. */
function editGoal(id){
  const x=DB.goals.find(y=>y.id===id); if(!x) return;
  openSheet(`<h2>Цель</h2>
    <label class="fld" style="margin-bottom:12px"><span>Текст</span>
      <input type="text" id="gt" value="${esc(x.text)}"></label>
    ${typeFields('goals',x.scope)}
    <div class="row"><button class="btn danger" id="gdel">Удалить</button>
      <span class="spacer"></span>
      <button class="btn" data-close>Отмена</button>
      <button class="btn primary" id="gok">Сохранить</button></div>`);
  bindTypeFields('goals',x.scope);
  $('#gdel').onclick=()=>{
    if(!confirm('Удалить цель?'))return;
    DB.goals=DB.goals.filter(y=>y.id!==id); save(); closeSheet(); rGoals();
  };
  $('#gok').onclick=()=>{
    const t=$('#gt').value.trim(); if(!t) return toast('Пусто');
    const kind=$('#ekind').value, to=$('#esec').value;
    if(kind==='goals'){
      const moved = to!==x.scope;
      x.text=t; x.scope=to;
      save(); closeSheet(); rGoals();
      if(moved) movedToast('goals',to);
      return;
    }
    /* уходит в заметки: отметка «выполнено» там не нужна, остаётся текст */
    DB.goals=DB.goals.filter(y=>y.id!==id);
    DB.notes=DB.notes||{}; DB.notes[to]=DB.notes[to]||[]; DB.notes[to].unshift(t);
    save(); closeSheet(); rGoals(); movedToast('notes',to);
  };
}

/* ================= СТАТИСТИКА (без графиков) ================= */
function rStats(){
  const ds=sortedDays(), last=n=>ds.filter(d=>d>=addD(today(),-n));
  const per=n=>{
    const L=last(n);
    return {
      n:L.length,
      score:avg(L.map(score).filter(v=>v>0)),
      sleep:avg(L.map(d=>DB.days[d].sleepH).filter(Boolean)),
      slept:avg(L.map(d=>DB.days[d].slept).filter(Boolean)),
      pulse:avg(L.map(d=>DB.days[d].pulse).filter(Boolean)),
      weight:avg(L.map(d=>DB.days[d].weight).filter(Boolean)),
      rest:avg(L.map(d=>DB.days[d].restHr).filter(Boolean)),
      steps:avg(L.map(d=>DB.days[d].steps).filter(Boolean)),
      sscore:avg(L.map(d=>DB.days[d].sleepScore).filter(Boolean)),
      deep:avg(L.map(d=>DB.days[d].deepMin).filter(Boolean)),
      sport:L.filter(d=>DB.days[d].sport).length,
      /* английский — любой из трёх способов за день */
      eng:L.filter(d=>{const x=DB.days[d];return x.eng_duo||x.eng_ai||x.eng_nat}).length,
      social:L.filter(d=>{const x=DB.days[d];return x.friends||x.people||x.dating}).length
    };
  };
  const w=per(7), m=per(30), y=per(365);
  const row=(lb,f,suf='')=>`<tr><td style="padding:7px 0;color:var(--ink-2)">${lb}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${f(w)}${suf}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${f(m)}${suf}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums">${f(y)}${suf}</td></tr>`;
  $('#v-stats').innerHTML=`
  <div class="card">
    <h2>Сводка <span class="right">${ds.length} дней в базе</span></h2>
    <table style="width:100%;border-collapse:collapse;font-size:14px">
      <tr style="font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em">
        <td></td><td style="text-align:right">7 дн</td><td style="text-align:right">30 дн</td><td style="text-align:right">год</td></tr>
      ${row('Балл дня',x=>r1(x.score))}
      ${row('Сон, ч',x=>r1(x.sleep))}
      ${row('Глубокий, мин',x=>x.deep==null?'—':Math.round(x.deep))}
      ${row('Оценка сна',x=>r1(x.slept))}
      ${row('Балл браслета',x=>x.sscore==null?'—':Math.round(x.sscore))}
      ${row('Пульс мин.',x=>r1(x.pulse))}
      ${row('Пульс покоя',x=>r1(x.rest))}
      ${row('Вес, кг',x=>r1(x.weight))}
      ${row('Шаги',x=>x.steps==null?'—':Math.round(x.steps).toLocaleString('ru'))}
      ${row('Тренировки',x=>x.sport)}
      ${row('Английский',x=>x.eng)}
      ${row('Общение',x=>x.social)}
    </table>
  </div>
  <div class="card">
    <h2>Активность за 12 недель</h2>
    ${heat()}
  </div>
  <div class="card"><h2>Топ добавок за 90 дней</h2>${topSupp()}</div>
  <div class="card">
    <h2>Данные</h2>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <button class="btn sm" id="exJ">Экспорт JSON</button>
      <button class="btn sm" id="exC">Экспорт CSV</button>
      <button class="btn sm" id="imJ">Импорт JSON</button>
      <button class="btn sm" id="imB">Импорт браслета</button>
      <button class="btn sm" id="mkPub">Файл для публикации</button>
      <button class="btn sm" id="cfg">Синхронизация</button>
    </div>
    <div class="small muted" style="margin-top:9px">Графики добавим отдельно, на основе этих данных.</div>
  </div>`;
  $('#exJ').onclick=()=>dl('dnevnik-'+today()+'.json',JSON.stringify(DB),'application/json');
  $('#exC').onclick=exportCSV;
  $('#imJ').onclick=importJSON;
  $('#imB').onclick=importBand;
  $('#mkPub').onclick=makePublic;
  $('#cfg').onclick=syncSheet;
  const hm=$('#hm');
  if(hm){
    const open=e=>{const b=e.target.closest('[data-d]');if(!b)return;
      cur=b.dataset.d; go('day')};
    hm.onclick=open;
    hm.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e)}};
  }
}
function heat(){
  const end=today();
  let start=addD(end,-83);
  const sd=pISO(start).getDay(); start=addD(start,-((sd+6)%7)); // с понедельника
  let d=start; const out=[];
  while(d<=end){
    const s=score(d), lvl=s>=8?4:s>=6?3:s>=4?2:s>=1?1:0, w=isWork(d);
    out.push(`<i class="${lvl?'d'+lvl:''}${w?' wk':''}${d===end?' today':''}${d===cur?' pick':''}" data-d="${d}" role="button" tabindex="0" title="${fmtD(d)}: ${s}${w?', рабочий':''} — открыть"></i>`);
    d=addD(d,1);
  }
  return `<div class="small muted" style="margin-bottom:8px">Щёлкните по дню, чтобы открыть его.
    Точка в углу — рабочий день</div>
    <div class="hm hm-act" id="hm" style="grid-template-columns:repeat(${Math.ceil(out.length/7)},1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr)">${out.join('')}</div>
    <div class="row small muted" style="margin-top:9px"><span>меньше</span>
    <span class="hm" style="display:inline-grid;grid-template-columns:repeat(5,12px);gap:3px;margin:0 8px">
    <i></i><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i></span><span>больше</span></div>`;
}
function topSupp(){
  const c={}, from=addD(today(),-90);
  sortedDays().filter(d=>d>=from).forEach(d=>(DB.days[d].supp||[]).forEach(n=>c[n]=(c[n]||0)+1));
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,15);
  if(!top.length)return '<div class="empty">Нет данных</div>';
  const mx=top[0][1];
  return top.map(([n,v])=>`<div style="margin-bottom:7px">
    <div class="row small"><span>${esc(n)}</span><span class="spacer"></span><span class="muted">${v} дн</span></div>
    <div class="bar" style="margin-top:3px"><i style="width:${v/mx*100}%"></i></div></div>`).join('');
}
function dl(name,txt,type){
  const b=new Blob([txt],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Файл сохранён');
}
function exportCSV(){
  const cols=['date','work','bed','rise','sleepH','slept','sleepScore','deepMin','remMin',
    'pulse','restHr','weight','steps',...ACTS.map(a=>a.k),'score','supp','note'];
  const rows=[cols.join(';')];
  sortedDays().forEach(d=>{
    const x=DB.days[d];
    rows.push(cols.map(c=>{
      let v = c==='date'?d : c==='work'?(isWork(d)?1:0) : c==='score'?score(d)
            : c==='supp'?(x.supp||[]).join(', ') : (x[c]??'');
      v=String(v).replace(/"/g,'""');
      return /[;\n"]/.test(v)?`"${v}"`:v;
    }).join(';'));
  });
  dl('dnevnik-'+today()+'.csv','﻿'+rows.join('\n'),'text/csv;charset=utf-8');
}
/* Готовит копию файла с вырезанными данными — её и выкладывают на GitHub. */
function makePublic(){
  try{
    const seed=$('#seed');
    const had=seed?seed.textContent.length:0;
    /* собираем копию страницы из памяти: читать файл с диска браузер не даёт */
    const doc=document.documentElement.cloneNode(true);
    const s2=doc.querySelector('#seed'); if(s2) s2.textContent='';
    /* клон содержит уже отрисованные экраны — вычищаем их и возвращаем
       стартовое состояние, иначе файл откроется на пустой «Статистике» */
    doc.querySelectorAll('.view').forEach(e=>{e.innerHTML='';e.classList.toggle('on',e.id==='v-day')});
    const sh=doc.querySelector('#sheet'); if(sh) sh.innerHTML='';
    const md=doc.querySelector('#modal'); if(md) md.classList.remove('on');
    const tb=doc.querySelector('#tabbar'); if(tb) tb.innerHTML='';
    const tt=doc.querySelector('#ttl'); if(tt) tt.textContent='День';
    const sb=doc.querySelector('#sub'); if(sb) sb.textContent='';
    const ts=doc.querySelector('#toast'); if(ts){ts.textContent='';ts.classList.remove('on')}
    const sd=doc.querySelector('#syncDot'); if(sd){sd.className='sync-dot';sd.title='Синхронизация'}
    /* PNG-иконки нарисованы канвасом при загрузке — в копии они лишний вес,
       на опубликованной странице создадутся заново */
    doc.querySelectorAll('link[data-gen]').forEach(e=>e.remove());
    doc.removeAttribute('data-theme');
    const clean='<!DOCTYPE html>\n'+doc.outerHTML;
    dl('Дневник-публичный.html',clean,'text/html;charset=utf-8');
    openSheet(`<h2>Файл для публикации готов</h2>
      <div class="small" style="color:var(--ink-2);line-height:1.7">
      Сохранён <b>Дневник-публичный.html</b> — то же приложение, но без ваших записей
      (вырезано ${(had/1024).toFixed(0)} КБ данных). Именно его выкладывайте на GitHub.<br><br>
      Порядок такой:<br>
      1. Здесь, в этом файле, настройте синхронизацию и нажмите «Отправить» — данные уйдут на Диск.<br>
      2. Выложите на GitHub <b>Дневник-публичный.html</b>.<br>
      3. Откройте адрес на GitHub, введите тот же Client ID, подключитесь — записи подтянутся с Диска.<br><br>
      Исходный файл с данными держите у себя как резервную копию.</div>
      <div class="row" style="margin-top:14px"><span class="spacer"></span>
      <button class="btn primary" data-close>Понятно</button></div>`);
  }catch(e){ toast('Не получилось: '+e.message) }
}
/* ================= ИМПОРТ ДАННЫХ С БРАСЛЕТА =================
   Оригинальная выгрузка Mi Fitness. Нужны исходные CSV с двумя окончаниями:
   MiFitness_hlth_center_aggregated_fitness_data.csv — сон, пульс и шаги;
   MiFitness_hlth_center_sport_record.csv — сводные тренировки.
   Начальная часть имени (дата и номер аккаунта) меняется при каждой выгрузке,
   но окончание и заголовки должны остаться заводскими. Это намеренно строгая
   проверка: отредактированный Excel-файл или чужой CSV не попадёт в дневник. */
function parseCSV(txt){
  const t=txt.replace(/^﻿/,'');
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false }
      else f+=c;
    }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f='' }
    else if(c==='\n'){ row.push(f); f=''; rows.push(row); row=[] }
    else if(c!=='\r') f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row) }
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
/* «6,12» и «6.12» — оба варианта встречаются в выгрузке */
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
/* «01:13:00» → «01:13»; секунды в дневнике не нужны */
const hhmm=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(s||'').trim());return m?pad(+m[1])+':'+m[2]:null};

/* Строго узнаёт два оригинальных формата Mi Fitness. Возвращает формат,
   а не тип показателя: aggregated содержит сразу сон, пульс и шаги.
   Старую выгрузку Zepp Life больше не принимаем — она была промежуточной,
   отредактированной копией, а не первичными данными прибора. */
const MF_AGG='MiFitness_hlth_center_aggregated_fitness_data.csv';
const MF_SPORT='MiFitness_hlth_center_sport_record.csv';
function miFitnessKind(file,rows){
  const h=Object.keys(rows[0]||{});
  const name=file.name||'';
  if(name.endsWith(MF_AGG)&&['Uid','Sid','Tag','Key','Time','Value','UpdateTime'].every(x=>h.includes(x))) return 'mfAgg';
  if(name.endsWith(MF_SPORT)&&['Uid','Sid','Key','Time','Category','Value','UpdateTime'].every(x=>h.includes(x))) return 'mfSport';
  return null;
}
const mfDate=t=>{
  const n=Number(t); if(!Number.isFinite(n)||n<=0) return null;
  /* Time в Mi Fitness — Unix-секунды полуночи местного дня. Форматируем
     в локальной зоне устройства, а не через UTC: иначе ночные записи могут
     уехать на соседнюю дату. */
  const d=new Date(n*1000);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const mfJSON=s=>{try{const x=JSON.parse(s);return x&&typeof x==='object'?x:null}catch(e){return null}};
function miFitnessRows(rows,kind){
  const out=[];
  for(const r of rows){
    const v=mfJSON(r.Value); if(!v) continue;
    if(kind==='mfAgg'){
      const d=mfDate(r.Time); if(!d||!['sleep','heart_rate','steps'].includes(r.Key)) continue;
      /* в файле есть технические дубли {has_data:true}; у них нет чисел,
         поэтому берём лишь полноценную сводную строку. */
      if(r.Key==='sleep'&&num(v.total_duration)>0){
        const seg=Array.isArray(v.segment_details)?v.segment_details[0]:null;
        /* У спортивных часов timezone — смещение от UTC в четвертях часа
           (12 = UTC+3, 28 = UTC+7), но у старых строк оно порой неверно.
           Наилучший источник — локальная часовая зона браузера, когда
           дневник открыт у владельца данных; берём её и время не «плывёт»
           между старым и новым форматом. */
        const localTime=t=>Number.isFinite(Number(t))?new Date(Number(t)*1000).toTimeString().slice(0,5):'';
        out.push({kind:'sleep',date:d,total_duration_min:v.total_duration,
          bedtime_local:seg?localTime(seg.bedtime):'',
          wakeup_local:seg?localTime(seg.wake_up_time):'',
          sleep_score:v.sleep_score,deep_min:v.sleep_deep_duration,rem_min:v.sleep_rem_duration});
      }
      else if(r.Key==='heart_rate'&&num(v.min_hr)>0) out.push({kind:'hr',date:d,min_hr:v.min_hr,resting_hr:v.avg_rhr});
      else if(r.Key==='steps'&&num(v.steps)>0) out.push({kind:'steps',date:d,steps:v.steps});
    }
    else if(kind==='mfSport'){
      /* Key — технический, но точный тип (outdoor_running, pool_swimming);
         Category иногда только общее running/swimming, и с ним потерялась бы
         раскладка в WK_MAP. */
      const d=mfDate(v.start_time??r.Time), a=String(r.Key||r.Category||'').trim();
      /* В выгрузке встретилась случайно начатая и сразу остановленная
         «тренировка» на 8 секунд с нулевой дистанцией и калориями. Её не
         считаем спортом. Короткие, но реальные занятия с дистанцией или
         калориями оставляем. */
      if(!d||!a||num(v.duration)<=0||
         (num(v.duration)<60&&!(num(v.distance)>0)&&!(num(v.calories)>0))) continue;
      out.push({kind:'workout',date:d,activity:a,distance_km:num(v.distance)>0?num(v.distance)/1000:null});
    }
  }
  return out;
}
/* ---- тренировки с браслета ----
   Прибор знает только тип занятия, разбивки по подходам в выгрузке нет.
   Бег и ходьба идут в «Кардио» с километражем, велосипед — туда же одним
   словом, остальное (силовая, плавание, единоборства) — в «Прочее».
   [поле, как назвать, писать ли километры] */
const WK_MAP={
  outdoor_running:['Кардио','бег',1],      indoor_running:['Кардио','бег на дорожке',1],
  outdoor_walking:['Кардио','ходьба',1],   indoor_walking:['Кардио','ходьба',1],
  outdoor_hiking:['Кардио','поход',1],
  outdoor_riding:['Кардио','велосипед',0], indoor_riding:['Кардио','велотренажёр',0],
  strength_training:['Прочее','силовая',0],free_training:['Прочее','силовая',0],
  pool_swimming:[EX_COLD,'плавание',0],    open_water_swimming:[EX_COLD,'плавание',0],
  muay_thai:['Прочее','муай-тай',0],       boxing:['Прочее','бокс',0],
  parallel_skiing:['Прочее','лыжи',0],     yoga:['Прочее','йога',0],
  elliptical:['Прочее','эллипс',0],        rowing:['Прочее','гребля',0],
  jump_rope:['Прочее','скакалка',0]
};
const kmTxt=v=>String(Math.round(v*10)/10).replace('.',',');
/* Вставка от браслета помечается в x.exBand, чтобы повторный импорт
   заменял её, а не плодил дубли рядом с вашим текстом. */
function applyBand(x,field,txt){
  const prev=(x.exBand||{})[field];
  const cur=String((x.ex||{})[field]||'').trim();
  const parts=cur?cur.split(' · ').filter(p=>p&&p!==prev):[];
  if(txt&&!parts.includes(txt)) parts.push(txt);
  x.ex=x.ex||{};
  if(parts.length) x.ex[field]=parts.join(' · '); else delete x.ex[field];
  if(txt){ x.exBand=x.exBand||{}; x.exBand[field]=txt }
  else if(x.exBand){ delete x.exBand[field]; if(!Object.keys(x.exBand).length) delete x.exBand }
}
function mergeWorkouts(rows,st){
  /* за день бывает несколько занятий — сначала собираем, потом пишем */
  const byDay={};
  for(const r of rows){
    const d=r.date;
    if(!isDate(d)||d>today()) continue;
    const a=String(r.activity||r.sport_type||'').trim();
    const m=WK_MAP[a];
    /* незнакомый тип не выбрасываем: пишем как есть в «Прочее» */
    const[field,lb,wantKm]=m||['Прочее',a.replace(/_/g,' '),0];
    if(!lb) continue;
    const g=byDay[d]=byDay[d]||{};
    const e=g[field+'|'+lb]=g[field+'|'+lb]||{field,lb,wantKm,km:0,n:0};
    e.n++;
    const km=num(r.distance_km); if(km>0) e.km+=km;
  }
  for(const[d,g]of Object.entries(byDay)){
    const x=DB.days[d]=DB.days[d]||{};
    const byField={};
    for(const e of Object.values(g)){
      const txt = e.wantKm&&e.km>0 ? `${e.lb} ${kmTxt(e.km)} км`
                : e.n>1 ? `${e.lb} ×${e.n}` : e.lb;
      (byField[e.field]=byField[e.field]||[]).push(txt);
    }
    for(const[f,list]of Object.entries(byField)) applyBand(x,f,list.join(', '));
    x.sport=1;
    st.days.add(d);
  }
}
/* Сводит выгрузку в дневник. Данные прибора считаем точнее ручных,
   поэтому перезаписываем; счётчик ведём отдельно, чтобы показать в отчёте. */
function mergeBand(kind,rows,st){
  for(const r of rows){
    const d=r.date;
    if(!isDate(d)) continue;
    /* дни из будущего игнорируем: в выгрузке попадаются пустые хвосты */
    if(d>today()) continue;
    const x=DB.days[d]=DB.days[d]||{};
    let touched=false;
    const set=(k,v)=>{
      if(v==null||v==='') return;
      if(x[k]!==v){ x[k]=v; touched=true }
    };
    if(kind==='sleep'){
      const mn=num(r.total_duration_min);
      if(mn>0) set('sleepH',Math.round(mn/60*100)/100);
      set('bed',hhmm(r.bedtime_local)); set('rise',hhmm(r.wakeup_local));
      const sc=num(r.sleep_score); if(sc>0) set('sleepScore',Math.round(sc));
      const dp=num(r.deep_min); if(dp>0) set('deepMin',Math.round(dp));
      const rm=num(r.rem_min);  if(rm>0) set('remMin',Math.round(rm));
    }
    else if(kind==='hr'){
      /* «Пульс мин.» вёлся вручную как минимальный за сутки — это min_hr.
         Пульс покоя браслет считает отдельно, кладём его своим полем. */
      const mn=num(r.min_hr);     if(mn>0) set('pulse',Math.round(mn));
      const rs=num(r.resting_hr); if(rs>0) set('restHr',Math.round(rs));
    }
    else if(kind==='steps'){
      const s=num(r.steps); if(s>0) set('steps',Math.round(s));
    }
    if(touched) st.days.add(d);
  }
}
/* Сначала напоминаем точные окончания имён. Диалог выбора файла сам не
   умеет показать такую памятку без риска спрятать её под проводником. */

  openSheet(`<h2>Импорт из Mi Fitness</h2>

      <code>…${MF_AGG}</code><br>
      — сон, пульс и шаги.<br><br>
      <code>…${MF_SPORT}</code><br>
      — сводные тренировки.<br><br>
      Многоточие — дата и номер устройства, они у новой выгрузки меняются.

function chooseBand(){
  const i=document.createElement('input');
  i.type='file'; i.accept='.csv,text/csv'; i.multiple=true;
  i.onchange=async()=>{
    const files=[...i.files]; if(!files.length) return;
    const st={days:new Set(), files:[], skipped:[]};
    for(const f of files){
      try{
        const rows=parseCSV(await f.text());
        const kind=rows.length?miFitnessKind(f,rows):null;
        if(!kind){ st.skipped.push(f.name+' — не оригинальный CSV Mi Fitness'); continue }
        const data=miFitnessRows(rows,kind);
        if(kind==='mfSport') mergeWorkouts(data,st);
        else for(const k of ['sleep','hr','steps']) mergeBand(k,data.filter(x=>x.kind===k),st);
        const label=kind==='mfAgg'?'сон, пульс и шаги':'тренировки';
        st.files.push(`${f.name} — ${label}, ${data.length} записей`);
      }catch(e){ st.skipped.push(f.name+' — ошибка чтения') }
    }
    if(st.days.size){ migrateActs(); save(); render() }
    openSheet(`<h2>Импорт с браслета</h2>
      <div class="small" style="color:var(--ink-2);line-height:1.7">
      ${st.files.length?`Обработано:<br>${st.files.map(esc).join('<br>')}<br><br>`:''}
      Обновлено дней: <b>${st.days.size}</b>.
      ${st.skipped.length?`<br><br>Пропущено:<br>${st.skipped.map(esc).join('<br>')}`:''}
      <br><br><b>Загружайте только оригинальную выгрузку Mi Fitness:</b><br>
      — файл, оканчивающийся на <code>${MF_AGG}</code> — сон, пульс, шаги;<br>
      — файл, оканчивающийся на <code>${MF_SPORT}</code> — тренировки.<br>
      Часть имени перед <code>MiFitness</code> (дата и номер) может отличаться.
      Не открывайте и не пересохраняйте CSV в Excel: изменённые или чужие файлы
      приложение намеренно пропускает.
      ${st.days.size?`<br><br>Сон, пульс, шаги и оценка сна взяты из первичной выгрузки — они точнее записанных по памяти.
      «Пульс мин.» — минимальный за сутки; пульс покоя лежит отдельным полем.
      Тренировки: бег и ходьба попадают в «Кардио» с километражем, велосипед — туда же словом,
      силовая, плавание и единоборства — в «Прочее». Ваш текст в этих полях сохраняется,
      запись браслета дописывается через « · » и заменяется при повторном импорте.`:''}
      </div>
      <div class="row" style="margin-top:14px"><span class="spacer"></span>
      <button class="btn primary" data-close>Готово</button></div>`);
  };
  i.click();
}
function importJSON(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{
      const j=JSON.parse(r.result);
      if(!j.days)throw new Error('не тот формат');
      if(!confirm('Заменить текущие данные данными из файла?'))return;
      DB=Object.assign(BLANK(),j);
      if(DB.suppV!==SUPP_V) migrateSupps();
      migrateActs(); migrateGoals(); migrateClean(); initFilters();
      save();render();toast('Импортировано');
    }catch(e){toast('Ошибка: '+e.message)}};
    r.readAsText(f)};
  i.click();
}
