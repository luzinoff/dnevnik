/* переводит ошибки Google на человеческий */
function hintAuth(msg){
  const s=String(msg);
  if(/origin|redirect_uri|400/i.test(s))
    return 'Google не принял адрес страницы. В Credentials → ваш OAuth client → Authorized JavaScript origins должен быть указан '+location.origin+' — ровно так, без пути в конце.';
  if(/access_denied|отклон|denied/i.test(s))
    return 'Доступ отклонён. Обычно это значит, что ваша почта не добавлена в Test users на экране согласия (OAuth consent screen → Audience).';
  if(/закрыт|отмен|popup/i.test(s))
    return 'Окно входа закрылось. Попробуйте ещё раз; если оно не появляется — разрешите всплывающие окна для этого сайта.';
  if(/403/.test(s)) return 'Google отказал (403). Проверьте, что Google Drive API включён в вашем проекте.';
  return 'Ошибка: '+s;
}

/* ================= ГОЛОСОВОЙ ВВОД =================
   Web Speech API: распознавание идёт средствами браузера, ничего
   не устанавливается и не подключается. Работает в Chrome, Edge
   и Safari; в Firefox API нет — там кнопка не рисуется вовсе.

   Важно про офлайн: Chrome отправляет звук на серверы Google, поэтому
   без интернета и при открытии файла с диска (file://) распознавание
   отвечает ошибкой network. Это не поломка — на GitHub Pages всё идёт.

   Готовые куски речи дописываются в textarea, а то, что распознаётся
   прямо сейчас, показывается серым под полем: промежуточный результат
   ещё меняется на лету, класть его в поле нельзя. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micRec=null, micWant=false, micTa=null, micLast=0;
/* ---- как собирается надиктованное ----
   Наивное «дописать пришедший кусок в конец поля» даёт кашу вида
   «сходить · сходить в · сходить в горы»: движок уточняет фразу
   по ходу речи и присылает её целиком заново, каждый раз помечая
   готовой и каждый раз под новым номером. Отсеивать повторы
   по номеру бесполезно — номера разные, текст тот же.

   Поэтому поле не дописывается, а пересобирается. Приложение помнит
   micBase — то, что было в поле до включения микрофона, — и список
   кусков micParts. На каждое событие хвост после базы переписывается
   заново, так что уточнение просто заменяет предыдущий вариант
   вместо того, чтобы лечь рядом с ним. */
let micBase='', micParts=[], micLive='';
/* последнее значение, которое поле получило от нас: расхождение
   означает правку руками. null — пока микрофон не трогали */
let micPrev=null;

/* Разметка ряда с кнопкой. Кладётся сразу под textarea.
   btn=false — только строка состояния, без кнопки: так сделано в окне
   новой заметки, куда микрофон включён снаружи и вторая кнопка была бы
   лишней. Гасит запись тогда закрытие окна (`micStop()` в `closeSheet()`)
   или сохранение заметки. */
function micHTML(btn=true){
  if(!SR) return `<div class="mic-row"><span class="mic-note">Голосовой ввод доступен в Chrome, Edge и Safari</span></div>`;
  if(!btn) return `<div class="mic-row"><span class="mic-note" id="micNote"></span></div>`;
  return `<div class="mic-row">
    <button type="button" class="btn mic" id="micBtn">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micLbl">Голос</span></button>
    <span class="mic-note" id="micNote"></span></div>`;
}

/* Привязка к конкретному полю. taSel — селектор textarea. */
function bindMic(taSel){
  if(!SR) return;
  const btn=$('#micBtn'), ta=$(taSel); if(!btn||!ta) return;
  btn.onclick=()=>micRec?micStop():micStart(ta);
}

function micNote(msg,err){
  const n=$('#micNote'); if(!n) return;
  n.className='mic-note'+(err?' err':'');
  n.innerHTML=msg||'';
}
function micLabel(on){
  const b=$('#micBtn'), l=$('#micLbl');
  if(b) b.classList.toggle('rec',on);
  if(l) l.textContent=on?'Стоп':'Голос';
}
/* Подсказка на время слушания. Без кнопки «Стоп» в окне надо сказать,
   чем запись заканчивается, иначе неясно, слушает ещё или нет. */
const micListen=()=>$('#micBtn')?'Слушаю. Говорите, текст добавится в поле.'
                                :'🎙 Слушаю. Говорите — текст добавится в поле. «Добавить» завершит запись.';

function micStart(ta){
  if(micRec) return;
  micTa=ta;
  const r=new SR();
  r.lang='ru-RU'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;

  r.onstart=()=>{micLabel(true);
    micNote(micListen())};

  r.onresult=e=>{
    /* Список результатов пересобираем целиком: он и есть полная картина
       сказанного за сессию. Готовые куски идут в micParts, незавершённый
       показывается серым, но в поле не пишется. */
    const parts=[]; let live='';
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript.trim(); if(!t) continue;
      if(e.results[i].isFinal) parts.push(t); else live+=' '+t;
    }
    micParts=parts; micLive=live.trim();
    micPaint();
    micNote(micLive?`<span class="mic-live">${esc(micLive)}</span>`:micListen());
  };

  r.onerror=e=>{
    const m={
      'not-allowed':'Браузер не дал доступ к микрофону. Разрешите его в настройках сайта.',
      'service-not-allowed':'Браузер не дал доступ к микрофону. Разрешите его в настройках сайта.',
      'no-speech':'Речь не распознана — попробуйте ещё раз.',
      'audio-capture':'Микрофон не найден.',
      'network':'Нет связи с распознаванием. Оно требует интернета и не работает, когда файл открыт с диска.'
    }[e.error]||('Ошибка распознавания: '+e.error);
    /* no-speech Chrome шлёт после паузы — это не повод гасить запись */
    if(e.error!=='no-speech'){ micWant=false; }
    micNote(m,true);
  };

  r.onend=()=>{
    /* Chrome сам обрывает continuous после тишины. Пока пользователь
       не нажал «Стоп» — поднимаем заново, но не чаще раза в секунду,
       иначе при отказе в доступе получим бесконечный цикл.
       Перед перезапуском накопленное закрепляем в базе: у новой сессии
       список результатов свой, начинается с пустого, и без этого
       сказанное до паузы стёрлось бы. */
    if(micWant && Date.now()-micLast>1000){
      micLast=Date.now(); micFold();
      try{ r.start(); return; }catch(err){}
    }
    micRec=null; micWant=false; micFold(); micLabel(false);
    const n=$('#micNote'); if(n&&!n.classList.contains('err')) micNote('');
  };

  micRec=r; micWant=true; micLast=Date.now();
  /* точка отсчёта: всё, что было в поле до включения микрофона */
  micBase=ta.value; micParts=[]; micLive=''; micPrev=ta.value;
  try{ r.start(); }
  catch(err){ micRec=null; micWant=false; micLabel(false); micNote('Не удалось включить микрофон.',true) }
}

function micStop(){
  micWant=false;
  if(micRec){ try{micRec.stop()}catch(e){} }
  micRec=null; micFold(); micPrev=null; micLabel(false);
}

/* Куски текущей сессии переходят в базу: дальше они уже неизменны. */
function micFold(){
  micBase=micText(); micParts=[]; micLive='';
}

/* Склейка базы и распознанного.

   Движок присылает фразу не один раз, а по мере уточнения, и каждый
   вариант помечает готовым: «Что такое» → «Что такое вин» →
   «Что такое winhome» → «Что такое winhome spearl.by». Причём он не
   только продлевает фразу, но и переписывает уже сказанные слова,
   а иногда откатывается к более короткому варианту. Поэтому проверки
   «новое начинается со старого» не хватает — сравниваем по словам
   и в обе стороны, оставляя вариант подлиннее.

   Совпадения одного слова мало: «купить хлеб» и «купить молоко» —
   разные мысли, их надо сохранить обе. Обратная сторона правила:
   дважды подряд сказанная одна и та же фраза схлопнется в одну.
   Это осознанный размен — настоящие повторы подряд в речи редки,
   а вот дубли от движка сыпались постоянно. */
function micText(){
  const out=[];
  for(const p of micParts){
    const i=out.length-1;
    if(i>=0 && micSame(out[i],p)){
      /* тот же кусок в другой редакции — держим наиболее полную */
      if(micWords(p).length>micWords(out[i]).length) out[i]=p;
      continue;
    }
    out.push(p);
  }
  return micJoin(micBase,out.join(' '));
}
/* два куска — варианты одной фразы? */
function micSame(a,b){
  const A=micWords(a), B=micWords(b);
  if(!A.length||!B.length) return false;
  const min=Math.min(A.length,B.length);
  let n=0; while(n<min && A[n]===B[n]) n++;
  /* короткий целиком лёг в начало длинного — вариант одной фразы;
     разошлось последнее слово — тоже, но лишь когда до него совпало
     не меньше двух: иначе это самостоятельная мысль */
  return n>=min || (n>=min-1 && n>=2);
}
/* для сравнения важны слова, а не регистр и знаки препинания */
const micWords=s=>s.toLowerCase().replace(/[^\wа-яё]+/gi,' ').trim().split(/\s+/).filter(Boolean);

/* Соединение базы с новым текстом: пробел между ними и заглавная буква,
   если предыдущая фраза закончена. */
function micJoin(base,add){
  if(!add) return base;
  const b=base.replace(/\s+$/,''), tail=b.trim().slice(-1);
  if(!b.trim()||'.!?'.includes(tail)) add=add.charAt(0).toUpperCase()+add.slice(1);
  return b.trim()? b+' '+add : add;
}

/* Перерисовка поля. Если между событиями пользователь правил текст
   руками, его версия становится новой базой, а распознавание
   перезапускается — иначе движок пришлёт всю фразу заново и она
   ляжет поверх правки. */
function micPaint(){
  const ta=micTa;
  if(!ta||!ta.isConnected) return micStop();
  if(micPrev!==null && ta.value!==micPrev){
    micBase=ta.value; micParts=[]; micLive=''; micPrev=ta.value;
    if(micRec){ micLast=0; try{micRec.stop()}catch(e){} }  // onend поднимет заново
    return;
  }
  ta.value=micPrev=micText();
  ta.scrollTop=ta.scrollHeight;
}

/* ================= ЗАМЕТКИ ================= */
/* список разделов — NSEC_DEF и secs('notes') выше, в блоке «Цели» */

function rNotes(){
  initFilters();
  DB.notes.free=DB.notes.free||[];
  const list=DB.notes[nsec]||[];
  const vis=NSEC().filter(([k])=>k!==HIDDEN_SEC||zhOpen);
  $('#v-notes').innerHTML=`
  <div class="card">
    <h2 id="nTitle" style="margin-bottom:10px;user-select:none">Заметки${zhOpen?' <span class="small" style="color:var(--accent-2);font-weight:400">· скрытое открыто</span>':''}</h2>
    <div class="chips">${vis.map(([k,n])=>
    `<button class="chip ns ${nsec===k?'on':''}" data-s="${k}">${n} ${(DB.notes[k]||[]).length}</button>`).join('')}
    <button class="chip ns" id="nsecBtn" title="Управление разделами">⚙</button></div></div>
    <div class="small muted" style="margin:2px 2px 0">Тап по заметке — правка и перенос, ⚙ — управление разделами</div>
    <!-- «+ Добавить» отделено от ряда разделов подсказкой: рядом с «⚙» их путали -->
    <div class="row" style="margin:11px 2px"><button class="btn sm" id="nAdd">+ Добавить заметку</button>
    ${SR?`<button class="btn sm mic" id="nVoice" title="Новая заметка голосом">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Голосом</button>`:''}
    ${zhOpen?'<span class="spacer"></span><button class="btn sm ghost" id="nLock">Скрыть</button>':''}</div>
  ${list.length?`<div class="card">${list.map((t,i)=>
    `<div class="row" style="align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-soft)">
      <span class="nedit" data-i="${i}" style="flex:1;cursor:pointer">${hl(t)}</span>
      <button class="btn ghost nd" data-i="${i}" title="Удалить">✕</button></div>`).join('')}</div>`
    :'<div class="empty">Пусто</div>'}`;
  $$('.ns').forEach(b=>b.onclick=()=>{if(b.id==='nsecBtn') sectionsSheet('notes',rNotes);else{nsec=b.dataset.s;rNotes()}});
  /* три быстрых тапа по слову «Заметки» открывают скрытый раздел */
  $('#nTitle').onclick=()=>{
    if(zhOpen) return;
    zhTaps++; clearTimeout(zhT); zhT=setTimeout(()=>zhTaps=0,900);
    if(zhTaps>=3){ zhTaps=0; zhOpen=true; nsec=HIDDEN_SEC;
      if(navigator.vibrate)navigator.vibrate(20); rNotes(); }
  };
  const lk=$('#nLock'); if(lk)lk.onclick=()=>{zhOpen=false;nsec='';initFilters();rNotes()};
  $$('.nd').forEach(b=>b.onclick=()=>{
    if(!confirm('Удалить?'))return;
    DB.notes[nsec].splice(+b.dataset.i,1);save();rNotes()});
  $$('.nedit').forEach(b=>b.onclick=()=>editNote(+b.dataset.i));
  $('#nAdd').onclick=()=>addNote(false);
  const nv=$('#nVoice'); if(nv) nv.onclick=()=>addNote(true);
}

/* Окно новой заметки. Двери в него две, и режим задаётся ими:
   «+ Добавить заметку» — просто поле, «Голосом» — поле с уже включённым
   микрофоном. Своей кнопки микрофона здесь нет: выбор сделан снаружи,
   и вторая кнопка на том же экране только сбивала бы. Остаётся строка
   состояния — видно, что запись идёт и что распознаётся сейчас.
   Запись глушит закрытие окна (`micStop()` внутри `closeSheet()`),
   то есть и «Отмена», и «Добавить».

   Микрофон запускается синхронно, внутри обработчика клика: браузер
   даёт к нему доступ только по жесту пользователя, а через setTimeout
   жест уже потерян. */
function addNote(voice){
  openSheet(`<h2>Заметка · ${secName('notes',nsec)}</h2>
    <textarea id="ntx" placeholder="Текст"></textarea>
    ${voice?micHTML(false):''}
    <div class="row" style="margin-top:14px"><button class="btn" data-close style="flex:1">Отмена</button>
    <button class="btn primary" id="nok" style="flex:1">Добавить</button></div>`);
  if(voice && SR) micStart($('#ntx'));
  setTimeout(()=>$('#ntx').focus(),80);
  $('#nok').onclick=()=>{const t=$('#ntx').value.trim();if(!t)return toast('Пусто');
    DB.notes[nsec]=DB.notes[nsec]||[];DB.notes[nsec].unshift(t);save();closeSheet();rNotes()};
}
/* Правка заметки: текст, тип и раздел в одном окне. Смена раздела —
   это перенос: запись уходит из текущего списка в начало выбранного.
   Смена типа на «Цель» переносит текст в Цели невыполненной. */
function editNote(i){
  const from=nsec, cur=(DB.notes[from]||[])[i];
  if(cur==null) return;
  openSheet(`<h2>Заметка</h2>
    <textarea id="ntx">${esc(cur)}</textarea>
    ${micHTML()}
    <div style="margin-bottom:12px"></div>
    ${typeFields('notes',from)}
    <div class="row"><button class="btn danger" id="ndel">Удалить</button>
      <span class="spacer"></span>
      <button class="btn" data-close>Отмена</button>
      <button class="btn primary" id="nok">Сохранить</button></div>`);
  bindTypeFields('notes',from);
  bindMic('#ntx');
  $('#ndel').onclick=()=>{
    if(!confirm('Удалить?'))return;
    DB.notes[from].splice(i,1); save(); closeSheet(); rNotes();
  };
  $('#nok').onclick=()=>{
    const t=$('#ntx').value.trim(); if(!t) return toast('Пусто');
    const kind=$('#ekind').value, to=$('#esec').value;
    if(kind==='notes'){
      if(to===from) DB.notes[from][i]=t;
      else{
        DB.notes[from].splice(i,1);
        DB.notes[to]=DB.notes[to]||[]; DB.notes[to].unshift(t);
      }
      save(); closeSheet(); rNotes();
      if(to!==from) movedToast('notes',to);
      return;
    }
    /* уходит в цели: новая цель, ещё не выполненная */
    DB.notes[from].splice(i,1);
    DB.goals.unshift({id:uid(),text:t,scope:to,done:false,created:today()});
    save(); closeSheet(); rNotes(); movedToast('goals',to);
  };
}

/* ================= ИКОНКА ДЛЯ ГЛАВНОГО ЭКРАНА =================
   SVG-фавикон уже в <head>, но iOS его не берёт для ярлыка, а Chrome
   предпочитает растр. Рисуем PNG прямо здесь — файл остаётся один.
   Пометка data-gen: makePublic() выкидывает эти теги из копии,
   на публикуемой странице они создадутся заново при открытии. */
function makeIcon(px){
  const c=document.createElement('canvas'); c.width=c.height=px;
  const g=c.getContext('2d'), u=px/64, R=(x,y,w,h,r,f)=>{
    g.fillStyle=f; g.beginPath(); g.roundRect(x*u,y*u,w*u,h*u,r*u); g.fill();
  };
  R(0,0,64,64,14,'#5b7f6e');            /* фон-плашка */
  R(15,13,7,38,3.5,'#41604f');          /* корешок */
  R(20,13,29,38,3,'#f7f6f3');           /* страница */
  g.fillStyle='#b4713f';                /* закладка */
  g.beginPath(); g.moveTo(38*u,13*u); g.lineTo(45*u,13*u); g.lineTo(45*u,33*u);
  g.lineTo(41.5*u,29.5*u); g.lineTo(38*u,33*u); g.closePath(); g.fill();
  R(25,39,19,2.6,1.3,'#c9d3cd');        /* строки текста */
  R(25,44.5,12,2.6,1.3,'#c9d3cd');
  return c.toDataURL('image/png');
}
try{
  if(document.createElement('canvas').getContext('2d').roundRect){
    [['apple-touch-icon',180],['icon',192]].forEach(([rel,px])=>{
      const l=document.createElement('link');
      l.rel=rel; l.type='image/png'; l.sizes=px+'x'+px;
      l.href=makeIcon(px); l.dataset.gen='1';
      document.head.appendChild(l);
    });
  }
}catch(e){/* старый браузер — обойдётся SVG-иконкой */}

/* ================= СТАРТ ================= */
load(); applyTheme(); render();
/* Проверка облака при запуске и при каждом возвращении к приложению.
   Одного запуска мало: на телефоне значок с главного экрана обычно
   не перезагружает страницу, а поднимает её из памяти — тогда старт
   отработал когда-то давно и свежие записи с компьютера не приходят.
   Отсюда же и «синхронизация без ошибок, а данных нет».
   Чаще раза в 20 секунд к Диску не ходим: переключений бывает много. */
let syncSeen=0;
async function syncNow(){
  if(!(CFG.clientId&&CFG.autoSync&&CFG.everSignedIn)) return;
  if(syncing||Date.now()-syncSeen<20000) return;
  syncSeen=Date.now();
  /* Облако старее — значит наша отправка когда-то не дошла (закрыли вкладку,
     пропал интернет). Досылаем: «отправлять автоматически» так и обещает. */
  if(await pull(true)==='local') push().catch(()=>{});
}
syncNow();
/* Уход со страницы: отложенную отправку досылаем немедленно. На телефоне
   beforeunload часто не срабатывает вовсе — приложение просто сворачивают,
   поэтому тот же сброс висит и на скрытии вкладки. */
const flushPush=()=>{if(CFG.clientId&&CFG.autoSync&&st){clearTimeout(st);st=null;push().catch(()=>{})}};
document.addEventListener('visibilitychange',()=>{document.hidden?flushPush():syncNow()});
