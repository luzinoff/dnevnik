<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Дневник</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link id="fav" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%235b7f6e'/%3E%3Crect%20x='15'%20y='13'%20width='7'%20height='38'%20rx='3.5'%20fill='%2341604f'/%3E%3Crect%20x='20'%20y='13'%20width='29'%20height='38'%20rx='3'%20fill='%23f7f6f3'/%3E%3Cpath%20d='M38%2013h7v20l-3.5-3.5L38%2033z'%20fill='%23b4713f'/%3E%3Crect%20x='25'%20y='39'%20width='19'%20height='2.6'%20rx='1.3'%20fill='%23c9d3cd'/%3E%3Crect%20x='25'%20y='44.5'%20width='12'%20height='2.6'%20rx='1.3'%20fill='%23c9d3cd'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f7f6f3; --surface:#fff; --surface-2:#fbfaf8;
  --line:#e6e3dc; --line-soft:#efece6;
  --ink:#2c2a26; --ink-2:#6b665e; --ink-3:#9a938a;
  --accent:#5b7f6e; --accent-soft:#e8f0ec; --accent-2:#b4713f;
  --warn:#c4553f; --sleep:#6c7fa8;
  --r:14px; --shadow:0 1px 2px rgba(44,42,38,.05),0 4px 16px rgba(44,42,38,.04);
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#17181a; --surface:#1f2124; --surface-2:#25282c;
  --line:#33373c; --line-soft:#2a2d31;
  --ink:#e8e6e2; --ink-2:#a5a29c; --ink-3:#77746f;
  --accent:#7ba894; --accent-soft:#243330; --accent-2:#d18f5c;
  --warn:#e0725a; --sleep:#8fa3cc;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.app{max-width:920px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.top-in{max-width:920px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:9px}
.top h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--ink-3);font-weight:400}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  width:34px;height:34px;display:grid;place-items:center;padding:0;font-size:15px;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.sync-dot.ok{background:var(--accent)}.sync-dot.err{background:var(--warn)}
.sync-dot.busy{background:var(--accent-2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:500}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.view{display:none;padding:16px 0 24px;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card>h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card>h2 .right{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink-3);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* Лёг, Встал и Вышло — та же схема, что у ряда оценки: подпись сверху,
   элемент под ней ровно 36px. «Вышло» раньше несло подпись внутри рамки
   и потому выбивалось из ряда — теперь это такая же колонка, отличается
   только цветом, потому что значение вычисляется, а не вводится.
   Переноса нет намеренно: втроём это одна мысль, разорванная читается
   хуже. Поля времени жмутся, «Вышло» занимает по содержимому. */
.sleep-row{display:flex;gap:6px;align-items:flex-end;flex-wrap:nowrap}
.sleep-row input[type=time]{height:36px;padding:0 6px;min-width:0;width:100%;text-align:center}
/* «Вышло» — по содержимому: сжиматься ему некуда, там «7 ч 42 м» */
.bt-col.auto{flex:0 0 auto}
.ro.out{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.ro.out>b{color:var(--accent);white-space:nowrap;font-size:14px}
.row{display:flex;align-items:center;gap:9px}
/* Дневник эмоций: отдельная кнопка под рядом разделов и разборы под записями */
.emo-open{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 0;padding:12px 15px;font:inherit;font-weight:600;
  text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer}
.emo-open .n{margin-left:auto;font-weight:400;color:var(--ink-3);font-size:13px}
.emo-open.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.psy{margin:2px 0 6px 2px;border-left:3px solid var(--accent-soft);padding-left:10px}
.psy summary{cursor:pointer;font-size:12.5px;color:var(--accent);padding:3px 0}
.psy .ai-text{font-size:13.5px;padding:4px 0 2px}
/* Срок пребывания по штампу: строка вверху вкладки «Жизнь».
   Цвет предупреждает заранее: за неделю — акцент, в последние 3 дня и после — красный. */
.visa{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 15px;margin-bottom:12px;
  box-shadow:var(--shadow);cursor:pointer}
.visa .vz-main{flex:1;min-width:0}.visa .vz-sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.visa b{font-variant-numeric:tabular-nums}
.visa.soon{border-color:color-mix(in srgb,var(--accent-2) 55%,transparent)}.visa.soon b{color:var(--accent-2)}
.visa.late{border-color:color-mix(in srgb,var(--warn) 60%,transparent)}.visa.late b{color:var(--warn)}
.spacer{flex:1}.muted{color:var(--ink-3)}.small{font-size:12.5px}
.fld{display:block}
.fld>span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],textarea,select{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;outline:none;transition:border-color .15s,background .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:9px 14px;font-weight:500;font-size:14px;transition:.15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2)}
.bookRead{width:29px;height:29px;padding:0;border-radius:50%;font-size:20px;line-height:1;color:var(--ink-3);flex:none}
.bookRead.on{color:#2f9e44;font-weight:700}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
/* квадратные кнопки навигации по дням: не растягиваются и не переносят текст */
.btn.nav{width:34px;height:34px;padding:0;flex:none;display:grid;place-items:center;
  line-height:1;font-size:15px}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.btn:disabled{opacity:.4;cursor:default}
/* ---- голосовой ввод ---- */
.mic-row{display:flex;align-items:center;gap:9px;margin-top:7px}
.btn.mic{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;font-size:13px;flex:none}
.btn.mic svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.btn.mic.rec{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.mic.rec svg{stroke:#fff}
/* пульсация показывает, что микрофон открыт: без неё запись легко забыть выключить */
.btn.mic.rec::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;
  flex:none;animation:micPulse 1.1s ease-in-out infinite}
@keyframes micPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
@media(prefers-reduced-motion:reduce){.btn.mic.rec::before{animation:none}}
.mic-note{font-size:12px;color:var(--ink-3);line-height:1.45;min-width:0}
.mic-note.err{color:var(--warn)}
/* серым — то, что распознаётся прямо сейчас и ещё может измениться */
.mic-live{color:var(--ink-3);font-style:italic}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:13px;color:var(--ink-2);transition:.15s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
/* Спортивный переключатель не должен занимать высоту полноценной формы. */
#spt{margin-top:-2px}
/* В раскрытой форме спорта поля упражнений плотнее, переключатель не меняем. */
#spt + .grid2{gap:7px;margin-top:9px !important}
#spt + .grid2 .fld>span{margin-bottom:3px}
#spt + .grid2 input{padding-top:7px;padding-bottom:7px}
.pill{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:9px 11px;transition:.15s;font-size:14px}
.pill .box{width:20px;height:20px;border-radius:6px;border:1.7px solid var(--line);flex:none;
  display:grid;place-items:center;background:var(--surface);transition:.15s}
.pill .box svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pill.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.on .box{background:var(--accent);border-color:var(--accent)}
.pill.on .box svg{opacity:1}
.pill .nm{flex:1;min-width:0}
.pill .tm{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* Ряд оценки ночи: ручная оценка, оценка браслета и минимальный пульс.
   Все три колонки устроены одинаково — подпись сверху, элемент под ней
   ровно 36px высотой, — поэтому подписи стоят на одной строке, а сами
   элементы на одном уровне. Раньше подпись оценки висела над рядом,
   а у ячеек была внутри: отсюда и разнобой, и лишняя высота.
   Ряд не переносится намеренно: оценка ночи читается как одно целое.
   Вместо переноса ячейки сжимаются (flex:1 1 0 при min-width:0), а
   кнопки оценки держат свою ширину — по ним нажимают пальцем. */
.body-top{display:flex;gap:6px;align-items:flex-end;flex-wrap:nowrap}
.bt-col{flex:1 1 0;min-width:0}
.bt-col.fix{flex:none}
.bt-lb{display:block;font-size:11px;color:var(--ink-3);margin-bottom:5px;line-height:1.35;
  white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.ro{height:36px;display:grid;place-items:center;padding:0 6px;overflow:hidden;
  border:1px solid var(--line-soft);background:var(--surface-2);border-radius:9px}
.ro>b{font-size:15px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
/* Прочерк в день без выгрузки. Модификатор называется `dash`, а не `empty`:
   класс `.empty` в этих же стилях занят заглушкой «здесь пока пусто» с
   отступом 26px, специфичность у него такая же, а объявлен он ниже — и
   ячейка в пустые дни вырастала вдвое против кнопок оценки. */
.ro.dash>b{color:var(--ink-3);font-weight:400}
/* Пульс покоя в ряду с весом и шагами: та же подпись `.fld`, но ячейка
   только для чтения — данные прибора руками не правятся. Высота и рамка
   как у input, иначе третья колонка визуально выбивалась бы из сетки. */
.fld .ro{height:auto;padding:9px 11px;border-radius:10px;border-color:var(--line);justify-items:start}
.fld .ro>b{font-size:14px;font-weight:400}
/* Уточнение в подписи — первое, чем жертвуем на узком экране: лучше
   короткое слово целиком, чем длинное, обрезанное многоточием. */
.bt-lb .xs{font-style:normal}
@media(max-width:379px){.bt-lb .xs{display:none}}
.rate{display:flex;gap:5px;flex-wrap:nowrap}
.rate button{width:30px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  font-size:13px;color:var(--ink-3);padding:0;flex:none;transition:.12s}
@media(max-width:399px){.rate{gap:4px}.rate button{width:27px}}
.rate button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
input[type=range]{width:100%;-webkit-appearance:none;background:none;height:26px}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.2);margin-top:-8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.supp-group{width:100%;margin:0 0 13px}
.supp-group-title{display:flex;align-items:center;font-size:12px;font-weight:650;color:var(--ink-2);margin:2px 2px 6px;line-height:1.25}
.supp-group .chips{gap:6px}
.supp-group .chip{background:color-mix(in srgb,var(--supp-color) 3%,var(--surface-2));border-color:color-mix(in srgb,var(--supp-color) 25%,var(--line-soft));color:var(--ink-3)}
.supp-group .chip.on{background:color-mix(in srgb,var(--supp-color) 27%,var(--surface-2));border-color:var(--supp-color);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.tile{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px}
.tile .v{font-size:21px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .k{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.up{color:var(--accent)}.down{color:var(--warn)}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);margin-bottom:9px}
.item h3{font-size:15px;margin-bottom:3px}
.item .meta{font-size:12px;color:var(--ink-3)}
/* Календарь жизни: 12 компактных месяцев в строке каждого года.
   Цвет панели показывает относительную сумму баллов; число остаётся
   читаемым и на узком экране. Будущие месяцы не закрашиваются. */
.life-head{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
.life-head .fld{flex:1 1 180px;min-width:0}
.life-head .hint{flex:1 1 240px;min-width:0}
.life-year+.life-year{margin-top:12px}
.life-year h3{font-size:13px;color:var(--ink-2);margin-bottom:7px}
/* Год — кнопка: открывает итоги года (DB.lifeSummaries['YYYY']) */
.life-yr{font:inherit;font-size:13px;font-weight:650;color:var(--ink-2);background:none;border:0;padding:2px 0;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.life-yr:hover{color:var(--ink)}
.life-yr:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}
.life-yr .chev{color:var(--ink-3);font-weight:400}
.life-yr .has{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.life-months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:49px;gap:4px}
.life-month{box-sizing:border-box;min-width:0;min-height:0;height:49px;max-height:49px;border:1px solid var(--line-soft);border-radius:7px;
  background:var(--surface-2);padding:4px 2px;text-align:center;cursor:pointer;
  transition:transform .12s,filter .12s;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.life-month:hover{transform:translateY(-1px);filter:brightness(.98)}
.life-month .lm-n{display:block;font-size:10px;color:var(--ink-3);line-height:1.1;white-space:nowrap}
.life-month .lm-s{display:block;font-size:12px;font-weight:650;line-height:1.2;margin-top:5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.life-month.empty{background:var(--surface-2);color:var(--ink-3);cursor:default}
.life-month.future{opacity:.42;cursor:default}
.life-month.lm1{background:color-mix(in srgb,var(--accent) 22%,var(--surface-2))}
.life-month.lm2{background:color-mix(in srgb,var(--accent) 42%,var(--surface-2))}
.life-month.lm3{background:color-mix(in srgb,var(--accent) 64%,var(--surface-2))}
.life-month.lm4{background:var(--accent);color:#fff}
.life-month.lm4 .lm-n{color:color-mix(in srgb,#fff 78%,transparent)}
.life-month.now{outline:2px solid var(--accent-2);outline-offset:1px}
/* Годовой календарь смен 2/2. Цветом отмечены рабочие и выходные дни,
   а ручные исключения помечаются отдельной рамкой. */
.shift-year-control{display:flex;align-items:end;gap:8px;margin-bottom:10px}
.shift-year-control .fld{flex:1;min-width:0}
.shift-year-control .btn.nav{width:38px;height:38px;font-size:24px}
.shift-year{margin-top:12px}
.shift-year h3{font-size:13px;color:var(--ink-2);margin-bottom:7px}
/* Месяцы раскладываются по ширине самого окна, а не экрана: на ПК окно
   узкое при широком экране, и 12 колонок в ряд давали месяцы по 45 px
   с развалившимися числами (13.11.2026). Месяц — не уже 150 px. */
.shift-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shift-month{min-width:0;border:1px solid var(--line-soft);border-radius:7px;padding:4px 3px;background:var(--surface-2)}
.shift-month{padding:6px 5px}
.shift-month h4{font-size:12px;color:var(--ink-2);font-weight:600;text-align:center;margin:0 0 5px;white-space:nowrap}
.shift-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.shift-days i{aspect-ratio:1;display:grid;place-items:center;border-radius:4px;font-style:normal;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.shift-days i.head{color:var(--ink-3);font-size:9.5px}
.shift-days i.work{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2));color:var(--ink)}
.shift-days i.off{background:color-mix(in srgb,var(--line) 45%,var(--surface-2))}
.shift-days i.manual{outline:1.5px solid var(--accent-2);outline-offset:-1px}
/* Сегодня — жирное число и точка под ним, а не рамка: рамкой отмечены ручные
   дни (подработки), и сегодняшний день путался с ними (19.11.2026). */
.shift-days i{position:relative}
.shift-days i.today{font-weight:800;color:var(--ink)}
.shift-days i.today::after{content:'';position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.shift-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.shift-legend i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line-soft)}
.shift-legend i.work{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.shift-legend i.off{background:color-mix(in srgb,var(--line) 45%,var(--surface-2))}

.life-summary{white-space:pre-wrap;line-height:1.55;font-size:13.5px;color:var(--ink-2);max-height:62vh;overflow:auto}
.life-summary b{color:var(--ink);font-weight:650}
.life-month-hint{margin-bottom:10px}
/* «Цифры месяца» в окне итогов: Дневник + Бюджет + Медкарта, сравнение с прошлым месяцем */
.mrep{margin:0 0 12px;border:1px solid var(--line-soft);border-radius:12px;padding:4px 12px 10px;background:var(--surface-2)}
.mrep h4{margin:10px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:650;display:flex;gap:8px}
.mrep h4 .src{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
.mrep .r{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:2px 0}
.mrep .r .l{flex:1;min-width:0;color:var(--ink-2)}
.mrep .r .v{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.mrep .r .d{flex:none;min-width:74px;text-align:right;font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.mrep .cats{font-size:12.5px;color:var(--ink-3);padding:1px 0 2px}
.mrep .none{font-size:12.5px;color:var(--ink-3);padding:2px 0}
.life-legend{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.life-legend i{width:14px;height:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line-soft)}
.life-legend i.lm1{background:color-mix(in srgb,var(--accent) 22%,var(--surface-2))}
.life-legend i.lm2{background:color-mix(in srgb,var(--accent) 42%,var(--surface-2))}
.life-legend i.lm3{background:color-mix(in srgb,var(--accent) 64%,var(--surface-2))}
.life-legend i.lm4{background:var(--accent)}
@media(max-width:560px){.life-months{gap:3px;grid-auto-rows:45px}.life-month{height:45px;max-height:45px;padding:3px 1px}.life-month .lm-s{font-size:11px;margin-top:4px}}
canvas{width:100%;display:block}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(20,19,17,.42);backdrop-filter:blur(2px)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:540px;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.16);animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media(min-width:560px){.modal{align-items:center}.sheet{border-radius:16px;animation:fade .18s}}
.sheet h2{font-size:17px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;
  z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,-6px)}
.empty{text-align:center;padding:26px 16px;color:var(--ink-3);font-size:13.5px}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:14px 0}
details summary{cursor:pointer;font-size:13px;color:var(--accent);padding:5px 0}
code{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:5px;padding:1px 5px;font-size:12.5px}
.tag{color:var(--accent);font-weight:500}
/* бейдж рабочего дня в строке с датой: тап переключает, удержание — сброс */
.wbadge{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
  padding:6px 9px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;
  gap:5px;transition:.15s;white-space:nowrap;flex:none;position:relative}
.wbadge:hover{border-color:var(--ink-3)}
.wbadge .lb{font-size:12px}
.wbadge.work{background:color-mix(in srgb,var(--accent-2) 13%,var(--surface));
  border-color:color-mix(in srgb,var(--accent-2) 42%,transparent);color:var(--accent-2);font-weight:600}
/* точка-метка: день правили руками */
.wbadge.man::after{content:"";position:absolute;top:3px;right:3px;width:4px;height:4px;
  border-radius:50%;background:currentColor;opacity:.55}
@media(max-width:420px){.wbadge .lb{display:none}.wbadge{padding:6px 8px}}
.score-big{font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.agroup+.agroup{margin-top:13px}
.ghd{font-size:11.5px;color:var(--ink-3);margin-bottom:6px;letter-spacing:.02em}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
/* Плитка должна оставаться удобной для тапа, но значок и короткое название
   не требуют прежних 10px сверху и снизу: 7px делает ряд на 6px ниже,
   не превращая его в мелкую цель для пальца. */
.act{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:7px 8px;
  text-align:center;transition:.15s;position:relative}
.act .ic{font-size:18px;line-height:1.2}
.act .lb{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.act .n{position:absolute;top:5px;right:6px;font-size:11px;font-weight:700;color:var(--accent);opacity:0}
.act.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.act.on .lb{color:var(--ink)}
.act.on .n{opacity:1}

/* ===== Обновление интерфейса 01.11.2026 =====
   Палитра и шрифт прежние; плотнее отступы, заголовки карточек без капса,
   навигация по дням — в закреплённой шапке, активности — компактные таблетки. */
.view{padding:12px 0 22px}
.card{border-radius:16px;padding:14px;margin-bottom:10px;border-color:var(--line-soft)}
.card>h2{font-size:15px;text-transform:none;letter-spacing:-.01em;color:var(--ink);font-weight:650;margin-bottom:11px}
.card>h2 .right{font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select{padding:8px 11px}
/* шапка: на вкладке «День» вместо заголовка — переход по дням */
.day-nav{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.day-nav[hidden],#ttlWrap[hidden],#themeBtn[hidden]{display:none}
.dn-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;padding:0;flex:none;color:var(--ink-2)}
.dn-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dn-btn:disabled{opacity:.3;cursor:default}
/* стрелки держатся у даты, остальное — у правого края */
.day-nav #nx{margin-right:auto}
.dn-date{flex:0 1 auto;min-width:96px;padding-left:8px!important;padding-right:8px!important;position:relative;text-align:center;border-radius:10px;padding:1px 4px;cursor:pointer}
.dn-date:hover{background:var(--surface-2)}
.dn-main{display:block;font-size:16px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.dn-sub{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-date input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.dn-today{height:34px;padding:0 10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600;flex:none}
.dn-score{min-width:34px;height:34px;padding:0 7px;border-radius:10px;background:var(--accent);color:var(--surface);
  display:grid;place-items:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.top-in .wbadge{height:34px}
/* добавки дня: группы по категориям — чуть плотнее по вертикали */
#spc .supp-group{margin-bottom:9px}
#spc .supp-group:last-child{margin-bottom:0}
#spc .supp-group-title{margin-bottom:5px}
/* активности — по группам (разбивка намеренная), внутри группы таблетки
   «значок + название», счётчик справа */
.agroup+.agroup{margin-top:10px}
.ghd{font-size:11.5px;margin-bottom:5px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.act{display:flex;align-items:center;gap:5px;border-radius:10px;padding:5px 7px;text-align:left;min-height:36px;min-width:0}
.act .ic{font-size:15px;line-height:1;flex:none}
.act{position:relative}
@media(max-width:379px){.act{padding:5px 5px;gap:4px}.act .ic{font-size:14px}.act .lb{font-size:12px}}
/* слова не рвём посередине («Знако-мые»): переносим только между словами */
.act .lb{font-size:12.5px;margin:0;line-height:1.15;min-width:0;overflow-wrap:normal;word-break:normal}
.act .n{position:static;opacity:1;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);
  color:var(--surface);font-size:10.5px;line-height:18px;text-align:center;
  position:absolute;top:-6px;right:-4px;box-shadow:0 0 0 2px var(--surface)}
.act .n:empty{display:none}
/* спорт: поля упражнений ещё плотнее */
#spt + .grid2 .fld>span{font-size:11.5px}
#spt + .grid2 input{padding-top:6px;padding-bottom:6px}
/* записи дневника — вся карточка открывает день */
.item.gd{cursor:pointer;background:var(--surface);border-color:var(--line-soft);transition:border-color .15s}
.item.gd:hover{border-color:var(--ink-3)}
.item.gd:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.item .meta{display:flex;align-items:center;gap:8px}
.item .meta b{color:var(--ink-2);font-weight:600}
.item .sc{margin-left:auto;min-width:24px;height:22px;padding:0 6px;border-radius:7px;background:var(--accent-soft);
  color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center}
/* нижние вкладки: активная — с подложкой под значком */
.tab{padding:6px 2px 8px;gap:2px}
.tab svg{box-sizing:content-box;padding:4px 14px;border-radius:999px;transition:background .15s}
.tab.on svg{background:var(--accent-soft)}
.tab{white-space:nowrap}
button:focus-visible,.dn-date:focus-within{outline:2px solid var(--accent);outline-offset:1px}
/* ---- советы ИИ ---- */
.ai-card>h2 .right{margin-left:auto}
.ai-card>h2 .btn.ghost{padding:2px 6px;font-size:15px;color:var(--ink-3)}
.ai-text{font-size:14px;line-height:1.55;overflow-wrap:break-word}
.ai-text b{font-weight:650}
.ai-text .ai-li{position:relative;padding-left:15px;margin:3px 0}
.ai-text .ai-li::before{content:'';position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.ai-text .ai-gap{height:8px}
.ai-tips{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.ai-wait{animation:pulse 1.2s infinite}
.ai-err{color:var(--warn);margin-bottom:8px;line-height:1.5}
.sai{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  padding:0;font-size:16px;filter:grayscale(1);opacity:.4;transition:.15s}
.sai.on{filter:none;opacity:1;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.sai-ph{width:34px;flex:none}
.smv{display:flex;flex-direction:column;flex:none;gap:2px}
.smv-b{width:26px;height:16px;padding:0;border:1px solid var(--line);background:var(--surface-2);border-radius:5px;
  font-size:8px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.smv-b:disabled{opacity:.25;cursor:default}
.smv-b:not(:disabled):hover{border-color:var(--ink-3);color:var(--ink)}
.chip-ai{font-size:11px;margin-right:3px}
.ls-ai{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
@media(prefers-reduced-motion:reduce){.ai-wait{animation:none}}
.ai-pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:10px;padding:10px;max-height:52vh;overflow:auto;margin:0;overflow-wrap:anywhere}
.sync-btn{position:relative}
.sync-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-2)}
.sync-btn .sync-dot{position:absolute;top:4px;right:4px;box-shadow:0 0 0 2px var(--surface)}
.sync-btn.busy svg{animation:spin 1s linear infinite}
.sync-btn.busy .sync-dot{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sync-btn.busy svg{animation:none}}
/* на узком экране шапка «Дня» плотная: кнопки чуть меньше */
@media(max-width:400px){.top-in{gap:6px}.dn-btn,.sync-btn,.dn-score,.top-in .wbadge{height:32px}.dn-btn,.sync-btn{width:32px}.dn-score{min-width:32px}
  .dn-today{height:32px;padding:0 8px;font-size:12px}.dn-date{min-width:78px}}
@media(max-width:379px){.top-in{gap:5px;padding-left:12px;padding-right:12px}.day-nav{gap:4px}
  .dn-date{min-width:0;padding-left:4px!important;padding-right:4px!important}.dn-today{padding:0 7px}}
/* ===== Герой (18.11.2026) ===== */
.hero-btn{position:relative;font-size:17px;line-height:1}
.hero-btn .hb-l{position:absolute;right:-6px;bottom:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.hero-btn.on{border-color:var(--accent);background:var(--accent-soft)}
.hero-btn[hidden]{display:none}
.hero-top{display:flex;align-items:center;gap:12px;user-select:none}
.hero-ava{width:58px;height:58px;border-radius:18px;border:0;background:var(--accent-soft);display:grid;place-items:center;font-size:31px;flex:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.hero-id{flex:1;min-width:0}
.hero-name{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:650;font-size:18px;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-cls{color:var(--ink-2);font-size:13px;margin-top:3px}
.hero-lvl{text-align:center;flex:none;min-width:48px}
.hero-lvl b{display:block;font-size:28px;line-height:1;color:var(--accent)}
.hero-lvl span{font-size:11px;color:var(--ink-3)}
.hero-xp{margin:13px 0 6px}
.hero-st{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.hero-chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.hero-chip.bad{background:#f6e3de}
html[data-theme="dark"] .hero-chip.bad{background:#4a2c26}
.hero-q,.hero-sk,.hero-ev{width:100%;border:0;border-bottom:1px solid var(--line-soft);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.hero-q:last-child,.hero-sk:last-child,.hero-ev:last-child{border-bottom:0}
.hero-q{display:flex;align-items:center;gap:10px;padding:10px 2px}
.hero-q .qk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.hero-q.done .qk{background:var(--accent);border-color:var(--accent);color:#fff}
.hero-q.done .ql{color:var(--ink-3);text-decoration:line-through}
.hero-radar{display:block;margin:0 auto 4px;width:100%;max-width:290px;height:auto}
.hero-sk{display:grid;grid-template-columns:26px 1fr auto;gap:4px 10px;align-items:center;padding:8px 2px}
.hero-sk .si{font-size:18px;grid-row:span 2}
.hero-sk .sn{font-weight:600;font-size:14px}
.hero-sk .sl{font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.hero-sk .sf{font-size:11px;color:var(--ink-3)}
.hero-sk .bar{grid-column:2/4;height:5px}
.hero-perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.hero-perk{border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;background:var(--surface-2)}
.hero-perk .pi{font-size:22px;line-height:1.2}
.hero-perk .pn{font-size:12px;font-weight:600;margin-top:2px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;line-height:1.25}
.hero-perk .pt{font-size:11px;color:var(--ink-3)}
.hero-perk .bar{height:4px;margin-top:5px}
.hero-perk.t0 .pi{filter:grayscale(1);opacity:.45}
.hero-perk.t1{border-color:#c08a5a}.hero-perk.t2{border-color:#9aa3ad}.hero-perk.t3{border-color:#d4a72c}
.hero-perk.t4{border-color:#8a63d2;box-shadow:inset 0 0 0 1px #8a63d2}
.hero-ev{display:flex;gap:10px;align-items:center;padding:8px 2px;font-size:13px}
.hero-ev .ed{color:var(--ink-3);width:70px;flex:none;font-size:12px}
.hero-mbars{display:flex;align-items:flex-end;gap:3px;height:72px;margin:12px 0 4px}
.hero-mbars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
/* Портфолио (22.11.2026): документы, награды и книги */
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.pf-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 12px}
.pf-sum div{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:9px 6px;text-align:center}
.pf-sum b{display:block;font-size:19px;line-height:1.15}
.pf-sum span{font-size:11px;color:var(--ink-3)}
.pf-item{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line-soft);cursor:pointer}
.pf-item:first-of-type{border-top:0}
.pf-ic{font-size:21px;line-height:1.2;flex:none;width:26px;text-align:center}
.pf-t{font-weight:600;font-size:14.5px;line-height:1.35}

<script id="seed" type="application/json"></script>
<script>
"use strict";
const LS='diary.v2', LSC='diary.cfg.v2';
/* ===== Общие настройки дневника, бюджета и медкарты (14.11.2026) =====
   Все три приложения открываются с одного сайта (luzinoff.github.io),
   поэтому видят одну и ту же память браузера. Client ID Google и ключ
   с моделью Gemini держим в общей записи luz.shared.v1: ввёл в одном —
   подхватили остальные, даже в соседней вкладке. Свои настройки у каждого
   приложения остаются; этот блок одинаковый во всех трёх файлах.
   aiModel: пустая строка — модель по умолчанию (gemini-3.6-flash).
   С 18.11.2026 тут же выбор ИИ и ключ с моделью DeepSeek — см. блок ниже. */
const LUZ_SHARED='luz.shared.v1', LUZ_FIELDS=['clientId','aiKey','aiModel','aiProvider','dsKey','dsModel'];
const luzShared={
  seen:{},
  get(){try{return JSON.parse(localStorage.getItem(LUZ_SHARED))||{}}catch(e){return {}}},
  set(p){try{localStorage.setItem(LUZ_SHARED,JSON.stringify(Object.assign(this.get(),p)))}catch(e){}},
  /* own — текущие значения приложения. Общее побеждает; поля, которых в
     общем ещё нет, заполняем своими. Возвращает значения после слияния. */
  pull(own){
    const s=this.get(), out={}, seed={};
    for(const k of LUZ_FIELDS){
      const mine=String(own[k]||'').trim();
      if(k in s) out[k]=String(s[k]||''); else { out[k]=mine; if(mine) seed[k]=mine }
    }
    if(Object.keys(seed).length) this.set(seed);
    this.seen={...out}; return out;
  },
  /* после сохранения своих настроек: в общее уходит только то, что
     поменяли здесь, — иначе вкладка со старыми значениями затёрла бы
     свежие из соседней */
  push(own){
    const ch={};
    for(const k of LUZ_FIELDS){const v=String(own[k]||'').trim(); if(v!==(this.seen[k]||'')) ch[k]=v}
    if(Object.keys(ch).length){
      /* правка ключей или выбора ИИ — метка времени для слияния через Диск (luzSettingsSync) */
      if(Object.keys(ch).some(k=>k!=='clientId')) ch._ts=Date.now();
      this.set(ch); Object.assign(this.seen,ch)
    }
  }
};
/* ===== Выбор ИИ: Gemini или DeepSeek (18.11.2026) =====
   Переключатель общий для всех трёх приложений: luz.shared.v1 → aiProvider
   ('' или 'gemini' — Gemini, 'deepseek' — DeepSeek). Ключи и модели у каждого
   ИИ свои: aiKey/aiModel — Gemini, dsKey/dsModel — DeepSeek; пустая модель —
   модель по умолчанию. Распознавание PDF и фото в медкарте всегда идёт через
   Gemini, переключатель на него не влияет.
   luzAi() принимает переписку в формате Gemini (role user/model, parts[{text}])
   и для DeepSeek сам переводит её в OpenAI-совместимый формат. Ответ —
   {text, model, cut, provider}. Коды ошибок прежние: NO_KEY, TIMEOUT, NETWORK,
   EMPTY[:причина], иначе текст ошибки от сервиса и e.status.
   Этот блок одинаковый во всех трёх файлах. */
const LUZ_AI={
  gemini:{name:'Gemini',def:'gemini-3.6-flash',keyHint:'ключ из Google AI Studio'},
  deepseek:{name:'DeepSeek',def:'deepseek-flash',keyHint:'ключ с platform.deepseek.com'}
};
const luzAiProv=p=>p==='deepseek'?'deepseek':'gemini';
async function luzAi(o){
  const provider=luzAiProv(o.provider), key=String(o.key||'').trim();
  if(!key) throw new Error('NO_KEY');
  const model=String(o.model||'').trim()||LUZ_AI[provider].def;
  const contents=Array.isArray(o.contents)?o.contents:[{role:'user',parts:[{text:String(o.contents||'')}]}];
  const temperature=o.temperature??0.7, maxTokens=o.maxTokens||16384;
  let url, headers, body;
  if(provider==='gemini'){
    url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
    headers={'Content-Type':'application/json','x-goog-api-key':key};
    /* у Gemini 3 размышления входят в лимит: при 4096 ответ мог прийти пустым */
    body={contents,generationConfig:{temperature,maxOutputTokens:maxTokens}};
    if(o.system) body.systemInstruction={parts:[{text:o.system}]};
    if(o.json) body.generationConfig.responseMimeType='application/json';
  } else {
    url='https://api.deepseek.com/chat/completions';
    headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
    const messages=o.system?[{role:'system',content:o.system}]:[];
    for(const c of contents){
      const parts=c.parts||[];
      if(parts.some(p=>p.inline_data||p.inlineData)) throw new Error('NO_FILES');
      messages.push({role:c.role==='model'?'assistant':'user',content:parts.map(p=>p.text||'').join('')});
    }
    body={model,messages,temperature,max_tokens:maxTokens,stream:false};
    if(o.json) body.response_format={type:'json_object'};
  }
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),180000);
  let r;
  try{ r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:ctl.signal}) }
  catch(e){ throw new Error(e&&e.name==='AbortError'?'TIMEOUT':'NETWORK') }
  finally{ clearTimeout(t) }
  let j=null; try{ j=await r.json() }catch(e){}
  if(!r.ok){
    const er=j&&j.error, e=new Error((er&&(er.message||(typeof er==='string'?er:'')))||('HTTP '+r.status));
    e.status=r.status; throw e;
  }
  let text='', reason='';
  if(provider==='gemini'){
    const c=j&&j.candidates&&j.candidates[0];
    text=((c&&c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
    reason=(c&&c.finishReason)||'';
  } else {
    /* ход размышлений DeepSeek приходит отдельно (reasoning_content) — его не берём */
    const c=j&&j.choices&&j.choices[0];
    text=String((c&&c.message&&c.message.content)||'').trim();
    reason=(c&&c.finish_reason)||'';
  }
  const cut=reason==='MAX_TOKENS'||reason==='length';
  if(!text) throw new Error(reason?'EMPTY:'+reason:'EMPTY');
  return {text,model,cut,provider};
}
/* Понятный текст ошибки; where — где поменять настройки («в настройках (⚙)»). */
function luzAiErr(e,provider,model,where){
  provider=luzAiProv(provider);
  const n=LUZ_AI[provider].name, m=String(e&&e.message||e), s=e&&e.status;
  model=String(model||'').trim()||LUZ_AI[provider].def;
  if(m==='NO_KEY') return `Сначала вставьте ключ ${n} ${where}.`;
  if(m==='NO_FILES') return `${n} не принимает файлы — их читает только Gemini.`;
  if(m==='TIMEOUT') return `${n} не ответил за три минуты. Попробуйте ещё раз.`;
  if(m==='NETWORK') return provider==='deepseek'
    ? `Нет связи с DeepSeek. Если интернет есть, DeepSeek мог не пустить запрос из браузера (CORS) — тогда переключитесь на Gemini ${where}.`
    : 'Нет связи с Gemini — проверьте интернет.';
  if(/location is not supported/i.test(m)) return 'Gemini API недоступен из вашей страны (так ответил Google).';
  if(s===401||/API key not valid|API_KEY_INVALID|Authentication Fails|invalid api key/i.test(m)) return `Ключ ${n} не подошёл. Проверьте его ${where}.`;
  if(s===402||/Insufficient Balance/i.test(m)) return 'На счёте DeepSeek закончились деньги — пополните баланс на platform.deepseek.com.';
  if(s===429||/quota|RESOURCE_EXHAUSTED|rate limit/i.test(m)) return provider==='deepseek'
    ? 'DeepSeek просит подождать: слишком много запросов. Попробуйте через минуту.'
    : 'Исчерпан лимит запросов Gemini. Подождите немного или проверьте тариф в Google AI Studio.';
  if(s===404||/not found|Model Not Exist/i.test(m)) return `Модель «${model}» не найдена. Проверьте название ${where}.`;
  if(/^EMPTY/.test(m)) return `${n} вернул пустой ответ`+(m.includes(':')?' ('+m.split(':')[1]+')':'')+'. Попробуйте ещё раз.';
  return `Ошибка ${n}: ${m}`;
}
/* ===== Общие настройки ИИ на Google Диске и общая страница настроек (18.11.2026) =====
   Ключи, модели и выбор ИИ (без Client ID — без него до Диска не достучаться)
   лежат ещё и в файле luz-settings.json в скрытой папке приложений на Диске
   (appDataFolder). Client ID у трёх приложений один, поэтому и папка одна:
   ввели ключ на одном устройстве — после входа в Google он появится на всех.
   Слияние целиком по времени правки luz.shared.v1._ts: новее — побеждает.
   _ts ставят luzShared.push() и страница настроек; у старых записей _ts нет
   (0), тогда побеждает Диск, а если там пусто — уходит здешнее.
   Менять ключи и модели — только на странице LUZ_SETTINGS_URL (одна на три
   приложения); кнопки ⚙ в приложениях ведут туда. Этот блок одинаковый во всех
   трёх файлах. */
const LUZ_SYNC_FIELDS=['aiKey','aiModel','aiProvider','dsKey','dsModel'], LUZ_FILE='luz-settings.json';
const LUZ_SETTINGS_URL='/budget/settings.html';
function luzOpenSettings(){
  /* с диска (file://) — соседняя папка Budget, на сайте — общий адрес */
  const file=location.protocol==='file:';
  location.href=(file?'../Budget/settings.html':LUZ_SETTINGS_URL)+'?from='+encodeURIComponent(file?location.href:location.pathname+location.search+location.hash);
}
/* tok — токен Google с доступом drive.appdata. true — пришли настройки с Диска
   (luz.shared.v1 обновлён, приложению надо подхватить их у себя). */
async function luzSettingsSync(tok){
  if(!tok) return false;
  const H={Authorization:'Bearer '+tok};
  const q=encodeURIComponent("name='"+LUZ_FILE+"' and trashed=false");
  const lr=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&orderBy=createdTime&fields=files(id)&q='+q,{headers:H});
  if(!lr.ok) throw new Error('luz-settings: Диск ответил '+lr.status);
  const files=((await lr.json()).files)||[], id=files[0]&&files[0].id||null;
  let remote=null;
  if(id){
    const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:H});
    if(r.ok){ try{ const j=await r.json(); if(j&&typeof j==='object') remote=j }catch(e){} }
  }
  const local=luzShared.get(), lts=+local._ts||0, rts=remote?(+remote._ts||0):0;
  if(remote&&rts>lts){
    const p={_ts:rts}; for(const k of LUZ_SYNC_FIELDS) p[k]=String(remote[k]||'');
    luzShared.set(p); return true;
  }
  if(remote&&rts===lts) return false;
  if(!remote&&!LUZ_SYNC_FIELDS.some(k=>local[k])) return false;
  const data={_ts:lts||Date.now()}; for(const k of LUZ_SYNC_FIELDS) data[k]=String(local[k]||'');
  if(!lts) luzShared.set({_ts:data._ts});
  const meta=id?{}:{name:LUZ_FILE,parents:['appDataFolder']}, b='luz'+Date.now().toString(36);
  const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
    '\r\n--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(data)+'\r\n--'+b+'--';
  const w=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart',
    {method:id?'PATCH':'POST',headers:{...H,'Content-Type':'multipart/related; boundary='+b},body});
  if(!w.ok) throw new Error('luz-settings: Диск ответил '+w.status);
  /* лишние копии (два устройства создали файл одновременно) убираем */
  await Promise.all(files.slice(1).map(f=>fetch('https://www.googleapis.com/drive/v3/files/'+f.id,{method:'DELETE',headers:H}).catch(()=>{})));
  return false;
}
/* ===== История копий на Google Диске (общий блок: одинаковый в Бюджете, Дневнике и Медкарте) =====
   Раз в день, после удачного обмена, в ту же скрытую папку приложения (appDataFolder)
   кладётся снимок данных «bk-<app>-ГГГГ-ММ-ДД.json»; хранятся последние LUZ_BK_KEEP дней.
   Это защита от неудачного слияния или ошибочной «Замены»: основной файл синхронизации
   перезаписывается, а снимки — нет. Восстановление — без автоматики: снимок скачивается
   файлом и загружается обычным импортом приложения. Дата — по местному времени устройства;
   отметка «сегодня уже сделано» — в localStorage, чтобы не ходить на Диск при каждом обмене.
   Если два устройства в один день создали одинаковый снимок, лишний удаляется при чистке. */
const LUZ_BK_KEEP=30;
const luzBkDay=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
async function luzBackupList(tok,app){
  const pre='bk-'+app+'-',q=encodeURIComponent("name contains '"+pre+"' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=files(id,name,size,createdTime)&q='+q,{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error(r.status===401||r.status===403?'Диск отказал в доступе — войдите заново':'Диск не ответил ('+r.status+')');
  const re=new RegExp('^'+pre.replace(/[-]/g,'\\-')+'(\\d{4}-\\d{2}-\\d{2})\\.json$');
  return ((await r.json()).files||[]).map(f=>{const m=re.exec(f.name);return m?{id:f.id,day:m[1],size:+f.size||0,at:f.createdTime||''}:null})
    .filter(Boolean).sort((a,b)=>b.day.localeCompare(a.day)||a.at.localeCompare(b.at))}
async function luzBackupDaily(tok,app,getBody){
  const day=luzBkDay(),lk='luz.bk.'+app;
  try{if(localStorage.getItem(lk)===day)return false}catch(e){}
  const H={Authorization:'Bearer '+tok},files=await luzBackupList(tok,app);
  let made=false;
  if(!files.some(f=>f.day===day)){
    const body=getBody();if(!body)return false;
    const b='luzbk'+Date.now(),meta={name:'bk-'+app+'-'+day+'.json',mimeType:'application/json',parents:['appDataFolder']};
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',
      headers:{...H,'Content-Type':'multipart/related; boundary='+b},
      body:'--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'});
    if(!r.ok)throw new Error('Снимок на Диск не записан ('+r.status+')');
    made=true}
  /* чистка: один снимок на день (самый ранний), не больше LUZ_BK_KEEP дней */
  const seen=new Set(),old=[];
  for(const f of files){if(seen.has(f.day)||seen.size>=LUZ_BK_KEEP-(made?1:0))old.push(f);else seen.add(f.day)}
  await Promise.all(old.map(f=>fetch('https://www.googleapis.com/drive/v3/files/'+f.id,{method:'DELETE',headers:H}).catch(()=>{})));
  try{localStorage.setItem(lk,day)}catch(e){}
  return made}
/* Окно со списком снимков. getTok — функция приложения, возвращающая токен (по нажатию
   можно и с окном входа Google); fname — начало имени скачиваемого файла. */
function luzBackupSheet(getTok,app,fname,hint){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;color-scheme:light dark';
  const bx=document.createElement('div');
  bx.style.cssText='background:Canvas;color:CanvasText;width:100%;max-width:520px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 22px;box-shadow:0 -6px 30px rgba(0,0,0,.25);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif';
  if(matchMedia('(min-width:640px)').matches){ov.style.alignItems='center';bx.style.borderRadius='16px'}
  const close=()=>{ov.remove();document.removeEventListener('keydown',esc)},esc=e=>{if(e.key==='Escape')close()};
  ov.onclick=e=>{if(e.target===ov)close()};document.addEventListener('keydown',esc);
  const h=document.createElement('div');h.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px';
  const t=document.createElement('b');t.textContent='Копии на Google Диске';t.style.cssText='flex:1;font-size:17px';
  const x=document.createElement('button');x.type='button';x.textContent='✕';x.title='Закрыть';x.style.cssText='border:0;background:none;color:inherit;font-size:18px;cursor:pointer;padding:4px 8px';x.onclick=close;
  h.append(t,x);
  const p=document.createElement('div');p.style.cssText='font-size:13px;opacity:.72;margin-bottom:12px';
  p.textContent='Снимок делается сам раз в день после синхронизации, хранятся последние '+LUZ_BK_KEEP+' дней. Скачайте нужный и загрузите его '+(hint||'импортом')+'.';
  const list=document.createElement('div');list.textContent='Загружаю список…';list.style.cssText='display:flex;flex-direction:column;gap:6px';
  bx.append(h,p,list);ov.append(bx);document.body.append(ov);
  const kb=n=>n>=1048576?(n/1048576).toFixed(1).replace('.',',')+' МБ':Math.max(1,Math.round(n/1024))+' КБ';
  const fmt=d=>new Date(d+'T12:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
  (async()=>{
    let tok;try{tok=await getTok()}catch(e){list.textContent='Не удалось войти в Google: '+(e&&e.message||e);return}
    let fs;try{fs=await luzBackupList(tok,app)}catch(e){list.textContent=e.message;return}
    list.textContent='';
    if(!fs.length){list.textContent='Снимков пока нет — первый появится после ближайшей синхронизации.';return}

/* ---- разбор старого поля sex ----
   В таблице это была свободная пометка: «+», «++», «1» — было; «-» — не было;
   «р», «Р», «руч», «Лр» — рукой; плюс отдельные буквы «м», «с», «Л», «др»,
   смысл которых утрачен — считаем их за секс, как и любую непустую пометку.
   Комбинации вида «+ р» и «руч Л» означают сразу и то и другое. */
function parseSex(v){
  const s=String(v??'').trim();
  if(!s||s==='-') return {sexn:0,hand:0};
  const low=s.toLowerCase();
  /* «р» как отдельное слово или «руч» в любом месте; «др» не в счёт */
  const hand=/(^|[^а-яё])(р|руч\w*)($|[^а-яё])/.test(low) || /(^|[^а-яё])л?р$/.test(low);
  /* остаток строки без «ручных» кусков: если что-то осталось — был и секс */
  const rest=low.replace(/руч\w*/g,'').replace(/(^|[^а-яё])р($|[^а-яё])/g,'$1$2').trim();
  const plus=(s.match(/\+/g)||[]).length;
  const sexn = plus ? Math.min(plus,3) : (rest?1:0);
  return {sexn, hand:hand?1:0};
}

   старая колонка «Закал» (поле hard) — в «Плавание / закаливание» */
function migrateEx(x){
  if(x.hard!=null){
    const n=+x.hard||0;
    if(n>0){
      x.ex=x.ex||{};
      if(!x.ex[EX_COLD]) x.ex[EX_COLD]= n>1 ? `закаливание ×${n}` : 'закаливание';
      /* поля Спорта видны только у отмеченного дня — иначе запись потеряется */

  const ex=x.ex; if(!ex) return;
  if(ex['Присед']!=null){
    if(ex['Приседания']==null) ex['Приседания']=ex['Присед'];
    delete ex['Присед'];

    ex['Пресс'] = pr ? `${pr} · планка ${pl}` : `планка ${pl}`;
  }

}

const LAT={a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у',b:'в',h:'н',k:'к',m:'м',t:'т'};

  const t=String(n??'').trim();
  if(!t) return '';

  if(!k||SUPP_DROP.some(d=>suppKey(d)===k)) return '';
  if(SUPP_CANON[k]) return SUPP_CANON[k];
  /* обрубок: подтягиваем к полному названию, которое с него начинается.
     Только при однозначном совпадении — иначе «вит» съел бы все витамины разом. */
  if(k.length>=3){

   облако, «Экспорт JSON»). Раньше они лежали здесь текстом; архив прежнего
   содержимого — файл «итоги-месяцев-2022-2026.json» в папке проекта. */
const LIFE_SUMMARIES={};
const BLANK=()=>({days:{},goals:[],notes:{},supps:[],sec:{},secDel:{},lifeBirth:LIFE_BIRTH,lifeSummaries:{},portfolio:[],updated:0});
let DB=BLANK(), CFG={...DEF_CFG}, cur=today(), tab='day';
let dq='', gfilter='', nsec='';
/* Разделы можно переименовать, добавить и удалить, поэтому активный фильтр
   держим проверенным: пропал раздел — встаём на первый доступный.
   Скрытый раздел первым не выбираем, иначе он откроется сам собой. */
function initFilters(){
  const s=SCOPES(), n=NSEC().filter(([k])=>(k!==HIDDEN_SEC||zhOpen)&&k!=='books');
  if(!gfilter||!s.some(x=>x[0]===gfilter)) gfilter=s[0][0];
  if(!nsec||!n.some(x=>x[0]===nsec)) nsec=(n[0]||NSEC()[0])[0];
}
function migrateZh(){
  if(DB.zhV>=ZH_V) return false;
  const list=DB.notes&&DB.notes[HIDDEN_SEC];
  if(Array.isArray(list)) list.reverse();
  DB.zhV=ZH_V;
  return true;
}
function migrateSections(){
  if(DB.secV>=SEC_V) return false;
  const list=DB.sec&&DB.sec.notes;
  const row=Array.isArray(list)&&list.find(s=>s[0]==='biz'||s[1]==='Бизнес'||s[1]==='🚀 Проекты');
  if(row){ row[0]='biz'; row[1]='🚀 Проекты'; }
  DB.secV=SEC_V;
  return true;
}
function migrateBooks(){
  if(DB.booksV>=BOOKS_V) return false;
  DB.notes=DB.notes||{};
  const list=DB.notes.books;
  if(Array.isArray(list)){
    DB.notes.books=list.map(v=>typeof v==='string'
      ? {id:uid(),text:v,read:false}
      : {id:v.id||uid(),text:String(v.text??''),read:!!v.read});
  }
  DB.booksV=BOOKS_V;
  return true;
}
/* «Ж» скрыт: открывается тремя тапами по заголовку «Заметки», закрывается при уходе с вкладки */
const HIDDEN_SEC='zh_list';
let zhOpen=false, zhTaps=0, zhT=null;

function load(){
  let raw=null;
  try{raw=localStorage.getItem(LS)}catch(e){}
  if(raw){ try{DB=Object.assign(BLANK(),JSON.parse(raw));
    let need = DB.suppV!==SUPP_V || !(DB.actsV>=ACTS_V) || !(DB.goalsV>=GOALS_V) || !(DB.zhV>=ZH_V) || !(DB.secV>=SEC_V) || !(DB.sleepTzV>=SLEEP_TZ_V) || !(DB.booksV>=BOOKS_V);
    if(DB.lifeBirth!==LIFE_BIRTH){DB.lifeBirth=LIFE_BIRTH;need=true}
    if(DB.suppV!==SUPP_V) migrateSupps();
    migrateSleepTZ(); migrateBooks();
    migrateActs(); migrateGoals();
    if(migrateZh()) need=true;
    if(migrateSections()) need=true;
    if(migrateClean()) need=true;
    if(need) localStorage.setItem(LS,JSON.stringify(DB));
  }catch(e){} }
  else { seedFromFile(); }
  try{const c=localStorage.getItem(LSC); if(c) CFG=Object.assign({...DEF_CFG},JSON.parse(c));}catch(e){}
  /* общие с бюджетом и медкартой Client ID и Gemini — общее побеждает */
  Object.assign(CFG,luzShared.pull(luzDiaryOwn()));
  try{localStorage.setItem(LSC,JSON.stringify(CFG))}catch(e){}
  CFG.weights=Object.assign(ACT_W(),CFG.weights||{});
  /* «Руч» — наблюдение, а не достижение: вес держим нулевым */
  ACTS.filter(a=>a.w0).forEach(a=>CFG.weights[a.k]=0);
  initFilters();
}
function seedFromFile(){
  try{
    const el=$('#seed');
    if(!el||!el.textContent.trim()){ migrateSupps(); return } // опубликованная версия: данные придут из облака
    const s=JSON.parse(el.textContent);
    /* В seed теперь лежит обычная выгрузка «Экспорт JSON» — там уже готовый
       формат: плоский массив целей, справочник добавок объектами, разделы.
       Первый, рукописный формат (suppDict и цели, разложенные по месяцам)
       разбираем по-прежнему: такой файл мог остаться у кого-то на руках. */
    if(Array.isArray(s.goals)){
      DB=Object.assign(BLANK(),s);
    }else{
      DB.days=s.days||{}; DB.notes=s.notes||{}; DB.supps=(s.suppDict||[]).map(n=>({id:uid(),name:n,slot:'day'}));
      DB.goals=flattenGoals(s.goals||{});
    }
    DB.lifeBirth=LIFE_BIRTH;
    if(DB.suppV!==SUPP_V) migrateSupps();
    migrateSleepTZ(); migrateBooks();
    migrateActs(); migrateGoals(); migrateZh(); migrateSections(); migrateClean();
    /* Время правки берём из выгрузки, если оно там есть: иначе свежая копия
       выглядит новее облачной и синхронизация не подтянет более поздние дни. */
    if(!DB.updated) DB.updated=Date.now();
    localStorage.setItem(LS,JSON.stringify(DB));
  }catch(e){ console.warn('seed',e); }
}
/* сводит варианты названий к единым и сортирует справочник по частоте приёма */
function migrateSupps(force){
  if(DB.suppV===SUPP_V && !force) return;
  const freq={}, customCat={};
  /* Категория пользовательской добавки живёт в справочнике, а не в дне.
     При пересборке справочника не теряем её и одновременно канонизируем имя. */
  for(const s of DB.supps||[]){
    const n=canonSupp(s&&s.name);
    const cat=SUPP_CATEGORIES?.find(c=>c.id===s?.category);
    if(n&&cat&&cat.id!=='unknown') customCat[n]=cat.id;
  }
  for(const d of Object.values(DB.days||{})){
    if(!Array.isArray(d.supp)) continue;
    const seen=[];
    for(const raw of d.supp){
      const n=canonSupp(raw);
      if(!n||seen.includes(n)) continue;
      seen.push(n); freq[n]=(freq[n]||0)+1;
    }
    d.supp=seen;
  }
  const names=new Set([...Object.keys(freq), ...Object.keys(SUPP_MERGE),
    ...(DB.supps||[]).map(s=>canonSupp(s.name))].filter(Boolean));
  DB.supps=[...names].sort((a,b)=>(freq[b]||0)-(freq[a]||0)||a.localeCompare(b,'ru'))
    .map(n=>({id:uid(),name:n,slot:'day',n:freq[n]||0,
      ...(!SUPP_CAT_BY_NAME?.has(n)&&customCat[n]?{category:customCat[n]}:{})}));
  /* всё, что не удалось привести к полному названию */
  DB.suppUnknown=[...names].filter(n=>!SUPP_MERGE[n])
    .map(n=>({name:n,n:freq[n]||0})).sort((a,b)=>b.n-a.n);
  DB.suppV=SUPP_V;
}
/* показать нераспознанные названия, чтобы дописать их в словарь */

  $('#uRe').onclick=()=>{migrateSupps(true);save();closeSheet();rDay();
    toast(`Готово: ${(DB.suppUnknown||[]).length} нераспознанных`)};

function flattenGoals(g){
  const out=[];
  const push=(list,scope)=>(list||[]).forEach(t=>out.push({id:uid(),text:t,scope,done:false,created:today()}));
  Object.entries(g.month||{}).forEach(([k,v])=>{
    if(/побед/i.test(k)) return;
    push(v, /глобал/i.test(k)?'life' : /регуляр/i.test(k)?'regular' : 'month');
  });
  Object.entries(g.year||{}).forEach(([k,v])=>{ if(/сильн/i.test(k))return; push(v,'year'); });
  Object.entries(g.phuket||{}).forEach(([k,v])=>push(v,'phuket'));
  return out;
}
/* ---- разбор «Глобальных» на разделы ----
   Список был одной простыней с заголовками-строками вида «Бизнес:».
   Заголовок задаёт раздел для всего, что идёт следом, и сам из списка убирается. */
const GOALS_V=2;
const GOAL_SECT=[[/^бизнес:?$/i,'biz'],[/^самооценка:?$/i,'self'],
  [/^изменения\s*\/\s*развитие:?$/i,'grow'],[/^общение:?$/i,'talk']];
/* эти четыре раздела — не цели, а мысли: их место в Заметках */
const TO_NOTES=['biz','self','grow','talk'];
function migrateGoals(){
  if(DB.goalsV>=GOALS_V) return;
  if(!(DB.goalsV>=1)){
    const out=[]; let sc=null;
    for(const g of DB.goals||[]){
      if(g.scope!=='life'){ out.push(g); sc=null; continue }
      const t=String(g.text||'').trim();
      const hit=GOAL_SECT.find(([re])=>re.test(t));
      if(hit){ sc=hit[1]; continue }        // заголовок в список не переносим
      if(sc) g.scope=sc;
      out.push(g);
    }
    DB.goals=out;
  }
  /* v2: разделы-мысли уезжают в Заметки, «100 хочу» — наоборот, в Цели */
  DB.notes=DB.notes||{};
  const keep=[];
  for(const g of DB.goals||[]){
    if(TO_NOTES.includes(g.scope)){
      const l=DB.notes[g.scope]=DB.notes[g.scope]||[];
      if(!l.includes(g.text)) l.push(g.text);
    } else keep.push(g);
  }
  DB.goals=keep;
  for(const t of DB.notes.wish||[]){
    if(!DB.goals.some(g=>g.scope==='wish'&&g.text===t))
      DB.goals.push({id:uid(),text:t,scope:'wish',done:false,created:today()});
  }
  delete DB.notes.wish;
  DB.goalsV=GOALS_V;
}
/* Разделы, вычеркнутые из списка вместе с содержимым.
   Записи такого раздела в приложении не видны, но продолжают ездить
   в выгрузках и в облаке, поэтому вычищаем их при каждой загрузке.
   Возвращает true, если что-то удалили — вызывающий сохранит результат. */
const SEC_DROP=['zh_thoughts'];
function migrateClean(){
  let hit=false;
  /* Итоги месяцев переносим из кода в данные: так они ездят через облако,
     а из публичного файла константу можно вырезать. Заполняем только
     отсутствующие ключи — правки и удаления (пустая строка) не трогаем. */
  DB.lifeSummaries=DB.lifeSummaries||{};
  for(const[k,v]of Object.entries(LIFE_SUMMARIES)){
    if(!(k in DB.lifeSummaries)){ DB.lifeSummaries[k]=v; hit=true }
  }
  for(const k of SEC_DROP){
    if(DB.notes && k in DB.notes){ delete DB.notes[k]; hit=true }
    const L=(DB.sec&&DB.sec.notes)||null;
    if(L){ const i=L.findIndex(s=>s[0]===k); if(i>=0){ L.splice(i,1); hit=true } }
  }
  return hit;
}
function save(push=true){
  tidyDays();
  DB.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast('Хранилище переполнено')}
  if(push&&CFG.autoSync&&CFG.clientId&&CFG.everSignedIn) queuePush();
}
function saveCfg(){try{localStorage.setItem(LSC,JSON.stringify(CFG))}catch(e){} luzShared.push(luzDiaryOwn())}

/* Пустой день в базу не кладём: раньше простой просмотр даты заводил {}
   и пустышки уходили в облако. Незаписанный день живёт черновиком
   и попадает в DB.days при первом save() с непустым содержимым.
   var — день может понадобиться раньше, чем дошёл бы let. */
var dayDraft={d:'',x:null};
function day(d=cur){
  if(DB.days[d]) return DB.days[d];
  if(dayDraft.d!==d) dayDraft={d,x:{}};
  return dayDraft.x;
}
/* перед записью: черновик с содержимым — в базу, опустевшие дни — вон
   (опустевший текущий день остаётся черновиком, чтобы ссылки на него
   в открытом экране продолжали работать) */
function tidyDays(){
  const {d,x}=dayDraft;
  if(d&&x&&Object.keys(x).length){ if(!DB.days[d]) DB.days[d]=x; dayDraft={d:'',x:null} }
  for(const k in DB.days){
    const v=DB.days[k];
    if(v&&typeof v==='object'&&!Object.keys(v).length){delete DB.days[k]; if(k===d||k===cur) dayDraft={d:k,x:v}}
  }
}
const sortedDays=()=>Object.keys(DB.days).sort();

/* Оценка дня — сумма всех кнопок: Спорт плюс каждая активность,
   причём кнопка, нажатая трижды, даёт три балла. Не считается только
   помеченная w0 («Руч»): это наблюдение, а не достижение.
   w0 проверяем прямо здесь, а не только через CFG.weights: настройки
   лежат отдельным ключом в localStorage и могут прийти из старой
   версии, где нынешних кнопок ещё не было. */
function score(d){
  const x=DB.days[d]; if(!x) return 0;
  let s=0;
  for(const a of ACTS){
    if(a.w0) continue;
    const v = a.k==='sport' ? (x.sport?1:0) : (+x[a.k]||0);
    s+=v*(CFG.weights[a.k]??1);
  }
  return Math.round(s*10)/10;
}

/* ---- синхронизация: Google Drive через OAuth ----
   Файл dnevnik.json лежит в скрытой папке приложения на вашем Диске
   (appDataFolder) — не мешается среди файлов и виден только этой странице.

   Схема (с 30.10.2026, по образцу бюджета): один обмен syncNow() всегда
   делает всё сразу — скачивает облачную копию, СЛИВАЕТ её со здешней
   и записывает результат и сюда, и на Диск. Раньше были отдельные
   «Загрузить» и «Отправить», а победителем считалась копия с бо́льшим
   DB.updated целиком: правки, сделанные на двух устройствах между
   обменами, теряли одну из сторон или навсегда застревали в CONFLICT.

   Слияние трёхстороннее: base — копия на момент последнего удачного
   обмена этого устройства (localStorage LSB). Что поменялось только
   здесь — берём здешнее, только в облаке — облачное, удалённое на одной
   стороне и не тронутое на другой — удаляется. Если одно и то же поле
   поменяли обе стороны, побеждает копия с более поздним DB.updated. */
const GFILE='dnevnik.json', GSCOPE='https://www.googleapis.com/auth/drive.appdata';
const LSB='diary.base.v2';
/* SY — состояние обмена. relogin: тихое продление входа не прошло, фон
   молчит до нажатия кнопки. pending: правка пришла во время обмена.
   gen: поколение — «Отключить» посреди обмена гасит его ответы. */
const SY={busy:false,pending:false,timer:null,retry:null,fails:0,relogin:false,err:'',seen:0,gen:0};
let tok=null,tokExp=0,gis=null;
const fmtTS=t=>t?new Date(+t).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';

/* Состояние обмена — точка в углу кнопки синхронизации в шапке; подсказка
   кнопки повторяет текст состояния, при обмене значок крутится. */
function dot(s,t){const e=$('#syncDot');e.className='sync-dot'+(s?' '+s:'');
  const b=$('#syncBtn'); if(b){b.title=(t||'Синхронизация')+' — нажмите, чтобы синхронизировать';b.classList.toggle('busy',s==='busy')}}
const signedIn=()=>!!tok&&Date.now()<tokExp;
const autoOn=()=>!!(CFG.clientId&&CFG.autoSync&&CFG.everSignedIn)&&!SY.relogin&&location.protocol!=='file:';
/* Правка → обмен через 2,5 с. Идёт обмен — отмечаем, он догонит сам. */
function queuePush(){
  if(!autoOn()) return;
  if(SY.busy){SY.pending=true;return}
  clearTimeout(SY.timer); SY.timer=setTimeout(()=>{SY.timer=null;syncNow(false).catch(()=>{})},2500);
}

function loadGIS(){
  if(window.google?.accounts?.oauth2) return Promise.resolve();
  if(gis) return gis;
  gis=new Promise((ok,no)=>{
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client'; s.async=true;
    s.onload=ok; s.onerror=()=>{gis=null;no(new Error('не загрузился скрипт Google — проверьте интернет'))};
    document.head.appendChild(s);
  });
  return gis;
}
const authErr=m=>{const e=new Error(m);e.auth=true;return e};
/* interactive=false — молча, с prompt:'none': Google продлевает вход без
   вопросов, если его уже разрешали (так работает и бюджет). Не вышло —
   NEED_LOGIN, и окно в фоне не открываем никогда: само выскочившее окно
   выглядит как поломка. Окно входа — только по кнопке, и только одно:
   прежняя пара «тихо, а не вышло — с окном» упиралась в блокировку
   всплывающих окон («Failed to open popup window»). */
function auth(interactive){
  if(signedIn()) return Promise.resolve(tok);
  if(!CFG.clientId) return Promise.reject(authErr('NO_CLIENT_ID'));
  const gen=SY.gen;
  return loadGIS().then(()=>new Promise((ok,no)=>{
    let done=false;
    const c=google.accounts.oauth2.initTokenClient({
      client_id:CFG.clientId, scope:GSCOPE, prompt:interactive?'':'none',
      callback:r=>{
        done=true;
        if(gen!==SY.gen) return no(authErr('OFF'));
        if(r&&r.access_token){
          tok=r.access_token; tokExp=Date.now()+(+r.expires_in||3600)*1000-60000;
          CFG.everSignedIn=true; SY.relogin=false; saveCfg(); ok(tok);
        } else no(authErr(interactive?((r&&r.error)||'LOGIN_CANCELLED'):'NEED_LOGIN'));
      },
      error_callback:e=>{done=true; no(authErr(!interactive?'NEED_LOGIN'
        :e&&e.type==='popup_failed_to_open'?'POPUP_BLOCKED':'LOGIN_CANCELLED'))}
    });
    c.requestAccessToken();
    setTimeout(()=>{if(!done)no(new Error('Google не ответил'))},120000);
  }));
}
function signOut(){
  if(tok&&window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(tok,()=>{});
  SY.gen++; clearTimeout(SY.timer); clearTimeout(SY.retry); SY.timer=SY.retry=null;
  SY.busy=SY.pending=SY.relogin=false; SY.fails=0; SY.err='';
  tok=null;tokExp=0;CFG.everSignedIn=false;CFG.fileId='';saveCfg();
  try{localStorage.removeItem(LSB)}catch(e){}
  dot('','Не подключено');
}
async function gapi(url,opt={}){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401){tok=null;tokExp=0;throw authErr('NEED_LOGIN')}
  if(!r.ok) throw new Error('Google ответил '+r.status+': '+(await r.text()).slice(0,120));
  return r;
}
/* Все копии файла, старейшая первой. Раньше id первой найденной копии
   запоминался навсегда (CFG.fileId), и если два устройства когда-то
   создали по своему файлу, они так и писали каждое в свой — «ошибок
   нет, а данные не приходят». Теперь лишние копии сливаются в основную. */
async function listFiles(){
  const q=encodeURIComponent(`name='${GFILE}' and trashed=false`);
  const j=await (await gapi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&orderBy=createdTime'+
    '&fields=files(id)&pageSize=20&q='+q)).json();
  return (j.files||[]).map(f=>f.id);
}
const getFile=async id=>(await gapi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).json();
async function putFile(id,body){
  const meta={name:GFILE,mimeType:'application/json',...(id?{}:{parents:['appDataFolder']})};
  const bnd='b'+uid();
  const data=`--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+
    JSON.stringify(meta)+`\r\n--${bnd}\r\nContent-Type: application/json\r\n\r\n`+body+`\r\n--${bnd}--`;
  const r=await gapi('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+
    '?uploadType=multipart&fields=id',

/* ---- слияние ---- */
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
/* JSON с отсортированными ключами: порядок ключей у разных устройств
   бывает разным, а данные при этом те же */
function stab(v){
  if(Array.isArray(v)) return '['+v.map(stab).join(',')+']';
  if(isObj(v)) return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stab(v[k])).join(',')+'}';
  return v===undefined?'null':JSON.stringify(v);
}
const eq=(a,b)=>a===b||(a!==undefined&&b!==undefined&&typeof a==='object'&&typeof b==='object'&&stab(a)===stab(b));
/* a — здешнее, b — облачное, base — общий предок (может быть undefined).
   undefined в результате — «ключа нет». Удаление против правки — правка
   выигрывает: потерять запись хуже, чем вернуть удалённую. */
function merge3(base,a,b,preferA){
  if(eq(a,b)) return a;
  if(eq(base,a)) return b;
  if(eq(base,b)) return a;
  if(a===undefined) return b;
  if(b===undefined) return a;
  if(isObj(a)&&isObj(b)){
    const bs=isObj(base)?base:{}, o={};
    for(const k of new Set([...Object.keys(a),...Object.keys(b)])){
      const v=merge3(bs[k],a[k],b[k],preferA);
      if(v!==undefined) o[k]=v;
    }
    return o;
  }
  if(Array.isArray(a)&&Array.isArray(b)) return mergeArr(Array.isArray(base)?base:[],a,b,preferA);
  return preferA?a:b;
}
/* Элемент списка узнаём по id (цели, добавки, книги), по первому полю
   (разделы [ключ, название]) или по самому значению (заметки-строки,
   добавки дня). Исправленная строка — это удаление старой и новая. */
function itemKeys(arr){
  const n={};
  return arr.map(x=>{
    const k= isObj(x)&&x.id!=null ? 'i:'+x.id
      : Array.isArray(x)&&x.length&&(typeof x[0]==='string'||typeof x[0]==='number') ? 'p:'+x[0]
      : typeof x==='object'&&x!==null ? 'j:'+stab(x) : 'v:'+typeof x+':'+x;
    n[k]=(n[k]||0)+1; return n[k]>1?k+'#'+n[k]:k;
  });
}
function mergeArr(base,a,b,preferA){
  const kB=itemKeys(base), kA=itemKeys(a), kR=itemKeys(b);
  const mB=new Map(kB.map((k,i)=>[k,base[i]])), mA=new Set(kA), mR=new Map(kR.map((k,i)=>[k,b[i]]));
  const out=[], outK=[];
  kA.forEach((k,i)=>{
    const v=merge3(mB.get(k),a[i],mR.get(k),preferA);
    if(v!==undefined){out.push(v);outK.push(k)}
  });
  /* новое из облака встаёт за своим облачным соседом: добавленное
     сверху (unshift) остаётся сверху, в конец — в конце */
  kR.forEach((k,i)=>{
    if(mA.has(k)) return;
    const v=merge3(mB.get(k),undefined,b[i],preferA);
    if(v===undefined) return;
    let pos=0;
    for(let j=i-1;j>=0;j--){const p=outK.indexOf(kR[j]); if(p>=0){pos=p+1;break}}
    out.splice(pos,0,v); outK.splice(pos,0,k);
  });
  return out;
}
function loadBase(){try{const s=localStorage.getItem(LSB);return s?JSON.parse(s):null}catch(e){return null}}
function saveBase(s){try{localStorage.setItem(LSB,s)}catch(e){try{localStorage.removeItem(LSB)}catch(_){}}}
/* все миграции разом — для облачной копии, пришедшей от старой версии */
function runMigrations(){
  DB.lifeBirth=LIFE_BIRTH;
  if(DB.suppV!==SUPP_V) migrateSupps();
  migrateSleepTZ(); migrateBooks();
  migrateActs(); migrateGoals(); migrateZh(); migrateSections(); migrateClean();
}
function normalize(raw){
  const keep=DB;
  try{ DB=Object.assign(BLANK(),raw); runMigrations(); return DB } finally{ DB=keep }
}
function mergeDB(local,remote){
  const base=loadBase();
  const newer=(remote.updated||0)>(local.updated||0)?remote:local;
  if(!base){
    /* Общего предка нет: первый обмен этого устройства после обновления
       или после «Отключить». Не правили здесь с прошлого обмена — берём
       облачную копию; ни разу не обменивались — более свежую целиком;
       иначе сливаем без предка (ничего не теряется, удалённое может вернуться). */
    if(!CFG.lastSync) return newer;
    if(!((local.updated||0)>CFG.lastSync)) return remote;
  }
  const m=merge3(base||undefined,local,remote,(local.updated||0)>=(remote.updated||0));
  m.updated=Math.max(local.updated||0,remote.updated||0);
  return m;
}
/* Перерисовка после обмена. Пока человек что-то печатает, ждём: render()
   пересоздал бы поле и стёр несохранённый ввод. */
let renderLater=false;
function renderSafe(){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.closest('#modal')){renderLater=true;return}
  renderLater=false; try{render()}catch(e){toast('Данные получены, но экран не обновился — перезагрузите страницу')}
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderLater)renderSafe()},0));

/* Один обмен с Диском. mode: 'sync' — слить; 'up' — заменить облако
   здешней копией; 'down' — заменить здешнюю облачной (аварийные кнопки).
   Возвращает {got, sent}: пришло ли что-то с Диска и ушло ли что-то туда. */
async function syncNow(interactive,mode='sync'){
  if(SY.busy){ if(interactive) throw new Error('BUSY'); SY.pending=true; return }
  if(location.protocol==='file:'){ if(interactive) throw authErr('FILE_PROTO'); return }
  if(!CFG.clientId){ if(interactive) throw authErr('NO_CLIENT_ID'); return }
  if(!interactive&&!autoOn()) return;
  SY.busy=true; SY.err=''; if(interactive) SY.relogin=false;
  clearTimeout(SY.retry); SY.retry=null;
  const gen=SY.gen, stale=()=>gen!==SY.gen;
  dot('busy','Синхронизация…');
  try{
    await auth(interactive);
    if(stale()) throw authErr('OFF');
    const ids=await listFiles();
    if(stale()) throw authErr('OFF');
    const bad=new Set();
    const raws=await Promise.all(ids.map((id,i)=>getFile(id).catch(e=>{
      if(i===0) throw e;            // основную копию прочитать обязаны
      bad.add(id); return null;     // нечитаемую лишнюю не сливаем и не удаляем
    })));
    if(stale()) throw authErr('OFF');
    let remote=null;
    for(const r of raws){
      if(!isObj(r)||!r.days) continue;
      const n=normalize(r);
      remote=remote?merge3(undefined,remote,n,(remote.updated||0)>=(n.updated||0)):n;
    }
    const before=stab(DB);
    const t0=Date.now();
    let next= !remote||mode==='up' ? DB : mode==='down' ? remote : mergeDB(DB,remote);
    DB=Object.assign(BLANK(),next);
    initFilters();
    try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){throw new Error('не хватает места в хранилище браузера')}
    const now=stab(DB), got=now!==before;
    const body=JSON.stringify(DB);
    const sent= !remote || ids.length>1 || now!==stab(remote);
    if(sent){
      const id=await putFile(ids[0]||null,body);
      if(id) CFG.fileId=id;
      await Promise.all(ids.slice(1).filter(x=>!bad.has(x)).map(x=>delFile(x).catch(()=>{})));
    }
    saveBase(body);
    /* общие ключи и выбор ИИ — отдельным файлом на том же Диске; сбой тут обмен не срывает */
    luzSettingsSync(tok).then(c=>{if(c) luzDiaryOnShared()}).catch(()=>{});
    /* снимок дня для истории копий; сбой обмен не срывает */
    luzBackupDaily(tok,'diary',()=>body).catch(()=>{});
    CFG.lastSync=t0; saveCfg();
    SY.fails=0;
    dot('ok','Синхронизировано '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}));
    if(got) renderSafe();
    return {got,sent};
  }catch(e){
    const msg=e&&e.message||'не удалось';
    if(msg==='OFF'||stale()) return;
    if(e.auth&&!interactive){
      /* тихо продлить вход не вышло — ждём кнопку, записи остаются здесь */
      SY.relogin=true; tok=null; tokExp=0;
      SY.err='Нужен повторный вход в Google. Записи сохраняются на этом устройстве.';
      dot('err',SY.err+' Нажмите на точку.');
    } else {
      SY.err=hintAuth(msg);
      dot('err',SY.err);
      /* сорвалась сеть или Диск — повторяем сами, всё реже: от 5 с до минуты */
      if(!e.auth&&CFG.everSignedIn){
        SY.fails++;
        const wait=Math.min(60000,5000*2**(SY.fails-1));
        clearTimeout(SY.retry); SY.retry=setTimeout(()=>{SY.retry=null;syncNow(false).catch(()=>{})},wait);
      }
    }
    if(interactive) throw e;
  }finally{
    SY.busy=false;
    if(SY.pending&&!stale()){SY.pending=false;queuePush()}
  }
}

const dShort=s=>{const d=pISO(s);return d.getDate()+' '+MONS[d.getMonth()]};
