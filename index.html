}
function plDays(n){n=Math.abs(n);const a=n%10,b=n%100;return a===1&&b!==11?'день':a>=2&&a<=4&&(b<12||b>14)?'дня':'дней'}

/* Компактный бейдж рядом с датой: значок и короткая подпись.
   Тап переключает, долгое нажатие возвращает день к графику. */
/* Значение с браслета в ряду оценки сна. Поля ввода тут нет намеренно:
   это первичные данные прибора, руками они не правятся — при следующем
   импорте правка всё равно была бы затёрта. Пустая ячейка остаётся
   на месте, чтобы ряд не прыгал в дни без выгрузки. */
function roBox(label,v,hint){
  return `<div class="bt-col" title="${esc(hint)}"><span class="bt-lb">${label}</span>
    <div class="ro${v==null?' dash':''}"><b>${v==null?'—':v}</b></div></div>`;
}
/* строка с остальным, что принёс браслет: показываем только если данные есть.
   Оценка сна и минимальный пульс — выше, в ряду оценки; пульс покоя —
   ниже, рядом с весом и шагами. Здесь остаются фазы сна. */
function bandLine(x){
  const p=[];
  if(x.deepMin!=null) p.push(`глубокий <b>${fmtH(x.deepMin/60)}</b>`);
  if(x.remMin!=null)  p.push(`быстрый <b>${fmtH(x.remMin/60)}</b>`);
  if(!p.length) return '';
  return `<div class="small muted" style="margin-top:9px">⌚ ${p.join(' · ')}</div>`;
}
function workBadge(d){

}

const SUPP_CAT_BY_NAME=(()=>{
  const m=new Map();
  for(const cat of SUPP_CATEGORIES) for(const n of cat.items){
    if(m.has(n)) throw new Error('Добавка в нескольких категориях: '+n);
    m.set(n,cat);
  }
  return m;
})();
const SUPP_UNKNOWN_CATEGORY=SUPP_CATEGORIES.find(cat=>cat.id==='unknown');
function suppCategory(n){
  const key=canonSupp(n), known=SUPP_CAT_BY_NAME.get(key);
  if(known) return known;
  const rec=(DB.supps||[]).find(s=>canonSupp(s.name)===key);
  return SUPP_CATEGORIES.find(cat=>cat.id===rec?.category)||SUPP_UNKNOWN_CATEGORY;
}
function suppGroupHtml(names,selected,cls){
  const groups=new Map(SUPP_CATEGORIES.map(cat=>[cat.id,{cat,names:[]}]));
  for(const n of names){
    const cat=suppCategory(n);
    groups.get(cat.id).names.push(n);
  }
  return [...groups.values()].filter(g=>g.names.length).map(({cat,names:items})=>`
    <div class="supp-group" style="--supp-color:${cat.color}">
      <div class="supp-group-title">${esc(cat.label)}</div>
      <div class="chips">${items.map(n=>`<button class="chip ${cls} ${selected.includes(n)?'on':''}" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    </div>`).join('');
}
/* Разбивка по категориям на главном экране — намеренная, её не убирать. */
function suppChips(list){
  return suppGroupHtml([...new Set(list)],list,'sp');
}
function prevDayWith(f){
  let d=addD(cur,-1);
  for(let i=0;i<14;i++){ if(DB.days[d]&&DB.days[d][f]&&DB.days[d][f].length) return d; d=addD(d,-1); }
  return null;
}
function bindDay(){
  const x=day(cur);
  $('#pv').onclick=()=>{cur=addD(cur,-1);render()};
  const n=$('#nx'); if(n)n.onclick=()=>{if(cur<today()){cur=addD(cur,1);render()}};
  const t=$('#tdy'); if(t)t.onclick=()=>{cur=today();render()};
  $('#dp').onchange=e=>{if(e.target.value){cur=e.target.value;render()}};
  /* на компьютере щелчок по полю даты календарь сам не открывает */
  $('#dp').onclick=e=>{try{e.target.showPicker()}catch(_){}};
  /* Тап переключает рабочий/выходной; если совпало с графиком, ручную пометку
     убираем — день снова следует за сменами. Удержание сбрасывает к графику. */
  const wb=$('#wkBtn'); let wHeld=false, wT=null;
  wb.onclick=()=>{
    if(wHeld){wHeld=false;return}
    const v=!isWork(cur);
    if(v===shiftWork(cur)) delete x.work; else x.work=v?1:0;
    save(); rDay();
  };
  wb.addEventListener('pointerdown',()=>{
    clearTimeout(wT); wHeld=false;
    wT=setTimeout(()=>{
      if(!workManual(cur)) return;
      wHeld=true; if(navigator.vibrate)navigator.vibrate(15);
      delete x.work; save(); rDay(); toast('Вернул по графику');
    },450);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>wb.addEventListener(ev,()=>clearTimeout(wT)));
  $('#sq').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
    const v=+b.dataset.v; if(x.slept===v) delete x.slept; else x.slept=v; save(); rDay()};
  /* пустое поле — ключ удаляем, а не пишем undefined: иначе стёртый день
     не считается пустым и остаётся в базе */
  const setNum=(k,v)=>{const n=+v; if(n>0) x[k]=n; else delete x[k]; save()};
  $('#wt').onchange=e=>setNum('weight',e.target.value);
  $('#stp').onchange=e=>setNum('steps',e.target.value);
  /* Точечно обновляем итог, без rDay(): на десктопе стрелки в поле времени
     шлют change на каждый шаг, и полная перерисовка выбивала бы фокус. */
  const sleepIn=()=>{
    const bd=$('#bd').value, rs=$('#rs').value;
    if(bd) x.bed=bd; else delete x.bed;
    if(rs) x.rise=rs; else delete x.rise;
    const h=hoursBetween(x.bed,x.rise);
    /* больше 16 ч подряд — почти наверняка перепутано время (лёг 01:30,
       встал 01:00 давало 23,5 ч и портило средние); итог не пишем */
    const odd=h!=null&&h>16;
    if(h!=null&&!odd) x.sleepH=h; else delete x.sleepH;   // пара распалась — итог не оставляем
    const txt=odd?'проверьте время':x.sleepH!=null?fmtH(x.sleepH):'—';
    $('#shOut').textContent=txt;
    $('#sleepTot').textContent=x.sleepH!=null?txt:'';
    save();
  };
  $('#bd').onchange=sleepIn; $('#rs').onchange=sleepIn;
  $('#bd').onblur=()=>rDay(); $('#rs').onblur=()=>rDay();
  $$('.sp').forEach(b=>b.onclick=()=>{
    x.supp=x.supp||[]; const nm=b.dataset.n;
    const i=x.supp.indexOf(nm); i<0?x.supp.push(nm):x.supp.splice(i,1);
    save(); rDay();
  });
  const unk=$('#spUnk'); if(unk)unk.onclick=unknownSheet;
  const add=$('#spAdd'); if(add)add.onclick=suppSheet;
  const rep=$('#rep'); if(rep)rep.onclick=()=>{
    const prev=prevDayWith('supp');
    if(!prev) return;
    if(!confirm(`Заменить добавки за ${fmtD(cur)} списком за ${fmtD(prev)}?\n\nТекущий список будет затёрт.`)) return;
    x.supp=[...(DB.days[prev].supp||[])]; save(); rDay();
  };
  /* очистка списка добавок дня — только после подтверждения: кнопка стоит
     рядом с «+ Другая», и случайное нажатие стирало весь список */
  const clr=$('#spClr'); if(clr)clr.onclick=()=>{
    const n=(x.supp||[]).length;
    if(!confirm(`Убрать все добавки за ${fmtD(cur)} (${n} шт)?`)) return;
    x.supp=[];save();rDay();
  };
  $('#spt').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;
    x.sport=+b.dataset.v; if(!x.sport){delete x.ex; delete x.exBand} save(); rDay()};
  $$('.exi').forEach(i=>i.onchange=()=>{
    x.ex=x.ex||{}; const v=i.value.trim();
    v?x.ex[i.dataset.n]=v:delete x.ex[i.dataset.n]; save();
  });
  /* недописанный (ещё не сохранённый) текст записи дня забираем сразу:
     иначе его отложенное сохранение затёрло бы строку, дописанную плиткой */
  const flushNote=()=>{const n=$('#nt'); if(n&&n._t){clearTimeout(n._t); n._t=null;
    const v=n.value.trim(); v?x.note=v:delete x.note}};
  const bump=(k,dir)=>{
    flushNote();
    x[k]=clamp((+x[k]||0)+dir,0,3); if(!x[k])delete x[k];
    save(); rDay();
  };
  const A=$('#acts'); let held=false, ht=null;
  A.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;
    if(held){held=false;return}
    const k=b.dataset.k;
    bump(k, +1);
    const a=ACTS.find(t=>t.k===k);
    if(a&&a.ask) actAsk(a,x);
  };
  A.oncontextmenu=e=>{const b=e.target.closest('[data-k]');if(!b)return;
    e.preventDefault(); bump(b.dataset.k,-1);
  };
  const holdStart=e=>{const b=e.target.closest('[data-k]');if(!b)return;
    clearTimeout(ht); held=false;
    ht=setTimeout(()=>{held=true;
      if(navigator.vibrate)navigator.vibrate(15);
      bump(b.dataset.k,-1);
    },450)};
  const holdEnd=()=>clearTimeout(ht);
  A.addEventListener('pointerdown',holdStart);
  ['pointerup','pointerleave','pointercancel','scroll'].forEach(ev=>A.addEventListener(ev,holdEnd));
  const nt=$('#nt');
  nt.oninput=()=>{clearTimeout(nt._t);nt._t=setTimeout(()=>{nt._t=null;
    const v=nt.value.trim(); v?x.note=v:delete x.note; save();},600)};
}
/* Плитка с вопросом (ask в ACT_GROUPS): после нажатия — короткая строка,
   которая дописывается в запись дня как «значок текст». Пропуск или
   пустой ввод — плитка просто засчитана. Удержание (−1) окна не открывает
   и строку не стирает: запись дня правится руками. */
function actAsk(a,x){
  openSheet(`<h2>${a.ic} ${esc(a.lb)}</h2>
    <label class="bt-col"><span class="bt-lb">${esc(a.ask)}</span>
      <input type="text" id="aqT" placeholder="Коротко — допишется в «Дневник дня»" autocomplete="off"></label>
    <div class="small muted" style="margin-top:6px">${AI_PRIV.includes(a.k)?'Эта строка в разборы ИИ не отправляется.':'Строка попадёт в запись дня и в разборы ИИ вместе с ней.'}</div>
    <div class="row" style="margin-top:14px;gap:8px"><button class="btn" data-close style="flex:1">Пропустить</button>
      <button class="btn primary" id="aqOk" style="flex:1">Записать</button></div>`);
  const inp=$('#aqT'); setTimeout(()=>inp.focus(),60);
  const ok=()=>{const t=inp.value.trim().replace(/\s+/g,' ');
    /* с 24.11.2026 строка — только значок и текст: «👥 Бегал с ребятами» */
    if(t){ const line=`${a.ic} ${t}`;
      x.note=x.note?String(x.note).replace(/\s+$/,'')+'\n'+line:line; save(); toast('Записано в дневник дня') }
    closeSheet(); if(tab==='day') rDay()};
  $('#aqOk').onclick=ok;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
}

/* ================= ДНЕВНИК ================= */
function rDiary(){
  const ent=sortedDays().filter(d=>DB.days[d].note).reverse();
  const q=dq.toLowerCase();
  const list=q?ent.filter(d=>DB.days[d].note.toLowerCase().includes(q)):ent;
  const tags={};
  ent.forEach(d=>(DB.days[d].note.match(/#[\wа-яёА-ЯЁ-]+/g)||[]).forEach(t=>tags[t]=(tags[t]||0)+1));
  const top=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,12);
  $('#v-diary').innerHTML=`
  <div class="card">
    <input type="text" id="dsq" value="${esc(dq)}" placeholder="Поиск по ${ent.length} записям">
    ${top.length?`<div class="chips" style="margin-top:10px">${top.map(([t,n])=>
      `<button class="chip dtg ${dq===t?'on':''}" data-t="${esc(t)}">${esc(t)} ${n}</button>`).join('')}</div>`:''}
  </div>
  ${list.length?list.slice(0,150).map(d=>`
    <div class="item gd" data-d="${d}" role="button" tabindex="0" title="Открыть день">
      <div class="meta"><b>${fmtFull(d)}</b><span class="sc" title="Балл дня">${score(d)}</span></div>
      <div style="margin-top:5px;white-space:pre-wrap">${hl(DB.days[d].note)}</div>
    </div>`).join(''):'<div class="empty">Ничего не найдено</div>'}
  ${list.length>150?`<div class="empty">Показаны первые 150 из ${list.length}</div>`:''}`;
  const s=$('#dsq');
  s.oninput=()=>{clearTimeout(s._t);s._t=setTimeout(()=>{dq=s.value;rDiary();
    const f=$('#dsq');f.focus();f.setSelectionRange(f.value.length,f.value.length)},350)};
  $$('.dtg').forEach(b=>b.onclick=()=>{dq=dq===b.dataset.t?'':b.dataset.t;rDiary()});
  $$('.gd').forEach(b=>{
    /* вся карточка — ссылка на день; выделение текста мышью день не открывает */
    b.onclick=()=>{if(String(getSelection())) return; cur=b.dataset.d;go('day')};
    b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cur=b.dataset.d;go('day')}};
  });
}
const hl=t=>esc(t).replace(/#([\wа-яёА-ЯЁ-]+)/g,'<span class="tag">#$1</span>');

/* ================= ЦЕЛИ ================= */
/* Разделы целей и заметок можно переименовывать и добавлять свои,
   поэтому списки живут в данных. Ниже — только то, с чего начинали. */
const SCOPES_DEF=[['month','Месяц'],['year','2026'],['phuket','Пхукет'],['regular','Регулярные'],
  ['life','Глобальные'],['wish','100 хочу']];
const NSEC_DEF=[['ideas','Идеи и инсайты'],
  ['wins','Победы'],['books','Книги'],['insights','Инсайты'],
  ['biz','🚀 Проекты'],['self','Самооценка'],['grow','Изменения'],['talk','Общение'],
  ['zh_list','Ж'],['free','Свои']];
/* kind: 'goals' | 'notes'. Возвращает живой массив пар [ключ, название]. */
function secs(kind){
  const def = kind==='goals'?SCOPES_DEF:NSEC_DEF;
  DB.sec=DB.sec||{}; DB.secDel=DB.secDel||{};
  const gone=DB.secDel[kind]=DB.secDel[kind]||[];
  let L=DB.sec[kind];
  if(!Array.isArray(L)) L=DB.sec[kind]=def.map(p=>[...p]);
  /* Подпись встроенного раздела обновляем и здесь, а не только миграцией:
     список мог быть создан после старта или старое приложение могло остаться
     в памяти. Ключ `biz` и его записи при этом не меняются. */
  if(kind==='notes'){
    const biz=L.find(s=>s[0]==='biz'||s[1]==='Бизнес');
    if(biz){biz[0]='biz';biz[1]='🚀 Проекты'}
  }
  /* Разделы, появившиеся в новой версии приложения, добавляем на то место,
     которое они занимают в списке по умолчанию: «Идеи и инсайты» задуманы
     первыми, а простая дописька в конец ставила бы их последними.
     Ориентир — ближайший сосед сверху, который у пользователя уже есть;
     если такого нет, раздел встаёт в начало. Порядок, переставленный
     вручную, при этом не ломается: трогаем только новые ключи.
     Удалённые вручную не воскрешаем — их ключи помним в DB.secDel. */
  def.forEach((pair,di)=>{
    const[k,n]=pair;
    if(gone.includes(k)||L.some(s=>s[0]===k)) return;
    let at=0;
    for(let i=di-1;i>=0;i--){
      const p=L.findIndex(s=>s[0]===def[i][0]);
      if(p>=0){ at=p+1; break }
    }
    L.splice(at,0,[k,n]);
  });
  return L;
}
const SCOPES=()=>secs('goals');
const NSEC=()=>secs('notes');
const secName=(kind,k)=>(secs(kind).find(s=>s[0]===k)||[,k])[1];
/* сколько записей в разделе — нужно и для подписей, и чтобы не дать
   удалить непустой раздел вместе с содержимым */
const secCount=(kind,k)=>kind==='goals'
  ? DB.goals.filter(g=>g.scope===k).length
  : ((DB.notes||{})[k]||[]).length;

/* Окно «Разделы»: переименование, добавление, удаление пустых. */
function sectionsSheet(kind,after){
  const title=kind==='goals'?'Разделы целей':'Разделы заметок';
  const vis=()=>secs(kind).filter(([k])=>k!==HIDDEN_SEC||zhOpen);
  const draw=()=>{
    openSheet(`<h2>${title}</h2>
      <div id="slist">${vis().map(([k,n],i,arr)=>`
        <div class="row" style="margin-bottom:8px">
          <span class="smv"><button class="smv-b" data-k="${k}" data-d="-1" ${i===0?'disabled':''} title="Выше" aria-label="Переместить «${esc(n)}» выше">▲</button><button class="smv-b" data-k="${k}" data-d="1" ${i===arr.length-1?'disabled':''} title="Ниже" aria-label="Переместить «${esc(n)}» ниже">▼</button></span>
          ${k===HIDDEN_SEC?'<span class="sai-ph" title="Этот раздел ИИ не отправляется никогда"></span>'
            :`<button class="sai ${aiSecOn(kind,k)?'on':''}" data-k="${k}" aria-pressed="${aiSecOn(kind,k)}" title="${aiSecOn(kind,k)?'Доступен ИИ — нажмите, чтобы выключить':'Не доступен ИИ — нажмите, чтобы включить'}">🤖</button>`}
          <input type="text" class="snm" data-k="${k}" value="${esc(n)}" style="flex:1;min-width:0">
          <span class="small muted" style="width:34px;text-align:right">${secCount(kind,k)}</span>
          <button class="btn ghost sdel" data-k="${k}" title="Удалить раздел">✕</button>
        </div>`).join('')}</div>
      <div class="row" style="margin-top:12px">
        <input type="text" id="snew" placeholder="Название нового раздела" style="flex:1;min-width:0">
        <button class="btn sm" id="sadd">Добавить</button></div>
      <div class="small muted" style="margin-top:10px;line-height:1.55">🤖 — раздел доступен ИИ: советы на день, неделю и месяц сверяются с ним как с целями, убеждениями и ценностями.<br>
        Удалить можно только пустой раздел — сначала перенесите записи.</div>
      <div class="row" style="margin-top:14px"><span class="spacer"></span>
        <button class="btn" data-close>Закрыть</button>
        <button class="btn primary" id="sok">Сохранить</button></div>`);
    $$('.sai').forEach(b=>b.onclick=()=>{ apply(); aiSecToggle(kind,b.dataset.k); draw(); });
    /* Порядок разделов — порядок массива DB.sec[kind]: в нём же они идут
       в ряду на вкладке. Меняем местами с соседом среди видимых, скрытый
       «Ж» при закрытом разделе не трогаем. Применяется сразу — вкладка
       под окном перерисовывается, «Сохранить» для этого не нужен. */
    $$('.smv-b').forEach(b=>b.onclick=()=>{
      apply();
      const k=b.dataset.k, d=+b.dataset.d, vk=vis().map(s=>s[0]), j=vk.indexOf(k)+d;
      if(j<0||j>=vk.length) return;
      const L=secs(kind), a=L.findIndex(s=>s[0]===k), c=L.findIndex(s=>s[0]===vk[j]);
      [L[a],L[c]]=[L[c],L[a]];
      save(); draw(); after&&after();
      const nb=$(`.smv-b[data-k="${k}"][data-d="${d}"]`); if(nb&&!nb.disabled) nb.focus();
    });
    $('#sadd').onclick=()=>{
      const t=$('#snew').value.trim(); if(!t) return toast('Введите название');
      apply();
      secs(kind).push(['u'+uid(),t]);
      save(); draw();
    };
    $$('.sdel').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(secCount(kind,k)) return toast('Раздел не пуст');
      if(secs(kind).length<=1) return toast('Нужен хотя бы один раздел');
      if(!confirm('Удалить раздел «'+secName(kind,k)+'»?')) return;
      apply();
      DB.sec[kind]=secs(kind).filter(s=>s[0]!==k);
      DB.secDel[kind].push(k);
      if(kind==='notes') delete (DB.notes||{})[k];
      save(); draw();
    });
    $('#sok').onclick=()=>{ apply(); save(); closeSheet(); after&&after() };
  };
  /* переносим введённые названия в данные, не закрывая окно */
  const apply=()=>{
    const L=secs(kind);
    $$('.snm').forEach(i=>{
      const t=i.value.trim(); if(!t) return;
      const s=L.find(s=>s[0]===i.dataset.k); if(s) s[1]=t;
    });
  };
  draw();
}
function rGoals(){
  initFilters();
  const scs=SCOPES(), g=DB.goals.filter(x=>x.scope===gfilter), done=g.filter(x=>x.done).length;
  $('#v-goals').innerHTML=`
  <div class="card">
    <div class="chips">
      ${scs.map(([k,n])=>`<button class="chip gf ${gfilter===k?'on':''}" data-s="${k}">${aiSecOn('goals',k)?'<span class="chip-ai" title="Доступен ИИ">🤖</span>':''}${n} ${DB.goals.filter(x=>x.scope===k).length}</button>`).join('')}
      <button class="chip gf" id="gsec" title="Управление разделами">⚙</button>
    </div>
    <div style="margin-top:12px" class="row">
      <div class="bar" style="flex:1"><i style="width:${g.length?done/g.length*100:0}%"></i></div>
      <span class="small muted">${done} из ${g.length}</span>
    </div>
    <button class="btn sm" id="gAdd" style="margin-top:11px">+ Новая цель</button>
  </div>
  ${g.length?g.map(x=>`
    <div class="row" style="margin-bottom:7px;gap:4px">
    <button class="pill gtg ${x.done?'on':''}" data-id="${x.id}" style="flex:1;margin:0">
      <span class="box"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
      <span class="nm" style="${x.done?'opacity:.55;text-decoration:line-through':''}">${esc(x.text)}</span>
    </button>
    <button class="btn ghost ged" data-id="${x.id}" title="Изменить" style="flex:none">✎</button>
    </div>`).join(''):'<div class="empty">Целей нет</div>'}
  ${g.length?'<div class="small muted" style="margin:2px 2px 0">Тап — отметить, ✎ — правка и перенос в другой раздел</div>':''}`;
  $$('.gf').forEach(b=>b.onclick=()=>{if(b.id==='gsec') sectionsSheet('goals',rGoals);else{gfilter=b.dataset.s;rGoals()}});
  $$('.gtg').forEach(b=>b.onclick=()=>{
    const x=DB.goals.find(y=>y.id===b.dataset.id); x.done=!x.done; save(); rGoals()});
  $$('.ged').forEach(b=>b.onclick=()=>editGoal(b.dataset.id));
  $('#gAdd').onclick=()=>{
    openSheet(`<h2>Новая цель</h2>
      <label class="fld" style="margin-bottom:12px"><span>Текст</span><input type="text" id="gt"></label>
      <label class="fld" style="margin-bottom:16px"><span>Раздел</span><select id="gs">${SCOPES().map(([k,n])=>`<option value="${k}"${k===gfilter?' selected':''}>${n}</option>`).join('')}</select></label>
      <div class="row"><button class="btn" data-close style="flex:1">Отмена</button>
        <button class="btn primary" id="gok" style="flex:1">Добавить</button></div>`);
    setTimeout(()=>$('#gt').focus(),80);
    $('#gok').onclick=()=>{const t=$('#gt').value.trim();if(!t)return toast('Пусто');
      DB.goals.unshift({id:uid(),text:t,scope:$('#gs').value,done:false,created:today()});
      save();closeSheet();rGoals()};
  };
}
/* ---- перенос записи: между разделами и между целями и заметками ----
   Цель и заметка — это один и тот же текст в разных списках, поэтому
   в окне правки два связанных выпадающих списка: тип и раздел.
   Наборы разделов у целей и заметок разные, так что смена типа
   перерисовывает второй список. */
const secOpts=(kind,sel)=>secs(kind)
  /* скрытый раздел показываем, только если он открыт или запись уже в нём */
  .filter(([k])=>k!==HIDDEN_SEC||zhOpen||k===sel)
  .map(([k,n])=>`<option value="${k}"${k===sel?' selected':''}>${n}</option>`).join('');
const typeFields=(kind,sec)=>`
  <label class="fld" style="margin-bottom:12px"><span>Тип</span>
    <select id="ekind">
      <option value="goals"${kind==='goals'?' selected':''}>Цель</option>
      <option value="notes"${kind==='notes'?' selected':''}>Заметка</option>
    </select></label>
  <label class="fld" style="margin-bottom:16px"><span>Раздел</span>
    <select id="esec">${secOpts(kind,sec)}</select></label>`;
function bindTypeFields(kind,sec){
  $('#ekind').onchange=()=>{
    const k=$('#ekind').value;
    /* вернулись к исходному типу — возвращаем и исходный раздел */
    $('#esec').innerHTML=secOpts(k, k===kind?sec:'');
  };
}
const kindName=k=>k==='goals'?'цели':'заметки';
/* Куда бы запись ни уехала, сообщаем полный адрес: тип и раздел. */
function movedToast(kind,sec){ toast('Перенесено в '+kindName(kind)+', «'+secName(kind,sec)+'»') }

/* Правка цели: текст, тип и раздел в одном окне, там же удаление. */
function editGoal(id){
  const x=DB.goals.find(y=>y.id===id); if(!x) return;
  openSheet(`<h2>Цель</h2>
    <label class="fld" style="margin-bottom:12px"><span>Текст</span>
      <input type="text" id="gt" value="${esc(x.text)}"></label>
    ${typeFields('goals',x.scope)}
    <div class="row"><button class="btn danger" id="gdel">Удалить</button>
      <span class="spacer"></span>
      <button class="btn" data-close>Отмена</button>
      <button class="btn primary" id="gok">Сохранить</button></div>`);
  bindTypeFields('goals',x.scope);
  $('#gdel').onclick=()=>{
    if(!confirm('Удалить цель?'))return;
    DB.goals=DB.goals.filter(y=>y.id!==id); save(); closeSheet(); rGoals();
  };
  $('#gok').onclick=()=>{
    const t=$('#gt').value.trim(); if(!t) return toast('Пусто');
    const kind=$('#ekind').value, to=$('#esec').value;
    if(kind==='goals'){
      const moved = to!==x.scope;
      x.text=t; x.scope=to;
      save(); closeSheet(); rGoals();
      if(moved) movedToast('goals',to);
      return;
    }
    /* уходит в заметки: отметка «выполнено» там не нужна, остаётся текст */
    DB.goals=DB.goals.filter(y=>y.id!==id);
    DB.notes=DB.notes||{}; DB.notes[to]=DB.notes[to]||[];
    DB.notes[to].unshift(to==='books'?{id:uid(),text:t,read:false}:t);
    save(); closeSheet(); rGoals(); movedToast('notes',to);
  };
}

/* ================= КАЛЕНДАРЬ ЖИЗНИ ================= */
/* Дата рождения зафиксирована владельцем файла в LIFE_BIRTH выше. Поля для
   её редактирования нет: календарь начинается с января 2022 года. */
/* Начало панели — всегда первое число календарного месяца. Это важно при
   переходе между месяцами: даты 29–31 числа не должны пропускать февраль. */
const lifeMonthStart=(s,i)=>{
  const d=pISO(s);
  d.setDate(1);
  d.setMonth(d.getMonth()+i);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`;
};
const lifeLevel=(v,max)=>{
  if(v==null||v<=0||max<=0)return '';
  const q=v/max; return q>=.75?'lm4':q>=.5?'lm3':q>=.25?'lm2':'lm1';
};
const lifeMonthLabel=s=>MONS[pISO(s).getMonth()];
function rLife(){
  $('#v-life').innerHTML=visaHtml()+`
  <div class="card">
    <h2>🗓 Календарь жизни <span class="right">с 2022 года</span></h2>
    <div class="small muted">Дата рождения: 23.08.1988. Каждая панель — один календарный месяц; число внутри — сумма баллов за дни этого месяца.</div>
    <button class="btn sm" id="shiftOpen" style="margin-top:11px">📅 График 2/2</button>
  </div>
  ${lifeGrid()}`;
  $('#shiftOpen').onclick=shiftCalendarSheet;
  const vb=$('#visaBtn'); if(vb) vb.onclick=visaSheet;
  $$('.life-month[data-d]').forEach(b=>bindLifeMonth(b));
  $$('.life-yr').forEach(b=>b.onclick=()=>lifeYearSheet(b.dataset.y));
}
function shiftCalendarSheet(){
  const y=new Date().getFullYear();
  openSheet(`<h2>График работы 2/2</h2>
    <div class="shift-year-control">
      <button class="btn sm nav" id="shiftPrev" title="Предыдущий год" aria-label="Предыдущий год">‹</button>
      <label class="fld"><span>Год</span><input type="number" id="shiftYear" min="2000" max="2100" step="1" value="${y}"></label>
      <button class="btn sm nav" id="shiftNext" title="Следующий год" aria-label="Следующий год">›</button>
    </div>
    <div id="shiftPreview">${shiftCalendarHtml(y)}</div>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn primary" data-close>Закрыть</button></div>`);
  const input=$('#shiftYear'), preview=$('#shiftPreview');
  const draw=n=>{
    n=clamp(Math.round(+n||y),2000,2100); input.value=n;
    preview.innerHTML=shiftCalendarHtml(n);
  };
  input.oninput=e=>draw(e.target.value);
  $('#shiftPrev').onclick=()=>draw(+input.value-1);
  $('#shiftNext').onclick=()=>draw(+input.value+1);
}
function shiftCalendarHtml(year){
  const months=[];
  for(let m=0;m<12;m++){
    const first=`${year}-${pad(m+1)}-01`, d=pISO(first), count=new Date(year,m+1,0).getDate();
    const cells=[];
    /* Неделя в сетке начинается с понедельника (заголовок «пн … вс»), а
       getDay() считает с воскресенья (0). Без пересчёта все дни уезжали на
       одну клетку вправо: понедельник 02.11.2026 стоял под «вт». */
    for(let i=0;i<(d.getDay()+6)%7;i++) cells.push('<i></i>');
    for(let day=1;day<=count;day++){
      const key=`${year}-${pad(m+1)}-${pad(day)}`;
      const manual=DB.days[key]?.work!=null;
      cells.push(`<i class="${isWork(key)?'work':'off'}${manual?' manual':''}${key===today()?' today':''}" title="${fmtFull(key)} — ${isWork(key)?'рабочий':'выходной'}">${day}</i>`);
    }
    months.push(`<div class="shift-month"><h4>${MON_NOM[m]}</h4><div class="shift-days"><i class="head">пн</i><i class="head">вт</i><i class="head">ср</i><i class="head">чт</i><i class="head">пт</i><i class="head">сб</i><i class="head">вс</i>${cells.join('')}</div></div>`);
  }
  return `<div class="shift-year"><div class="shift-months">${months.join('')}</div>
    <div class="shift-legend small muted"><i class="work"></i><span>рабочие</span><i class="off"></i><span>выходные</span><i style="outline:1.5px solid var(--accent-2);outline-offset:-1px"></i><span>ручная отметка</span><b style="font-weight:800;color:var(--ink)">${+today().slice(8)}</b><span>сегодня</span></div></div>`;
}
function lifeSummaryText(key){
  DB.lifeSummaries=DB.lifeSummaries||{};
  return DB.lifeSummaries[key]??LIFE_SUMMARIES[key]??'';
}
/* back — куда вернуться после правки: окно месяца или окно года */
function editLifeSummary(key,label,back=()=>lifeMonthSheet(key+'-01')){
  DB.lifeSummaries=DB.lifeSummaries||{};
  const old=lifeSummaryText(key);
  openSheet(`<h2>Итоги: ${label}</h2>
    <textarea id="lifeSummaryEdit" style="min-height:260px" placeholder="${key.length===4?'Введите итог года':'Введите итог месяца'}">${esc(old)}</textarea>
    <div class="row" style="margin-top:14px">
      <button class="btn danger" id="lifeSummaryDel" ${old?'':'disabled'}>Удалить</button>
      <span class="spacer"></span><button class="btn" id="lifeSummaryBack">Отмена</button>
      <button class="btn primary" id="lifeSummarySave">Сохранить</button>
    </div>`);
  $('#lifeSummarySave').onclick=()=>{
    const text=$('#lifeSummaryEdit').value.trim();

/* Тап по наступившему месяцу открывает окно итогов (lifeMonthSheet):
   там и итог, и сборка итога ИИ, и переход на 1-е число, и ручная правка.
   Прежние двойной тап и удержание больше не нужны — всё в одном окне. */
function bindLifeMonth(b){
  b.onclick=()=>lifeMonthSheet(b.dataset.d);
}
function lifeGrid(){
  const from='2022-01-01', last=today().slice(0,7)+'-01';
  const months=[];
  for(let s=from;s<=last;s=lifeMonthStart(s,1)){
    const end=lifeMonthStart(s,1), days=sortedDays().filter(d=>d>=s&&d<end);
    months.push({start:s,end,total:days.length?Math.round(days.reduce((sum,d)=>sum+score(d),0)*10)/10:0,days:days.length});
  }
  const max=Math.max(1,...months.map(x=>x.total||0));
  const years=[];
  for(let y=2022;y<=pISO(last).getFullYear();y++){
    const row=months.filter(x=>x.start.slice(0,4)===String(y));
    const cells=Array.from({length:12},(_,m)=>{
      const x=row[m], start=x?x.start:`${y}-${pad(m+1)}-01`, future=!x;
      const cls=['life-month',future?'future':x.total===0?'empty':lifeLevel(x.total,max),start.slice(0,7)===last.slice(0,7)?'now':''].filter(Boolean).join(' ');
      const title=future?`${MONS[m]} ${y} — ещё впереди`:
        `${MONS[m]} ${y}: ${x.total||0} баллов, ${x.days} дн. с данными`;
      return `<button class="${cls}" ${future?'disabled':''} ${future?'':'data-d="'+x.start+'"'} title="${title}">
        <span class="lm-n">${MONS[m]}</span><span class="lm-s">${future?'':(x.total||0)}</span></button>`;
    }).join('');
    years.push(`<div class="life-year"><h3><button class="life-yr" data-y="${y}" title="Итоги ${y} года">${y} год${lifeSummaryText(String(y))?'<i class="has"></i>':''}<span class="chev">›</span></button></h3><div class="life-months">${cells}</div></div>`);
  }

  const bud=rd('budget.v2')||rd('budget.v1'), med=rd('medcard.data'), T=today();

  while(DB.days[d]&&test(DB.days[d])){cur++;d=addD(d,-1)}

function pfDateIn(s){
  s=String(s||'').trim(); if(!s) return '';
  let m;
  if(m=s.match(/^(\d{4})(?:-(\d{1,2})(?:-(\d{1,2}))?)?$/)) return [m[1],m[2]&&pad(+m[2]),m[3]&&pad(+m[3])].filter(Boolean).join('-');
  if(m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/)) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  if(m=s.match(/^(\d{1,2})[./](\d{4})$/)) return `${m[2]}-${pad(+m[1])}`;
  return null;
}

/* ================= ИМПОРТ ДАННЫХ С БРАСЛЕТА =================
   Оригинальная выгрузка Mi Fitness. Нужны исходные CSV с двумя окончаниями:
   MiFitness_hlth_center_aggregated_fitness_data.csv — сон, пульс и шаги;
   MiFitness_hlth_center_sport_record.csv — сводные тренировки.
   Начальная часть имени (дата и номер аккаунта) меняется при каждой выгрузке,
   но окончание и заголовки должны остаться заводскими. Это намеренно строгая
   проверка: отредактированный Excel-файл или чужой CSV не попадёт в дневник. */
function parseCSV(txt){
  const t=txt.replace(/^﻿/,'');
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false }
      else f+=c;
    }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f='' }
    else if(c==='\n'){ row.push(f); f=''; rows.push(row); row=[] }
    else if(c!=='\r') f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row) }
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
/* «6,12» и «6.12» — оба варианта встречаются в выгрузке */
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
/* «01:13:00» → «01:13»; секунды в дневнике не нужны */
const hhmm=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(s||'').trim());return m?pad(+m[1])+':'+m[2]:null};

/* Строго узнаёт два оригинальных формата Mi Fitness. Возвращает формат,
   а не тип показателя: aggregated содержит сразу сон, пульс и шаги.
   Старую выгрузку Zepp Life больше не принимаем — она была промежуточной,
   отредактированной копией, а не первичными данными прибора. */
const MF_AGG='MiFitness_hlth_center_aggregated_fitness_data.csv';
const MF_SPORT='MiFitness_hlth_center_sport_record.csv';
function miFitnessKind(file,rows){
  const h=Object.keys(rows[0]||{});
  const name=file.name||'';
  if(name.endsWith(MF_AGG)&&['Uid','Sid','Tag','Key','Time','Value','UpdateTime'].every(x=>h.includes(x))) return 'mfAgg';
  if(name.endsWith(MF_SPORT)&&['Uid','Sid','Key','Time','Category','Value','UpdateTime'].every(x=>h.includes(x))) return 'mfSport';
  return null;
}
const mfDate=t=>{
  const n=Number(t); if(!Number.isFinite(n)||n<=0) return null;
  /* Time в Mi Fitness — Unix-секунды полуночи местного дня. Форматируем
     в локальной зоне устройства, а не через UTC: иначе ночные записи могут
     уехать на соседнюю дату. */
  const d=new Date(n*1000);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const mfJSON=s=>{try{const x=JSON.parse(s);return x&&typeof x==='object'?x:null}catch(e){return null}};
function miFitnessRows(rows,kind){
  const out=[];
  for(const r of rows){
    const v=mfJSON(r.Value); if(!v) continue;
    if(kind==='mfAgg'){
      const d=mfDate(r.Time); if(!d||!['sleep','heart_rate','steps'].includes(r.Key)) continue;
      /* в файле есть технические дубли {has_data:true}; у них нет чисел,
         поэтому берём лишь полноценную сводную строку. */
      if(r.Key==='sleep'&&num(v.total_duration)>0){
        const seg=Array.isArray(v.segment_details)?v.segment_details[0]:null;
        /* У спортивных часов timezone — смещение от UTC в четвертях часа
           (12 = UTC+3, 28 = UTC+7), но у старых строк оно порой неверно.
           Наилучший источник — локальная часовая зона браузера, когда
           дневник открыт у владельца данных; берём её и время не «плывёт»
           между старым и новым форматом. */
        /* Базой берём фиксированный UTC+3 (Москва, без перехода на летнее
           время), а не зону браузера: иначе на телефоне в другом поясе время
           уехало бы ещё раз. Сдвиг для дат с SLEEP_TZ_FROM делает mergeBand. */
        const localTime=t=>Number.isFinite(Number(t))?new Date(Number(t)*1000+3*3600e3).toISOString().slice(11,16):'';
        out.push({kind:'sleep',date:d,total_duration_min:v.total_duration,
          bedtime_local:seg?localTime(seg.bedtime):'',
          wakeup_local:seg?localTime(seg.wake_up_time):'',
          sleep_score:v.sleep_score,deep_min:v.sleep_deep_duration,rem_min:v.sleep_rem_duration});
      }
      else if(r.Key==='heart_rate'&&num(v.min_hr)>0) out.push({kind:'hr',date:d,min_hr:v.min_hr,resting_hr:v.avg_rhr});
      else if(r.Key==='steps'&&num(v.steps)>0) out.push({kind:'steps',date:d,steps:v.steps});
    }
    else if(kind==='mfSport'){
      /* Key — технический, но точный тип (outdoor_running, pool_swimming);
         Category иногда только общее running/swimming, и с ним потерялась бы
         раскладка в WK_MAP. */
      const d=mfDate(v.start_time??r.Time), a=String(r.Key||r.Category||'').trim();
      /* В выгрузке встретилась случайно начатая и сразу остановленная
         «тренировка» на 8 секунд с нулевой дистанцией и калориями. Её не
         считаем спортом. Короткие, но реальные занятия с дистанцией или
         калориями оставляем. */
      if(!d||!a||num(v.duration)<=0||
         (num(v.duration)<60&&!(num(v.distance)>0)&&!(num(v.calories)>0))) continue;
      out.push({kind:'workout',date:d,activity:a,distance_km:num(v.distance)>0?num(v.distance)/1000:null});
    }
  }
  return out;
}
/* ---- тренировки с браслета ----
   Прибор знает только тип занятия, разбивки по подходам в выгрузке нет.
   Бег и ходьба идут в «Кардио» с километражем, велосипед — туда же одним
   словом, остальное (силовая, плавание, единоборства) — в «Прочее».
   [поле, как назвать, писать ли километры] */
const WK_MAP={
  outdoor_running:['Кардио','бег',1],      indoor_running:['Кардио','бег на дорожке',1],
  outdoor_walking:['Кардио','ходьба',1],   indoor_walking:['Кардио','ходьба',1],
  outdoor_hiking:['Кардио','поход',1],
  outdoor_riding:['Кардио','велосипед',0], indoor_riding:['Кардио','велотренажёр',0],
  strength_training:['Прочее','силовая',0],free_training:['Прочее','силовая',0],
  pool_swimming:[EX_COLD,'плавание',0],    open_water_swimming:[EX_COLD,'плавание',0],
  muay_thai:['Прочее','муай-тай',0],       boxing:['Прочее','бокс',0],
  parallel_skiing:['Прочее','лыжи',0],     yoga:['Прочее','йога',0],
  elliptical:['Прочее','эллипс',0],        rowing:['Прочее','гребля',0],
  jump_rope:['Прочее','скакалка',0],
  /* ниже — типы, которые приходят только из Health Connect */
  pilates:['Прочее','пилатес',0],          stretching:['Прочее','растяжка',0],
  dancing:['Прочее','танцы',0],            football:['Прочее','футбол',0],
  tennis:['Прочее','теннис',0],            table_tennis:['Прочее','настольный теннис',0],
  badminton:['Прочее','бадминтон',0],      basketball:['Прочее','баскетбол',0],
  volleyball:['Прочее','волейбол',0],      climbing:['Прочее','скалолазание',0],
  stair_climbing:['Кардио','лестница',0],  surfing:['Прочее','сёрфинг',0],
  paddling:['Прочее','гребля',0],          other:['Прочее','тренировка',0]
};
const kmTxt=v=>String(Math.round(v*10)/10).replace('.',',');
/* Вставка от браслета помечается в x.exBand, чтобы повторный импорт
   заменял её, а не плодил дубли рядом с вашим текстом. */
function applyBand(x,field,txt){
  const prev=(x.exBand||{})[field];
  const cur=String((x.ex||{})[field]||'').trim();
  const parts=cur?cur.split(' · ').filter(p=>p&&p!==prev):[];
  if(txt&&!parts.includes(txt)) parts.push(txt);
  x.ex=x.ex||{};
  if(parts.length) x.ex[field]=parts.join(' · '); else delete x.ex[field];
  if(txt){ x.exBand=x.exBand||{}; x.exBand[field]=txt }
  else if(x.exBand){ delete x.exBand[field]; if(!Object.keys(x.exBand).length) delete x.exBand }
}
function mergeWorkouts(rows,st){
  /* за день бывает несколько занятий — сначала собираем, потом пишем */
  const byDay={};
  for(const r of rows){
    const d=r.date;
    if(!isDate(d)||d>today()) continue;
    const a=String(r.activity||r.sport_type||'').trim();
    const m=WK_MAP[a];
    /* незнакомый тип не выбрасываем: пишем как есть в «Прочее» */
    const[field,lb,wantKm]=m||['Прочее',a.replace(/_/g,' '),0];
    if(!lb) continue;
    const g=byDay[d]=byDay[d]||{};
    const e=g[field+'|'+lb]=g[field+'|'+lb]||{field,lb,wantKm,km:0,n:0};
    e.n++;
    const km=num(r.distance_km); if(km>0) e.km+=km;
  }
  for(const[d,g]of Object.entries(byDay)){
    const x=DB.days[d]=DB.days[d]||{};
    const byField={};
    for(const e of Object.values(g)){
      const txt = e.wantKm&&e.km>0 ? `${e.lb} ${kmTxt(e.km)} км`
                : e.n>1 ? `${e.lb} ×${e.n}` : e.lb;
      (byField[e.field]=byField[e.field]||[]).push(txt);
    }
    for(const[f,list]of Object.entries(byField)) applyBand(x,f,list.join(', '));
    x.sport=1;
    st.days.add(d);
  }
}
/* Сводит выгрузку в дневник. Данные прибора считаем точнее ручных,
   поэтому перезаписываем; счётчик ведём отдельно, чтобы показать в отчёте. */
function mergeBand(kind,rows,st,exact){
  for(const r of rows){
    const d=r.date;
    if(!isDate(d)) continue;
    /* дни из будущего игнорируем: в выгрузке попадаются пустые хвосты */
    if(d>today()) continue;
    const x=DB.days[d]=DB.days[d]||{};
    let touched=false;
    const set=(k,v)=>{
      if(v==null||v==='') return;
      if(x[k]!==v){ x[k]=v; touched=true }
    };
    if(kind==='sleep'){
      const mn=num(r.total_duration_min);
      if(mn>0) set('sleepH',Math.round(mn/60*100)/100);
      /* +4 ч только с SLEEP_TZ_FROM, как в migrateSleepTZ: раньше сдвигались
         все даты, и повторный импорт портил время сна за 2023–2026 годы */
      /* exact — время уже местное (Health Connect хранит пояс у каждой записи) */
      const tz=t=>!exact&&d>=SLEEP_TZ_FROM?shiftTime4(t):t;
      set('bed',tz(hhmm(r.bedtime_local))); set('rise',tz(hhmm(r.wakeup_local)));
      const sc=num(r.sleep_score); if(sc>0) set('sleepScore',Math.round(sc));
      const dp=num(r.deep_min); if(dp>0) set('deepMin',Math.round(dp));
      const rm=num(r.rem_min);  if(rm>0) set('remMin',Math.round(rm));
    }
    else if(kind==='hr'){
      /* «Пульс мин.» вёлся вручную как минимальный за сутки — это min_hr.
         Пульс покоя браслет считает отдельно, кладём его своим полем. */
      const mn=num(r.min_hr);     if(mn>0) set('pulse',Math.round(mn));
      const rs=num(r.resting_hr); if(rs>0) set('restHr',Math.round(rs));
    }
    else if(kind==='steps'){
      const s=num(r.steps); if(s>0) set('steps',Math.round(s));
    }
    if(touched) st.days.add(d);
  }
}
/* Сначала напоминаем точные окончания имён. Диалог выбора файла сам не
   умеет показать такую памятку без риска спрятать её под проводником. */
function importBand(){
  openSheet(`<h2>Импорт из Mi Fitness</h2>
    <div class="small" style="color:var(--ink-2);line-height:1.7">
      Выберите только <b>оригинальные</b> CSV из выгрузки Mi Fitness — не
      открытые и не пересохранённые в Excel.<br><br>
      <code>…${MF_AGG}</code><br>
      — сон, пульс и шаги.<br><br>
      <code>…${MF_SPORT}</code><br>
      — сводные тренировки.<br><br>
      Многоточие — дата и номер устройства, они у новой выгрузки меняются.
      Другие файлы приложение намеренно пропустит.

/* ================= БРАСЛЕТ С СЕРВЕРА =================
   Health Connect раз в сутки кладёт на Google Диск архив «Здоровье и спорт.zip».
   VPS раз в час проверяет его (band-sync) и выкладывает band.json — суточные
   итоги по местным датам: сон со стадиями, минимальный пульс, шаги, тренировки.
   Отдаёт файл только по ключу в заголовке X-Band-Key. Сервер в облачную копию
   Дневника не пишет: принимаем данные здесь и дальше идёт обычный обмен,
   поэтому слияние остаётся в одном месте.
   Каждый день помечается подписью bandSig — хэшем пришедших данных. Пока они не
   изменились, день не трогаем: иначе ручная правка «Лёг» затиралась бы каждые
   полчаса. Подпись лежит в записи дня и уезжает в облако, так что второе
   устройство тот же день повторно не применит. */
const BAND_EVERY=30*60e3;
const BAND={busy:false};
const bandHash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)};
function bandApply(days,st){
  for(const[d,v]of Object.entries(days)){
    if(!isDate(d)||d>today()||!isObj(v)) continue;
    const sig=bandHash(JSON.stringify(v));
    if(DB.days[d]&&DB.days[d].bandSig===sig) continue;
    const s=v.sleep;
    if(isObj(s)) mergeBand('sleep',[{date:d,total_duration_min:s.total_min,bedtime_local:s.bed,
      wakeup_local:s.rise,deep_min:s.deep_min,rem_min:s.rem_min}],st,true);
    const x=DB.days[d]=DB.days[d]||{};
    if(v.min_hr){ mergeBand('hr',[{date:d,min_hr:v.min_hr}],st); x.bandHr=v.min_hr }
    else{
      /* Сервер считает минимальный пульс только по замерам внутри сна. Нет их —
         числа нет, и пульс, который ставил сам сервер, убираем: так ушло «92»
         за 3 ноября — минимум по одной тренировке. bandHr помнит, что ставил
         сервер. У дней, принятых раньше, признак — нет оценки сна: её даёт
         только CSV, а пульс из CSV трогать нельзя. */
      const mine=x.bandHr!=null?x.pulse===x.bandHr:(!!x.bandSig&&x.sleepScore==null);
      if(x.pulse!=null&&mine) delete x.pulse;
      delete x.bandHr;
    }
    if(v.rest_hr) mergeBand('hr',[{date:d,resting_hr:v.rest_hr}],st);
    if(v.steps) mergeBand('steps',[{date:d,steps:v.steps}],st);
    /* вес вводится руками, с весов он придёт только если поле пустое */
    if(num(v.weight)>0&&x.weight==null) x.weight=num(v.weight);
    if(Array.isArray(v.workouts)&&v.workouts.length){
      /* сервер присылает все тренировки дня — прежние вставки браслета снимаем,
         иначе после исправления вида («тренировка» → «бег») остались бы обе */
      for(const f of Object.keys(x.exBand||{})) applyBand(x,f,'');
    }
    if(Array.isArray(v.workouts)&&v.workouts.length)
      mergeWorkouts(v.workouts.map(w=>({date:d,activity:w.activity,distance_km:w.distance_km})),st);
    x.bandSig=sig; st.days.add(d);
  }
}
async function bandPull(interactive){
  if(!CFG.bandUrl||!CFG.bandKey||BAND.busy) return null;
  if(!interactive&&Date.now()-(CFG.bandAt||0)<BAND_EVERY) return null;
  BAND.busy=true;
  try{
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),30000);
    let r;
    try{ r=await fetch(CFG.bandUrl,{headers:{'X-Band-Key':CFG.bandKey},cache:'no-store',signal:ctl.signal}) }
    finally{ clearTimeout(t) }
    if(r.status===403) throw new Error('сервер не принял ключ');
    if(r.status===503) throw new Error('на сервере ещё нет данных — выгрузка с Диска пока не приходила');
    if(!r.ok) throw new Error('сервер ответил '+r.status);
    const j=await r.json();
    if(!j||j.v!==1||!isObj(j.days)) throw new Error('непонятный ответ сервера');
    const st={days:new Set()};
    bandApply(j.days,st);
    const src=j.source&&j.source.modified?new Date(j.source.modified).getTime():0;
    CFG.bandAt=Date.now();
    CFG.bandMsg=`Забрано ${fmtTS(CFG.bandAt)}. Выгрузка Health Connect от ${src?fmtTS(src):'—'}, `+
      `дней в ней ${Object.keys(j.days).length}, обновлено здесь ${st.days.size}.`;
    saveCfg();
    if(st.days.size){ migrateActs(); save(); renderSafe() }
    return st.days.size;
  }catch(e){
    const msg=e.name==='AbortError'?'сервер не ответил за 30 секунд'
      :e instanceof TypeError?'нет связи с сервером':e.message;
    /* ошибку тоже засчитываем как попытку: не долбим сервер при каждом возвращении */
    CFG.bandAt=Date.now(); CFG.bandMsg='Ошибка: '+msg+' ('+fmtTS(CFG.bandAt)+')'; saveCfg();
    if(interactive) throw new Error(msg);
    return null;
  }finally{ BAND.busy=false }
}

/* Прежде импорт молча заменял базу целиком, и следующий обмен с Диском
   принимал всё, чего нет в файле, за удалённое здесь: старая выгрузка
   стирала из облака всё внесённое после неё. Теперь по умолчанию —
   объединение (ничего не удаляется, при расхождении остаётся здешнее),
   а замена сначала сохраняет текущую базу файлом. */
/* «booksRename» в файле импорта — {«старое название»: «Название — Автор»}:
   переименовывает книги по точному совпадению текста, сохраняя id и отметку
   «прочитана». Так можно привести список в порядок, не трогая книги,
   добавленные позже. Сам ключ в базу не попадает. */
function applyBookRenames(map){
  if(!isObj(map)) return 0;
  const M=new Map(Object.entries(map).map(([a,b])=>[String(a).trim(),String(b||'').trim()]));
  let n=0;
  (DB.notes.books||[]).forEach((x,i,arr)=>{
    const t=String(typeof x==='object'?x.text:x).trim(), to=M.get(t);
    if(!to||to===t) return;
    if(typeof x==='object') x.text=to; else arr[i]={id:uid(),text:to,read:false};
    n++;
  });
  return n;
}
function importSheet(name,j){

    <div class="small" style="margin-bottom:8px"><b>Объединить</b> — добавить из файла то, чего здесь нет. Ничего не удаляется; где файл и здешние данные расходятся, остаётся здешнее.</div>

  $('#imMrg').onclick=()=>{

       подтягивать разделы и настройки, которые миграции дописали бы в пустую копию */
    const m={...DB};
    for(const k of keys){ const v=merge3(undefined,DB[k],inc[k],true); if(v!==undefined) m[k]=v }
    m.updated=DB.updated;
    DB=Object.assign(BLANK(),m);
    const dd=nDays(DB)-before, dp=nPf(DB)-pf0, rn=applyBookRenames(ren);
    done(`Объединено: добавлено дней ${dd}`+(dp?`, документов в портфолио ${dp}`:'')+(ren?`, переименовано книг ${rn}`:''));
  };
  $('#imRep').onclick=()=>{
    if(!confirm(`Заменить данные содержимым файла? Дней сейчас ${nDays(DB)}, в файле ${nDays(j)}.`))return;

    dl('dnevnik-'+today()+'-до-импорта.json',JSON.stringify(DB),'application/json');
    const raw={...j}; delete raw.booksRename;
    DB=normalize(raw); applyBookRenames(ren);

  };
