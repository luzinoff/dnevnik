/* переводит ошибки Google на человеческий */
function hintAuth(msg){
  const s=String(msg);
  if(s==='NEED_LOGIN')
    return 'Вход в Google истёк. Нажмите «Войти и синхронизировать».';
  if(s==='POPUP_BLOCKED')
    return 'Браузер не дал открыть окно входа Google. Разрешите всплывающие окна для этого сайта (значок в адресной строке) и нажмите кнопку ещё раз.';
  if(s==='LOGIN_CANCELLED')
    return 'Окно входа закрыто, вход не выполнен. Нажмите кнопку ещё раз.';
  if(s==='BUSY')
    return 'Обмен с Диском уже идёт — подождите несколько секунд и повторите.';
  if(s==='NO_CLIENT_ID') return 'Сначала укажите Client ID на странице настроек.';
  if(s==='FILE_PROTO') return 'Страница открыта с диска (file://) — Google не пускает такие страницы. Откройте адрес на GitHub Pages.';
  if(/origin|redirect_uri|400/i.test(s))
    return 'Google не принял адрес страницы. В Credentials → ваш OAuth client → Authorized JavaScript origins должен быть указан '+location.origin+' — ровно так, без пути в конце.';
  if(/access_denied|отклон|denied/i.test(s))
    return 'Доступ отклонён. Обычно это значит, что ваша почта не добавлена в Test users на экране согласия (OAuth consent screen → Audience).';
  if(/403/.test(s)) return 'Google отказал (403). Проверьте, что Google Drive API включён в вашем проекте.';
  if(/Failed to fetch|NetworkError|network/i.test(s)) return 'Нет связи с Google — повторю сам, как появится интернет.';
  return 'Ошибка: '+s;
}

/* ================= ГОЛОСОВОЙ ВВОД =================
   Web Speech API: распознавание идёт средствами браузера, ничего
   не устанавливается и не подключается. Работает в Chrome, Edge
   и Safari; в Firefox API нет — там кнопка не рисуется вовсе.

   Важно про офлайн: Chrome отправляет звук на серверы Google, поэтому
   без интернета и при открытии файла с диска (file://) распознавание
   отвечает ошибкой network. Это не поломка — на GitHub Pages всё идёт.

   Готовые куски речи дописываются в textarea, а то, что распознаётся
   прямо сейчас, показывается серым под полем: промежуточный результат
   ещё меняется на лету, класть его в поле нельзя. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micRec=null, micWant=false, micTa=null, micLast=0;
/* ---- как собирается надиктованное ----
   Наивное «дописать пришедший кусок в конец поля» даёт кашу вида
   «сходить · сходить в · сходить в горы»: движок уточняет фразу
   по ходу речи и присылает её целиком заново, каждый раз помечая
   готовой и каждый раз под новым номером. Отсеивать повторы
   по номеру бесполезно — номера разные, текст тот же.

   Поэтому поле не дописывается, а пересобирается. Приложение помнит
   micBase — то, что было в поле до включения микрофона, — и список
   кусков micParts. На каждое событие хвост после базы переписывается
   заново, так что уточнение просто заменяет предыдущий вариант
   вместо того, чтобы лечь рядом с ним. */
let micBase='', micParts=[], micLive='';
/* последнее значение, которое поле получило от нас: расхождение
   означает правку руками. null — пока микрофон не трогали */
let micPrev=null;

/* Разметка ряда с кнопкой. Кладётся сразу под textarea.
   btn=false — только строка состояния, без кнопки: так сделано в окне
   новой заметки, куда микрофон включён снаружи и вторая кнопка была бы
   лишней. Гасит запись тогда закрытие окна (`micStop()` в `closeSheet()`)
   или сохранение заметки. */
function micHTML(btn=true){
  if(!SR) return `<div class="mic-row"><span class="mic-note">Голосовой ввод доступен в Chrome, Edge и Safari</span></div>`;
  if(!btn) return `<div class="mic-row"><span class="mic-note" id="micNote"></span></div>`;
  return `<div class="mic-row">
    <button type="button" class="btn mic" id="micBtn">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micLbl">Голос</span></button>
    <span class="mic-note" id="micNote"></span></div>`;
}

/* Привязка к конкретному полю. taSel — селектор textarea. */
function bindMic(taSel){
  if(!SR) return;
  const btn=$('#micBtn'), ta=$(taSel); if(!btn||!ta) return;
  btn.onclick=()=>micRec?micStop():micStart(ta);
}

function micNote(msg,err){
  const n=$('#micNote'); if(!n) return;
  n.className='mic-note'+(err?' err':'');
  n.innerHTML=msg||'';
}
function micLabel(on){
  const b=$('#micBtn'), l=$('#micLbl');
  if(b) b.classList.toggle('rec',on);
  if(l) l.textContent=on?'Стоп':'Голос';
}
/* Подсказка на время слушания. Без кнопки «Стоп» в окне надо сказать,
   чем запись заканчивается, иначе неясно, слушает ещё или нет. */
const micListen=()=>$('#micBtn')?'Слушаю. Говорите, текст добавится в поле.'
                                :'🎙 Слушаю. Говорите — текст добавится в поле. «Добавить» завершит запись.';

function micStart(ta){
  if(micRec) return;
  micTa=ta;
  const r=new SR();
  r.lang='ru-RU'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;

  r.onstart=()=>{micLabel(true);
    micNote(micListen())};

  r.onresult=e=>{
    /* Список результатов пересобираем целиком: он и есть полная картина
       сказанного за сессию. Готовые куски идут в micParts, незавершённый
       показывается серым, но в поле не пишется. */
    const parts=[]; let live='';
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript.trim(); if(!t) continue;
      if(e.results[i].isFinal) parts.push(t); else live+=' '+t;
    }
    micParts=parts; micLive=live.trim();
    micPaint();
    micNote(micLive?`<span class="mic-live">${esc(micLive)}</span>`:micListen());
  };

  r.onerror=e=>{
    const m={
      'not-allowed':'Браузер не дал доступ к микрофону. Разрешите его в настройках сайта.',
      'service-not-allowed':'Браузер не дал доступ к микрофону. Разрешите его в настройках сайта.',
      'no-speech':'Речь не распознана — попробуйте ещё раз.',
      'audio-capture':'Микрофон не найден.',
      'network':'Нет связи с распознаванием. Оно требует интернета и не работает, когда файл открыт с диска.'
    }[e.error]||('Ошибка распознавания: '+e.error);
    /* no-speech Chrome шлёт после паузы — это не повод гасить запись */
    if(e.error!=='no-speech'){ micWant=false; }
    micNote(m,true);
  };

  r.onend=()=>{
    /* Chrome сам обрывает continuous после тишины. Пока пользователь
       не нажал «Стоп» — поднимаем заново, но не чаще раза в секунду,
       иначе при отказе в доступе получим бесконечный цикл.
       Перед перезапуском накопленное закрепляем в базе: у новой сессии
       список результатов свой, начинается с пустого, и без этого
       сказанное до паузы стёрлось бы. */
    if(micWant && Date.now()-micLast>1000){
      micLast=Date.now(); micFold();
      try{ r.start(); return; }catch(err){}
    }
    micRec=null; micWant=false; micFold(); micLabel(false);
    const n=$('#micNote'); if(n&&!n.classList.contains('err')) micNote('');
  };

  micRec=r; micWant=true; micLast=Date.now();
  /* точка отсчёта: всё, что было в поле до включения микрофона */
  micBase=ta.value; micParts=[]; micLive=''; micPrev=ta.value;
  try{ r.start(); }
  catch(err){ micRec=null; micWant=false; micLabel(false); micNote('Не удалось включить микрофон.',true) }
}

function micStop(){
  micWant=false;
  if(micRec){ try{micRec.stop()}catch(e){} }
  micRec=null; micFold(); micPrev=null; micLabel(false);
}

/* Куски текущей сессии переходят в базу: дальше они уже неизменны. */
function micFold(){
  micBase=micText(); micParts=[]; micLive='';
}

/* Склейка базы и распознанного.

   Движок присылает фразу не один раз, а по мере уточнения, и каждый
   вариант помечает готовым: «Что такое» → «Что такое вин» →
   «Что такое winhome» → «Что такое winhome spearl.by». Причём он не
   только продлевает фразу, но и переписывает уже сказанные слова,
   а иногда откатывается к более короткому варианту. Поэтому проверки
   «новое начинается со старого» не хватает — сравниваем по словам
   и в обе стороны, оставляя вариант подлиннее.

   Совпадения одного слова мало: «купить хлеб» и «купить молоко» —
   разные мысли, их надо сохранить обе. Обратная сторона правила:
   дважды подряд сказанная одна и та же фраза схлопнется в одну.
   Это осознанный размен — настоящие повторы подряд в речи редки,
   а вот дубли от движка сыпались постоянно. */
function micText(){
  const out=[];
  for(const p of micParts){
    const i=out.length-1;
    if(i>=0 && micSame(out[i],p)){
      /* тот же кусок в другой редакции — держим наиболее полную */
      if(micWords(p).length>micWords(out[i]).length) out[i]=p;
      continue;
    }
    out.push(p);
  }
  return micJoin(micBase,out.join(' '));
}
/* два куска — варианты одной фразы? */
function micSame(a,b){
  const A=micWords(a), B=micWords(b);
  if(!A.length||!B.length) return false;
  const min=Math.min(A.length,B.length);
  let n=0; while(n<min && A[n]===B[n]) n++;
  /* короткий целиком лёг в начало длинного — вариант одной фразы;
     разошлось последнее слово — тоже, но лишь когда до него совпало
     не меньше двух: иначе это самостоятельная мысль */
  return n>=min || (n>=min-1 && n>=2);
}
/* для сравнения важны слова, а не регистр и знаки препинания */
const micWords=s=>s.toLowerCase().replace(/[^\wа-яё]+/gi,' ').trim().split(/\s+/).filter(Boolean);

/* Соединение базы с новым текстом: пробел между ними и заглавная буква,
   если предыдущая фраза закончена. */
function micJoin(base,add){
  if(!add) return base;
  const b=base.replace(/\s+$/,''), tail=b.trim().slice(-1);
  if(!b.trim()||'.!?'.includes(tail)) add=add.charAt(0).toUpperCase()+add.slice(1);
  return b.trim()? b+' '+add : add;
}

/* Перерисовка поля. Если между событиями пользователь правил текст
   руками, его версия становится новой базой, а распознавание
   перезапускается — иначе движок пришлёт всю фразу заново и она
   ляжет поверх правки. */
function micPaint(){
  const ta=micTa;
  if(!ta||!ta.isConnected) return micStop();
  if(micPrev!==null && ta.value!==micPrev){
    micBase=ta.value; micParts=[]; micLive=''; micPrev=ta.value;
    if(micRec){ micLast=0; try{micRec.stop()}catch(e){} }  // onend поднимет заново
    return;
  }
  ta.value=micPrev=micText();
  ta.scrollTop=ta.scrollHeight;
}

/* ================= ЗАМЕТКИ ================= */
/* список разделов — NSEC_DEF и secs('notes') выше, в блоке «Цели» */

/* ---------- ИИ-психолог для «Дневника эмоций» ----------
   Раздел узнаём по названию (ключ у него случайный). Разбор хранится в
   DB.psy по хэшу текста записи и синхронизируется, как DB.advice. Правка
   текста записи отвязывает старый разбор — его можно сделать заново. */
const emoSecKey=()=>(NSEC().find(([k,n])=>/дневник эмоций/i.test(n))||[])[0];
const psyHash=t=>{let h=5381;for(const c of String(t))h=((h*33)^c.codePointAt(0))>>>0;return 'p'+h.toString(36)};
const psyGet=t=>(DB.psy||{})[psyHash(t)];
const psyBusy={}; let psyOpen='';
const PSY_SYS=`Ты бережный и опытный психолог (КПТ, эмоционально-фокусированная терапия, ненасильственное общение).
Тебе дают запись из дневника эмоций и, для контекста, прошлые записи того же человека.
Ответь по-русски, тепло и конкретно, без морализаторства и без диагнозов. Обращайся на «ты». Коротко, пунктами.
**Что ты чувствуешь** — назови эмоции точными словами и что, вероятно, лежит под ними.
**Какая потребность задета** — справедливость, безопасность, уважение, автономия и т. п.
**Мысли-ловушки** — автоматические мысли и возможные когнитивные искажения, мягко.
**Что можно сделать** — 2–3 конкретных шага: что сделать с телом и эмоцией сейчас и как ответить конструктивно.
**Закономерность** — только если она видна по прошлым записям, иначе пропусти этот пункт.`;
async function psyRun(i){
  /* психолог разбирает только «Дневник эмоций»; скрытый «Ж» наружу не уходит никогда */
  if(nsec===HIDDEN_SEC||nsec!==emoSecKey()) return;
  const list=DB.notes[nsec]||[], text=list[i]; if(typeof text!=='string') return;
  const h=psyHash(text); if(psyBusy[h]) return;
  if(psyGet(text)&&!confirm('Разобрать заново? Прежний разбор заменится.')) return;
  const past=list.slice(i+1,i+11).filter(t=>typeof t==='string').map(t=>'- '+t).join('\n');
  psyBusy[h]=true; rNotes(); toast('Психолог думает… обычно 10–40 секунд');
  try{
    const r=await aiCall(PSY_SYS,`Запись для разбора:\n${text}\n\n`+(past?`Прошлые записи (новые сверху):\n${past}`:'Прошлых записей нет.'),{temperature:0.6});
    DB.psy=DB.psy||{}; DB.psy[h]={text:r.text,at:Date.now(),model:r.model};
    /* разбор психологом — это тоже «Разбор эмоций»: ставим плитку за сегодня.
       Так отметка появится и для записи, сделанной раньше или на устройстве
       со старой версией, где новая запись плитку ещё не ставила */
    const d=day(today()), mark=!(+d.emo>0); if(mark) d.emo=1;
    psyOpen=h; save(); toast(mark?'Разбор готов · 💭 отмечен «Разбор эмоций»':'Разбор готов');
  }catch(e){ toast(aiErr(e)) }
  finally{ delete psyBusy[h]; if(tab==='notes') rNotes() }
}

function rNotes(){
  initFilters();
  DB.notes.free=DB.notes.free||[];
  if(nsec==='books') migrateBooks();
  const list=DB.notes[nsec]||[];
  const emoKey=emoSecKey();
  /* «Книги» с 22.11.2026 живут в «Портфолио» (кнопка 🎓 на «Жизни») */
  const vis=NSEC().filter(([k])=>(k!==HIDDEN_SEC||zhOpen)&&k!==emoKey&&k!=='books');
  const isEmo=!!emoKey&&nsec===emoKey;
  $('#v-notes').innerHTML=`
  <div class="card">
    <h2 id="nTitle" style="margin-bottom:10px;user-select:none">Заметки${zhOpen?' <span class="small" style="color:var(--accent-2);font-weight:400">· скрытое открыто</span>':''}</h2>
    <div class="chips">${vis.map(([k,n])=>
    `<button class="chip ns ${nsec===k?'on':''}" data-s="${k}">${aiSecOn('notes',k)?'<span class="chip-ai" title="Доступен ИИ">🤖</span>':''}${n} ${(DB.notes[k]||[]).length}</button>`).join('')}
    <button class="chip ns" id="nsecBtn" title="Управление разделами">⚙</button></div></div>
    ${emoKey?`<button class="emo-open${isEmo?' on':''}" id="emoOpen">${esc(secName('notes',emoKey))}<span class="n">${(DB.notes[emoKey]||[]).length}</span></button>`:''}
    <div class="small muted" style="margin:2px 2px 0">Тап по заметке — правка и перенос, ⚙ — управление разделами</div>
    <!-- «+ Добавить» отделено от ряда разделов подсказкой: рядом с «⚙» их путали -->
    <div class="row" style="margin:11px 2px"><button class="btn sm" id="nAdd">+ Добавить заметку</button>
    ${SR?`<button class="btn sm mic" id="nVoice" title="Новая заметка голосом">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Голосом</button>`:''}
    ${zhOpen?'<span class="spacer"></span><button class="btn sm ghost" id="nLock">Скрыть</button>':''}</div>
  ${list.length?`<div class="card">${list.map((item,i)=>{
    const book=nsec==='books', b=book&&(typeof item==='object'?item:{text:item,read:false});
    const text=book?b.text:item;
    return `<div class="row" style="align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-soft)">
      ${book?`<button class="btn ghost bookRead${b.read?' on':''}" data-i="${i}" title="${b.read?'Отметить как непрочитанную':'Отметить как прочитанную'}" aria-label="${b.read?'Непрочитанная':'Прочитанная'}">${b.read?'✓':'○'}</button>`:''}
      <span class="nedit" data-i="${i}" style="flex:1;cursor:pointer;${book&&b.read?'color:var(--ink-3);text-decoration:line-through':''}">${hl(text)}</span>
      ${isEmo?`<button class="btn ghost psyBtn" data-i="${i}" title="${psyGet(text)?'Разобрать заново':'Разбор ИИ-психологом'}">${psyBusy[psyHash(text)]?'…':'🧠'}</button>`:''}
      <button class="btn ghost nd" data-i="${i}" title="Удалить">✕</button></div>
      ${isEmo&&psyGet(text)?`<details class="psy"${psyOpen===psyHash(text)?' open':''}><summary>🧠 Разбор психолога · ${esc(new Date(psyGet(text).at).toLocaleDateString('ru',{day:'numeric',month:'short'}))}</summary><div class="ai-text">${aiHtml(psyGet(text).text)}</div></details>`:''}`}).join('')}</div>`
    :'<div class="empty">Пусто</div>'}`;
  $$('.ns').forEach(b=>b.onclick=()=>{if(b.id==='nsecBtn') sectionsSheet('notes',rNotes);else{nsec=b.dataset.s;rNotes()}});
  /* три быстрых тапа по слову «Заметки» открывают скрытый раздел */
  $('#nTitle').onclick=()=>{
    if(zhOpen) return;
    zhTaps++; clearTimeout(zhT); zhT=setTimeout(()=>zhTaps=0,900);
    if(zhTaps>=3){ zhTaps=0; zhOpen=true; nsec=HIDDEN_SEC;
      if(navigator.vibrate)navigator.vibrate(20); rNotes(); }
  };
  const lk=$('#nLock'); if(lk)lk.onclick=()=>{zhOpen=false;nsec='';initFilters();rNotes()};
  $$('.nd').forEach(b=>b.onclick=()=>{
    if(!confirm('Удалить?'))return;
    const gone=DB.notes[nsec].splice(+b.dataset.i,1)[0];
    if(isEmo&&DB.psy&&typeof gone==='string') delete DB.psy[psyHash(gone)];
    save();rNotes()});
  const eo=$('#emoOpen'); if(eo) eo.onclick=()=>{nsec=emoKey;rNotes()};
  $$('.psyBtn').forEach(b=>b.onclick=()=>psyRun(+b.dataset.i));
  $$('.bookRead').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const x=DB.notes.books[+b.dataset.i];
    if(typeof x==='string') DB.notes.books[+b.dataset.i]={id:uid(),text:x,read:true};
    else x.read=!x.read;
    save(); rNotes();
  });
  $$('.nedit').forEach(b=>b.onclick=()=>editNote(+b.dataset.i));
  $('#nAdd').onclick=()=>addNote(false);
  const nv=$('#nVoice'); if(nv) nv.onclick=()=>addNote(true);
}

/* Окно новой заметки. Двери в него две, и режим задаётся ими:
   «+ Добавить заметку» — просто поле, «Голосом» — поле с уже включённым
   микрофоном. Своей кнопки микрофона здесь нет: выбор сделан снаружи,
   и вторая кнопка на том же экране только сбивала бы. Остаётся строка
   состояния — видно, что запись идёт и что распознаётся сейчас.
   Запись глушит закрытие окна (`micStop()` внутри `closeSheet()`),
   то есть и «Отмена», и «Добавить».

   Микрофон запускается синхронно, внутри обработчика клика: браузер
   даёт к нему доступ только по жесту пользователя, а через setTimeout
   жест уже потерян. */
function addNote(voice){
  openSheet(`<h2>Заметка · ${secName('notes',nsec)}</h2>
    <textarea id="ntx" placeholder="Текст"></textarea>
    ${voice?micHTML(false):''}
    <div class="row" style="margin-top:14px"><button class="btn" data-close style="flex:1">Отмена</button>
    <button class="btn primary" id="nok" style="flex:1">Добавить</button></div>`);
  if(voice && SR) micStart($('#ntx'));
  setTimeout(()=>$('#ntx').focus(),80);
  $('#nok').onclick=()=>{const t=$('#ntx').value.trim();if(!t)return toast('Пусто');
    DB.notes[nsec]=DB.notes[nsec]||[];
    DB.notes[nsec].unshift(nsec==='books'?{id:uid(),text:t,read:false}:t);
    /* новая запись в «Дневнике эмоций» сама ставит сегодня плитку «Разбор эмоций»
       (если она ещё не стоит; несколько записей балл не раздувают) */
    let emoMark=false;
    if(nsec&&nsec===emoSecKey()){ const d=day(today()); if(!(+d.emo>0)){ d.emo=1; emoMark=true } }
    save();closeSheet();rNotes();
    if(emoMark) toast('💭 Отмечен «Разбор эмоций» за сегодня')};
}
/* Правка заметки: текст, тип и раздел в одном окне. Смена раздела —
   это перенос: запись уходит из текущего списка в начало выбранного.
   Смена типа на «Цель» переносит текст в Цели невыполненной. */
function editNote(i){
  const from=nsec, raw=(DB.notes[from]||[])[i];
  if(raw==null) return;
  const book=from==='books', cur=book?(typeof raw==='object'?raw:{text:raw,read:false}):raw;
  openSheet(`<h2>Заметка</h2>
    <textarea id="ntx">${esc(book?cur.text:cur)}</textarea>
    ${micHTML()}
    <div style="margin-bottom:12px"></div>
    ${typeFields('notes',from)}
    <div class="row"><button class="btn danger" id="ndel">Удалить</button>
      <span class="spacer"></span>
      <button class="btn" data-close>Отмена</button>
      <button class="btn primary" id="nok">Сохранить</button></div>`);
  bindTypeFields('notes',from);
  bindMic('#ntx');
  $('#ndel').onclick=()=>{
    if(!confirm('Удалить?'))return;
    DB.notes[from].splice(i,1); save(); closeSheet(); rNotes();
  };
  $('#nok').onclick=()=>{
    const t=$('#ntx').value.trim(); if(!t) return toast('Пусто');
    const kind=$('#ekind').value, to=$('#esec').value;
    if(kind==='notes'){
      if(to===from){
        if(from==='books'){
          const b=DB.notes[from][i];
          DB.notes[from][i]=typeof b==='object'?{...b,text:t}:{id:uid(),text:t,read:false};
        }else DB.notes[from][i]=t;
      }else{
        DB.notes[from].splice(i,1);
        DB.notes[to]=DB.notes[to]||[];
        DB.notes[to].unshift(to==='books'?{id:uid(),text:t,read:false}:t);
      }
      save(); closeSheet(); rNotes();
      if(to!==from) movedToast('notes',to);
      return;
    }
    /* уходит в цели: новая цель, ещё не выполненная */
    DB.notes[from].splice(i,1);
    DB.goals.unshift({id:uid(),text:t,scope:to,done:false,created:today()});
    save(); closeSheet(); rNotes(); movedToast('goals',to);
  };
}

/* ================= ИКОНКА ДЛЯ ГЛАВНОГО ЭКРАНА =================
   SVG-фавикон уже в <head>, но iOS его не берёт для ярлыка, а Chrome
   предпочитает растр. Рисуем PNG прямо здесь — файл остаётся один.
   Пометка data-gen: при сборке публичного index.html эти теги вырезаются,
   на опубликованной странице они создадутся заново при открытии. */
function makeIcon(px){
  const c=document.createElement('canvas'); c.width=c.height=px;
  const g=c.getContext('2d'), u=px/64, R=(x,y,w,h,r,f)=>{
    g.fillStyle=f; g.beginPath(); g.roundRect(x*u,y*u,w*u,h*u,r*u); g.fill();
  };
  R(0,0,64,64,14,'#5b7f6e');            /* фон-плашка */
  R(15,13,7,38,3.5,'#41604f');          /* корешок */
  R(20,13,29,38,3,'#f7f6f3');           /* страница */
  g.fillStyle='#b4713f';                /* закладка */
  g.beginPath(); g.moveTo(38*u,13*u); g.lineTo(45*u,13*u); g.lineTo(45*u,33*u);
  g.lineTo(41.5*u,29.5*u); g.lineTo(38*u,33*u); g.closePath(); g.fill();
  R(25,39,19,2.6,1.3,'#c9d3cd');        /* строки текста */
  R(25,44.5,12,2.6,1.3,'#c9d3cd');
  return c.toDataURL('image/png');
}
try{
  if(document.createElement('canvas').getContext('2d').roundRect){
    [['apple-touch-icon',180],['icon',192]].forEach(([rel,px])=>{
      const l=document.createElement('link');
      l.rel=rel; l.type='image/png'; l.sizes=px+'x'+px;
      l.href=makeIcon(px); l.dataset.gen='1';
      document.head.appendChild(l);
    });
  }
}catch(e){/* старый браузер — обойдётся SVG-иконкой */}

/* ================= СОВЕТЫ ИИ (Gemini или DeepSeek — переключатель в ⚙) =================
   Разбор дня, недели или месяца по данным дневника. Запрос уходит прямо
   из браузера в Gemini API (generateContent), сервер не нужен.

   Ключ Gemini живёт только в CFG (localStorage этого браузера): в DB его
   нет, поэтому он не попадает ни в облако, ни в выгрузки, ни в index.html.
   Ответы — в DB.advice и синхронизируются, как всё остальное:
   ключи 'd:YYYY-MM-DD', 'w:<понедельник>', 'm:YYYY-MM'.

   Что отправляется: только перечисленные ниже поля. Список разрешённый,
   а не запрещающий, — новое поле в записи само наружу не уйдёт. «Свидание»,
   «Секс», «Р», алкоголь и вещества не отправляются никогда. Тексты записей
   дня отправляются всегда (решение владельца 01.11.2026: тариф Gemini платный,
   запросы Google для обучения не использует; галочка убрана). Цели и
   заметки — позже, в aiExtras(). */
const AI_DEF_MODEL='gemini-3.6-flash';
/* Выбор ИИ общий с бюджетом и медкартой (CFG.aiProvider ← luz.shared.v1, см. luzAi).
   У Gemini — CFG.aiKey/aiModel, у DeepSeek — CFG.dsKey/dsModel. */
const aiProv=()=>luzAiProv(CFG.aiProvider), aiName=()=>LUZ_AI[aiProv()].name;
const aiKeyOf=p=>(luzAiProv(p)==='deepseek'?CFG.dsKey:CFG.aiKey)||'';
const aiModelOf=p=>(((luzAiProv(p)==='deepseek'?CFG.dsModel:CFG.aiModel)||'').trim())||LUZ_AI[luzAiProv(p)].def;
const aiKeyNow=()=>aiKeyOf(aiProv()), aiModelNow=()=>aiModelOf(aiProv());
/* Плитки «Отношений», которые в ИИ не уходят никогда: ни сама отметка,
   ни строка, дописанная в запись дня через вопрос плитки (actAsk). */
const AI_PRIV=['dapp','dating','sexn','hand'];
const AI_ACTS=ACTS.filter(a=>!AI_PRIV.includes(a.k)&&a.k!=='sport');
/* текст записи дня для ИИ: без строк приватных плиток (по значку или прежнему «Плитка:») */
function aiNoteForAi(note){
  /* строки приватных плиток узнаём по значку в начале (нынешний вид «💐 текст»)
     и по названию (прежний вид «💐 Свидание: текст», «Свидание: текст»);
     значок сравниваем и без «вариационного» символа U+FE0F — ❤ и ❤️ */
  const pre=ACTS.filter(a=>AI_PRIV.includes(a.k)).flatMap(a=>[a.ic,a.ic.replace(/️/g,''),`${a.lb}:`]);
  return String(note||'').split('\n').filter(l=>{const t=l.trim(); return !pre.some(p=>t.startsWith(p))}).join('\n');
}
const aiBusy={}, aiLastErr={};
/* Выбранный период разбора помним в sessionStorage: на телефоне страница
   при переключении приложений может перезагрузиться, и без этого карточка
   открывалась бы на другой неделе — как будто совет пропал. */
let aiPer=(()=>{try{const v=JSON.parse(sessionStorage.getItem('diary.aiPer'));if(v&&/^[wm]$/.test(v.kind)&&/^\d{4}-\d\d-\d\d$/.test(v.anchor))return v}catch(e){}return{kind:'w',anchor:today()}})();
const aiPerSave=()=>{try{sessionStorage.setItem('diary.aiPer',JSON.stringify(aiPer))}catch(e){}};

const monday=d=>{const x=pISO(d);const k=(x.getDay()+6)%7;return addD(d,-k)};
const ym=d=>d.slice(0,7);
function aiRange(kind,anchor){
  if(kind==='d') return [anchor,anchor];
  if(kind==='w'){const a=monday(anchor);return [a,addD(a,6)]}
  const a=ym(anchor)+'-01', n=pISO(a); n.setMonth(n.getMonth()+1); n.setDate(0);
  return [a,iso(n)];
}
const aiKey=(kind,anchor)=>kind==='d'?'d:'+anchor:kind==='w'?'w:'+monday(anchor):'m:'+ym(anchor);
function aiDays(a,b){const out=[];for(let d=a;d<=b;d=addD(d,1))out.push(d);return out}
function aiPeriodLabel(kind,anchor){
  const [a,b]=aiRange(kind,anchor);
  if(kind==='d') return fmtFull(a);
  if(kind==='w') return `${fmtD(a)} — ${fmtD(b)}`;
  const d=pISO(a); return ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][d.getMonth()]+' '+d.getFullYear();
}

/* одна строка данных за день — только разрешённые поля */
/* noSteps: в разборе дня шаги не отправляются (просьба владельца 02.11.2026) */
function aiDayLine(d,withText,noSteps){
  const x=DB.days[d], p=[`${fmtFull(d)}`];
  if(!x||!Object.keys(x).length) return p[0]+': записи нет';
  p.push(isWork(d)?'рабочий':'выходной');
  p.push('балл '+score(d));
  const sl=[];
  if(x.bed||x.rise||x.wake) sl.push(`лёг ${x.bed||'?'}, встал ${x.rise||x.wake||'?'}`);
  if(x.sleepH!=null) sl.push(fmtH(x.sleepH));
  /* ручная оценка сна (x.slept) в ИИ не уходит — только данные браслета (решение владельца 05.11.2026) */
  if(x.sleepScore) sl.push(`оценка браслета ${x.sleepScore}/100`);
  if(x.deepMin!=null) sl.push(`глубокий ${x.deepMin} мин`);
  if(x.remMin!=null) sl.push(`быстрый ${x.remMin} мин`);
  if(sl.length) p.push('сон: '+sl.join(', '));
  if(x.pulse) p.push('пульс мин '+x.pulse);
  if(x.restHr) p.push('пульс покоя '+x.restHr);
  if(x.weight) p.push('вес '+x.weight);
  if(x.steps&&!noSteps) p.push('шаги '+x.steps);
  if(String(x.diet||'').trim()) p.push('питание: '+String(x.diet).trim().replace(/\s+/g,' '));
  if(x.sport){
    const ex=Object.entries(x.ex||{}).filter(([,v])=>String(v).trim()).map(([k,v])=>`${k} — ${v}`);
    p.push('тренировка'+(ex.length?': '+ex.join('; '):''));
  }
  const acts=AI_ACTS.filter(a=>+x[a.k]).map(a=>a.lb+(+x[a.k]>1?' ×'+x[a.k]:''));
  if(acts.length) p.push('активности: '+acts.join(', '));
  if((x.supp||[]).length) p.push('добавки: '+x.supp.join(', '));
  const note=aiNoteForAi(x.note).trim();
  if(withText&&note) p.push('запись: «'+note.replace(/\s+/g,' ')+'»');
  return p.join('; ');
}
/* средние за набор дней — для сравнения с прошлым периодом */
function aiStats(days,noSteps){
  const v=f=>days.map(d=>DB.days[d]).filter(Boolean).map(f).filter(x=>x!=null&&x!==''&&!Number.isNaN(x)&&x!==0);
  const a=f=>{const l=v(f);return l.length?r1(avg(l.map(Number))):'—'};
  const has=days.filter(d=>DB.days[d]&&Object.keys(DB.days[d]).length);
  return [
    `дней с записями ${has.length} из ${days.length}`,
    `средний балл ${has.length?r1(avg(has.map(score))):'—'}`,
    `сон ${a(x=>x.sleepH)} ч`, `оценка сна браслетом ${a(x=>x.sleepScore)}`,
    `глубокий ${a(x=>x.deepMin)} мин`, `пульс мин ${a(x=>x.pulse)}`, `пульс покоя ${a(x=>x.restHr)}`,
    `вес ${a(x=>x.weight)}`, ...(noSteps?[]:[`шаги ${a(x=>x.steps)}`]),
    `тренировок ${has.filter(d=>DB.days[d].sport).length}`,
    ...AI_ACTS.map(k=>{const n=has.filter(d=>+DB.days[d][k.k]).length;return n?`${k.lb}: ${n} дн`:''}).filter(Boolean)
  ].join('; ');
}
/* Разделы целей и заметок, отмеченные 🤖 в окне «Разделы», уходят в советы
   как опора: цели, убеждения, ценности. Отметки — в DB.aiSec ('goals:month':
   true), синхронизируются. Раздел «Ж» не уходит никогда, даже если отметка
   каким-то образом окажется в данных. */
const aiSecOn=(kind,k)=>k!==HIDDEN_SEC&&!!(DB.aiSec||{})[kind+':'+k];
function aiSecToggle(kind,k){
  if(k===HIDDEN_SEC) return;
  DB.aiSec=DB.aiSec||{};
  const id=kind+':'+k;
  if(DB.aiSec[id]) delete DB.aiSec[id]; else DB.aiSec[id]=true;
  save();
}
const aiSecAny=()=>['goals','notes'].some(kind=>secs(kind).some(([k])=>aiSecOn(kind,k)));
function aiExtras(kind){
  const cut=t=>{t=String(t||'').trim().replace(/\s+/g,' ');return t.length>500?t.slice(0,500)+'…':t};
  const out=[];
  for(const [k,n] of secs('goals')){
    if(!aiSecOn('goals',k)) continue;
    const L=DB.goals.filter(g=>g.scope===k&&String(g.text||'').trim()).slice(0,200);
    if(!L.length) continue;
    out.push(`Цели — «${n}»:`, ...L.map(g=>'- '+(g.done?'[выполнено] ':'')+cut(g.text)));
  }
  for(const [k,n] of secs('notes')){
    if(!aiSecOn('notes',k)) continue;
    const L=((DB.notes||{})[k]||[]).map(x=>typeof x==='string'?{text:x}:x||{}).filter(x=>String(x.text||'').trim()).slice(0,200);
    if(!L.length) continue;
    out.push(`Заметки — «${n}»:`, ...L.map(x=>'- '+(k==='books'?(x.read?'[прочитана] ':'[не прочитана] '):'')+cut(x.text)));
  }
  if(!out.length) return '';
  let txt=out.join('\n');
  if(txt.length>40000) txt=txt.slice(0,40000)+'\n…(обрезано)';
  return 'Опора — цели, убеждения и ценности владельца дневника (его собственные записи). Не пересказывай их, а сверяй с ними период: что приближает к целям и соответствует ценностям, что расходится; ссылайся на конкретные пункты.\n'+txt;
}

function aiPrompt(kind,anchor){
  const [a,b]=aiRange(kind,anchor), withText=true;
  const L=[];
  if(kind==='d'){
    L.push(`Разбери день ${fmtFull(a)}.`,'','Этот день:',aiDayLine(a,withText,true),'','Предыдущие 7 дней для фона:');
    aiDays(addD(a,-7),addD(a,-1)).forEach(d=>L.push('- '+aiDayLine(d,withText,true)));
    L.push('','Средние за эти 7 дней: '+aiStats(aiDays(addD(a,-7),addD(a,-1)),true));
  } else {
    const days=aiDays(a,b>today()?today():b);
    const len=aiDays(a,b).length;
    const pa=kind==='w'?addD(a,-7):(()=>{const d=pISO(a);d.setMonth(d.getMonth()-1);return iso(d)})();
    const pb=addD(a,-1);
    L.push(`Разбери ${kind==='w'?'неделю':'месяц'}: ${aiPeriodLabel(kind,anchor)}${b>today()?' (период ещё идёт, данные по сегодняшний день)':''}.`,'','По дням:');
    days.forEach(d=>L.push('- '+aiDayLine(d,withText)));
    L.push('','Итоги периода: '+aiStats(days));
    L.push(`Для сравнения — предыдущ${kind==='w'?'ая неделя':'ий месяц'}: `+aiStats(aiDays(pa,pb)));
    if(len!==days.length) L.push(`(в периоде ${len} дней, прошло ${days.length})`);
  }
  const ex=aiExtras(kind); if(ex) L.push('',ex);
  return L.join('\n');
}
const AI_SYSTEM=`Ты — внимательный личный коуч по самочувствию, режиму и привычкам. Тебе присылают выдержку из личного дневника одного человека: сон (время, длительность, оценка браслета, фазы), пульс, вес, шаги, тренировки, отметки активностей, добавки и лекарства, иногда записи дня. «Балл дня» — сумма отметок активностей и тренировки, чем больше, тем насыщеннее день. «Рабочий/выходной» — смены по графику 2/2.
Отвечай по-русски, тепло, но по делу и коротко — так, чтобы прочитать за минуту. Опирайся только на присланные данные, ничего не выдумывай и не пересказывай таблицу. Ищи связи (сон и пульс, нагрузка и самочувствие, рабочие и выходные дни, привычки и балл), только если они действительно видны.
Формат:
**Коротко** — 1–2 предложения.
**Что получилось** — 2–3 пункта.
**На что обратить внимание** — 1–3 пункта.
**Цели и ценности** — 1–3 пункта: что приближает к целям и соответствует ценностям, что расходится; ссылайся на конкретные пункты. Только если прислана «Опора», иначе этот раздел пропусти.
**Советы на {когда}** — 2–4 конкретных, выполнимых шага.
Пункты начинай с «- ». Без диагнозов и без советов по дозировкам лекарств и добавок; если что-то выглядит тревожно для здоровья — мягко предложи обсудить это с врачом.`;

async function aiAsk(kind,anchor){
  const when=kind==='d'?'завтра':kind==='w'?'следующую неделю':'следующий месяц';
  return aiCall(AI_SYSTEM.replace('{когда}',when),aiPrompt(kind,anchor));
}
/* Один запрос к выбранному ИИ (Gemini или DeepSeek): инструкция + текст. Общий для советов, итогов месяца и психолога. */
async function aiCall(system,prompt,opt={}){
  return luzAi({provider:aiProv(),key:aiKeyNow(),model:aiModelNow(),system,contents:prompt,temperature:opt.temperature??0.7});
}
function aiErr(e){return luzAiErr(e,aiProv(),aiModelNow(),'в настройках (⚙)')}
/* простая разметка ответа: **жирный** и пункты «- » — без чужого HTML */
function aiHtml(t){
  return esc(t).split('\n').map(l=>{
    l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/,'<b>$1</b>');
    const m=/^\s*[-*•]\s+(.*)$/.exec(l);
    return m?`<div class="ai-li">${m[1]}</div>`:(l.trim()?`<div>${l}</div>`:'<div class="ai-gap"></div>');
  }).join('');
}

function aiBody(kind,anchor){
  const key=aiKey(kind,anchor), a=(DB.advice||{})[key], busy=aiBusy[key], err=aiLastErr[key];
  const what=kind==='d'?'этот день на фоне прошлой недели':kind==='w'?'неделю по дням и сравнит с прошлой':'месяц по дням и сравнит с прошлым';
  const fields=(kind==='d'?'сон, пульс, вес':'сон, пульс, вес, шаги')+', тренировки, активности, добавки, питание, тексты записей'+(aiSecAny()?' и сверит с отмеченными 🤖 разделами целей и заметок':'');
  return `
    ${err&&!busy?`<div class="small ai-err">${esc(err)}</div>`:''}
    ${busy?`<div class="small muted ai-wait">${aiName()} думает… Можно уйти на другую вкладку — ответ сохранится сам.</div>`
      : a?`<div class="ai-text">${aiHtml(a.text)}</div>
        <div class="small muted" style="margin-top:8px">${esc(fmtTS(a.at))} · ${esc(a.model||'')}${a.cut?' · ответ обрезан по длине':''}</div>`
      : `<div class="small muted">${aiName()} разберёт ${what}: ${fields}.</div>`}
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px">
      ${aiKeyNow()
        ?`<button class="btn sm primary ai-go" ${busy?'disabled':''}>${a?'Обновить совет':'Получить совет'}</button>`
        :`<button class="btn sm primary ai-set">Подключить ${aiName()}</button>`}
      <button class="btn sm ghost ai-prev">Что отправится</button>
      ${a&&!busy?'<button class="btn sm ghost ai-del">Удалить</button>':''}
    </div>`;
}

      const r=await aiCall(AI_LIFE_SYSTEM,lifePrompt(key,withText),{temperature:0.4});
      lifeDraft[key]=r.text.replace(/\*\*/g,'').trim();
      toast('Черновик итога готов');
    }catch(e){ lifeErr[key]=aiErr(e); toast(lifeErr[key]) }
    finally{ delete lifeBusy[key]; open() }
  };
}
/* Итоги года: тот же DB.lifeSummaries, ключ — четыре цифры года («2024»).
   Отдельного поля нет намеренно: слияние при синхронизации, импорт и
   выгрузка работают с ним без изменений. Сборки ИИ здесь нет: итог года
   пришлось бы собирать из итогов месяцев, а в них встречаются алкоголь
   и вещества, которые в Gemini не отправляются никогда. */
function lifeYearSheet(y){
  const key=String(y), label=`${y} год`;
  const days=sortedDays().filter(d=>d.startsWith(key+'-'));
  const total=Math.round(days.reduce((s,d)=>s+score(d),0)*10)/10;
  const text=lifeSummaryText(key);
  openSheet(`<h2>Итоги: ${esc(label)}</h2>
    <div class="small muted" style="margin:-8px 0 10px">${days.length} дн. с записями · ${total} баллов</div>
    <div class="life-summary">${esc(text||'Итог за этот год пока не добавлен.')}</div>
    <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap">
      <button class="btn sm ghost" id="lyEdit">Править вручную</button>
      <span class="spacer"></span><button class="btn primary" data-close>Закрыть</button></div>`);
  $('#lyEdit').onclick=()=>editLifeSummary(key,label,()=>lifeYearSheet(y));
}
/* ================= СТАРТ ================= */
load(); applyTheme(); render();
/* Обмен при запуске и при каждом возвращении к приложению: на телефоне
   значок с главного экрана обычно не перезагружает страницу, а поднимает
   её из памяти. Чаще раза в 20 секунд по возвращению к Диску не ходим. */
function syncOnReturn(){
  bandPull(false);   // сам решает, пора ли; работает и без входа в Google
  if(!autoOn()||Date.now()-SY.seen<20000) return;
  SY.seen=Date.now(); syncNow(false).catch(()=>{});
}
syncOnReturn();
/* Уход со страницы: отложенный обмен — немедленно. На телефоне
   beforeunload часто не срабатывает, поэтому то же на скрытии вкладки. */
const flushPush=()=>{
  if(SY.timer){clearTimeout(SY.timer);SY.timer=null;syncNow(false).catch(()=>{})}
  else if(SY.pending&&!SY.busy){SY.pending=false;syncNow(false).catch(()=>{})}
};
document.addEventListener('visibilitychange',()=>{document.hidden?flushPush():syncOnReturn()});
window.addEventListener('focus',syncOnReturn);
window.addEventListener('pagehide',flushPush);
/* общие настройки поменяли в бюджете или медкарте (в соседней вкладке) */
function luzDiaryOnShared(){
  const before=CFG.clientId;
  Object.assign(CFG,luzShared.pull(luzDiaryOwn()));
  if(CFG.clientId!==before){tok=null;tokExp=0}
  try{localStorage.setItem(LSC,JSON.stringify(CFG))}catch(_){}
  if(tab==='day'||tab==='stats') renderSafe();
}
window.addEventListener('storage',e=>{ if(e.key===LUZ_SHARED) luzDiaryOnShared() });
window.addEventListener('beforeunload',flushPush);
/* Кнопка 🔄 в шапке — как в медкарте: одно нажатие сразу запускает обмен.
   Не настроено (нет Client ID) или страница открыта с диска — открываем
   окно синхронизации, там и объяснение, и настройки. */
$('#syncBtn').addEventListener('click',async()=>{
  if(!CFG.clientId||location.protocol==='file:') return syncSheet();
  if(SY.busy) return toast('Обмен уже идёт');
  try{
    const r=await syncNow(true);
    toast(!r?'Готово' : r.got&&r.sent?'Синхронизировано: правки получены и отправлены'
      : r.got?'Синхронизировано: пришли правки с Диска'
      : r.sent?'Синхронизировано: правки отправлены на Диск' : 'Синхронизировано, изменений нет');
  }catch(e){ toast(hintAuth(e.message)) }
});
/* ---- установка как приложение (PWA) ----
   Манифест, иконки и sw.js лежат рядом с index.html на GitHub Pages.
   Подключаем их только по http(s): с диска (file://) браузер манифест
   не читает и service worker не регистрирует, а в консоли были бы ошибки.
   sw.js отдаёт страницу «сначала сеть», без сети — последнюю копию. */
var pwaPrompt=null; /* var и function: rStats() может позвать pwaPaint() раньше, чем дошёл бы let */
function pwaStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function pwaIOS(){return /iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
if(/^https?:$/.test(location.protocol)){
  /* на сайте есть настоящий файл иконки без скруглений (iOS скругляет сам) —
     нарисованную makeIcon() для iOS снимаем, чтобы не было двух */
  document.querySelectorAll('link[rel="apple-touch-icon"][data-gen]').forEach(l=>l.remove());
  for(const [rel,href] of [['manifest','manifest.webmanifest'],['apple-touch-icon','apple-touch-icon.png']]){
    const l=document.createElement('link'); l.rel=rel; l.href=href; document.head.appendChild(l);
  }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); pwaPrompt=e; if(tab==='stats') pwaPaint()});
window.addEventListener('appinstalled',()=>{pwaPrompt=null; pwaPaint(); toast('Дневник установлен')});
/* кнопка в «Статистике → Данные»: видна, когда браузер готов установить
   (Chrome, Edge) или на iPhone вне установленного режима — там только подсказка */
function pwaPaint(){
  const b=$('#pwaB'); if(!b) return;
  b.hidden=pwaStandalone()||!(pwaPrompt||(pwaIOS()&&/^https?:$/.test(location.protocol)));
}
async function pwaInstall(){
  if(pwaPrompt){ const p=pwaPrompt; pwaPrompt=null; p.prompt(); await p.userChoice.catch(()=>{}); pwaPaint(); return }
  openSheet(`<h2>📲 Установить на iPhone</h2>
    <div class="small" style="line-height:1.6">Откройте дневник в Safari, нажмите «Поделиться» (квадрат со стрелкой вверх)
      и выберите «На экран „Домой“». Дневник появится иконкой и будет открываться без адресной строки,
      в том числе без интернета.</div>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn primary" data-close>Понятно</button></div>`);
}
</script>
